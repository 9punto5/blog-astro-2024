worker_processes auto;

events {
  worker_connections  1024;
  multi_accept on;
}

http {
  # Configuración básica
  include       /opt/homebrew/etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # Buffer size para POST submissions
  client_body_buffer_size 10K;
  client_max_body_size 8m;
  
  # Buffer size para Headers
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  
  # Timeouts
  client_body_timeout 12;
  client_header_timeout 12;
  keepalive_timeout 15;
  keepalive_requests 100;
  send_timeout 10;

  # Configuración de cache
  open_file_cache max=2000 inactive=20s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;

  # Optimización de archivos estáticos global
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # Logging para debug
  log_format detailed '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /opt/homebrew/var/log/nginx/access.log detailed buffer=16k;
  error_log /opt/homebrew/var/log/nginx/error.log error;

  # Configuración del servidor
  server {
    listen 8080;
    server_name   _;

    root   /Users/fabianhtml/Proyectos/9punto5/blog-astro-2024/dist;
    index  index.html index.htm;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_comp_level 6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Headers de seguridad globales
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; media-src 'self'; frame-src 'self'; worker-src 'self'; manifest-src 'self';" always;
    add_header Service-Worker-Allowed "/blog/" always;

    # Bloquear peticiones específicas de Next.js
    location ~ ^/_next {
        return 404;
        access_log off;
        log_not_found off;
    }

    # Manejo de archivos estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|mjs)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
    }

    # Manejo de archivos HTML
    location ~* \.html$ {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
        expires 0;
    }

    # Servir archivos estáticos de Astro con cache
    location ~ ^/(assets|images|chunks|entry\.[a-zA-Z0-9]+\.mjs)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        try_files $uri $uri/ =404;
        access_log off;
        log_not_found off;
    }

    # Redirección de la raíz al blog
    location = / {
        return 301 /blog/;
    }

    # Ruta principal del blog
    location /blog/ {
        try_files $uri $uri.html $uri/index.html /index.html =404;
    }

    # Catch-all para otras rutas
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Páginas de error personalizadas
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /opt/homebrew/var/www;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/html" always;
        ssi on;
    }

    location = /50x.html {
        root /opt/homebrew/var/www;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Content-Type "text/html" always;
        ssi on;
    }
  }
}