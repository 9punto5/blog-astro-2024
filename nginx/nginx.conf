worker_processes  1;

events {
  worker_connections  1024;
}

http {
  # Configuración básica
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging para debug
  log_format detailed '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log detailed;
  error_log /var/log/nginx/error.log debug;

  # Configuración del servidor
  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # Compresión
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # Headers de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Bloquear completamente Next.js
    location ~ ^/(_next|\.next) {
        return 404;
    }

    # Bloquear peticiones a archivos .json específicos de Next.js
    location ~ /_next/data/.*\.json$ {
        return 404;
    }

    # Servir archivos estáticos de Astro con cache
    location ~ ^/blog/(_astro|assets|images)/ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        try_files $uri =404;
    }

    # Páginas de error personalizadas
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
    }

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Ruta principal del blog
    location /blog/ {
        try_files $uri $uri.html $uri/index.html /blog/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Redirección de la raíz al blog
    location = / {
        return 301 /blog/;
    }

    # Catch-all para otras rutas
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
  }
}