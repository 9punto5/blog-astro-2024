zada, lo que permite una mayor flexibilidad y diversidad en el lugar de trabajo. Las personas pueden trabajar desde diferentes lugares, ciudades y hasta países.\n\n## Trabajo híbrido\nParece ser que no pocas personas prefieren esta modalidad.\n![Medium-Image][image-1]\n\n### Híbrido sin obligación de ir a la oficina\nAquí se mantienen algunas prácticas y aspectos culturales del trabajo 100 % remoto o distribuido. \n\nEn la modalidad híbrida sin necesidad de ir a la oficina, se suele trabajar 3 a 4 días remoto y 1 o 2 días en la oficina. Es decir, parte importante del trabajo ocurre por medios digitales.\n\n### Híbrido con obligación de ir a la oficina\nEn esta modalidad se espera que los empleados trabajen principalmente desde la oficina, y el trabajo remoto es opcional.\n\nEn este caso hay pocas prácticas efectivas que respalden el trabajo remoto. Hay una cultura de trabajo remoto débil, donde muchas de las características de las organizaciones 100% remotas o distribuidas desaparecen.\n\nLas tareas \&quot;importantes\&quot;, como la colaboración, la generación de ideas, la retroalimentación, la resolución de problemas y la priorización del trabajo, ocurren predominantemente en la oficina.\n\nAunque se permite el trabajo remoto 1 o 2 veces a la semana, su principal función es facilitar la conciliación entre la vida personal y laboral, y permitir trabajar con menos interrupciones algunos días de la semana. No llega mucho más lejos que eso. También, acá es normal ver resistencia una o varias jefaturas que insistirán en la presencialidad y cuestionarán directa o indirectamente el trabajo remoto.\n\n## Los “días de home office” no son Trabajo Remoto\nLas empresas que hacen ***home office***  un día al mes, un día a la semana, como “permiso” ante una necesidad urgente. Tiene esto como una excepción a la norma.\n\nEn la experiencia de 9punto5 estas empresas son las que más problemas tienen con lo que creen es “trabajo remoto”.\n\nAquí son frecuentes las malas prácticas como: pedirse el día remoto, pero en realidad lo que se quiere es atender un tema personal, hacer un trámite, trabajar menos por alguna razón, adelantar un viaje, (¿pasar la resaca? 🍸). \n\nHabiendo entrevistado a personas de diferentes empresas con esta modalidad. Aparece de manera repetida la idea de en realidad la persona que pidió el “día de home office”, en realidad pidió el día libre. Quienes están en la oficina sienten que la persona que hace home office en realidad trabaja menos, está menos disponible (o simplemente no lo está). Interactúan con ella menos de lo que harían en un día “normal” de trabajo en que pueden verla personalmente. O, en otros casos, la presionan más para asegurarse que esté trabajando, con chat constante, o con llamadas.\n\nAlgunos jefes siendo completamente francos dicen:\n&gt;la verdad en 4 días a la semana bien trabajados las personas puede cumplir todo, entonces el 5º lo doy como home office\n\nLo ven como un costo aceptable, un beneficio para el trabajador, donde no está la expectativa de que la persona esté realmente trabajando.\n\n### Falta cultura de trabajo remoto en el home office\nSeguro los ejemplos mencionados en relación con el “día de home office” no se den en cada caso. También hay personas que lo usan sin caer en malas prácticas, y hasta son más productivas esos días, por ejemplo, por poder trabajar más tranquilas, más concentras, con menos interrupciones.\n\nPero el tema de fondo que hace que no califique para una modalidad de trabajo remoto, es que las organizaciones que lo aplican **en realidad no tienen que alterar su cultura**. Toda su estructura, procesos, sistema de comunicación, la forma de tomar decisiones y demás, son esencialmente los de una empresa presencial.\n\n## Cultura para el trabajo remoto \nNo ocurre así con la cultura de las empresas que optan por el trabajo remoto en serio .\n\nEn estos casos el trabajo se piensa como algo que no pasa por estar todas las personas trabajando juntas en el mismo lugar. Los procesos, la estructura, la forma en que se da la comunicación, las reglas, las prácticas, las herramientas, los ritos, etc., operan para un ambiente optimizado para el trabajo remoto.\n\n---\n\n&lt;Notice type=\&quot;note\&quot;&gt; Si quieres saber más sobre qué es la cultura de una organización te recomendamos revisal el artículo [¿Qué es la cultura de una organización?][1] &lt;/Notice&gt;\n\n\n\n\n[1]:\thttps://9punto5.cl/blog/cultura-organizacional-40deb867036f\n\n[image-1]:\t/blog/images/posts/engg.webp&quot;]}],[0,{&quot;slug&quot;:[0,&quot;eficiencia-de-capital-en-las-empresas-de-tecnologc3ada-a5123d3943b2&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Eficiencia de capital en las empresas de tecnología&quot;],&quot;description&quot;:[0,&quot;Después del caída en picada de WeWork debido a que quemaban plata como locos para mantener andando su sangrante negocio, empezaron algunas declaraciones de que se pondría más difícil para las…&quot;],&quot;date&quot;:[3,&quot;2020-01-28T13:00:13.662Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/eficiencia-capital.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Negocios&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Tecnología&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nDespués del caída en picada de WeWork debido a que quemaban plata como locos para mantener andando su sangrante negocio, empezaron algunas declaraciones de que se pondría más difícil para las startups de tecnología acceder a capital.\n\nSi crees eso 1) te falta información 2) no estás entendiendo que es una empresa de tecnología.\n\n## Cómo han estado los números de las empresas de tecnología\n\nPrimero veamos si el fenómeno de WeWork es igual para las empresas de tecnología. Shin Kim hizo un muy buen análisis sobre esto en Techcrunch. Los datos muestran que **la mayoría de IPOs en los últimos años en tecnología, fueron de compañías que tienen un negocio SaaS.**\n\nEn total **21 compañías SaaS**  respaldadas por VC con sede en EEUU **se han hecho públicas en los últimos 30 meses** . Y la **mayoría tiene Eficiencia de Capital** , que no gastan más de lo que ganan.\n![Medium-Image](/blog/images/posts/1*c0YeKtOTyhuGYSUuxgKLxw.jpeg)\n\nEn esto destaca el caso de Zoom que **ha levantado us $161 millones**  para conseguir **$423 millones de ARR** , o Datadog que ha conseguido $148 millones para conseguir $333 millones en ARR.\n\nLos piratas (“chantas”) del grupo son Domo, que levantó $690 millones para conseguir $128 millones de ARR (¡qué novedad! cuando entras a su página de precios, **no**  tienen una lista de precios transparentes).\n![Medium-Image](/blog/images/posts/1*Z7EtTik5lyGPWwmSF-987Q.jpeg)\n\n## Empresas SaaS auto financiadas\n\nEn este tipo de empresas (Saas) existen compañías raras para la cultura de crecimiento mega acelerado de Silicon Valley: se lo más grande que puedas tan rápido como puedas, levanta tanto dinero como puedas, contrata tan rápido como puedas, preocúpate de tu valoración, etc.\n\nA diferencia de eso existen empresas que nacen y crecen haciendo “bootstrapping”, descartan a los VCs (o los tradicionales) y se financian totalmente/principalmente con ventas. Por mencionar solo algunas de estas compañías: Mailchimp, Basecamp, Doist, Buffer, Atlassian, Zoho, ConvertKit.\n\nEstas empresas no creen que sea sano tener más gastos que ingresos.\n\nSi te interesa este tipo de empresas te recomiendo revisar el reporte “State of Independent SaaS” microconf.com/saas-this-year.\n\n## WeWork nunca fue una empresa de tecnología\n\nPor último, WeWork vendía el cuento de que era una empresa de tecnología, que estaban *“software-enabled”,* lo que les permitiría tener el crecimiento de las empresas tech, pero en realidad **siempre fue una empresa inmobiliaria** .\n\nTenía una valorización de una empresa de tecnología, porque los inversionistas querían creer que lo era. Softbank invirtió 6 mil millones de dólares en WeWork valorándola en 47 mil millones de dólares, pero en 2019 cayó por debajo del 40% de esto (17 mil millones). Sus números no cuadraban, en la primera mitad de 2019 la empresa tenía pérdidas de 900 millones de dólares.\n\nUn episodio en inglés sobre esto en el podcast del New York Times, The Daily.\n\n## The Spectacular Rise and Fall of WeWork - The Daily\n\n### Si no conocías estos conceptos\n\nAunque siempre puedes googlear para más información.\n- **IPO:**  Initial Public Offering. Oferta Pública Inicial, abrir a bolsa para levantar capital vía las personas que compran estas acción públicas.\n- **SaaS:**  Software As a Service. Software como servicio, en el que pagas un suscripción, desde mensual hasta anual, para acceder a utilizar un software.\n- **ARR:** Annual Recurring Revenu. Ingreso Anual Recurrente, el monto que ingresa al año en base al pago de suscripciones de los clientes.\n- **Bootstrapping:**  Iniciar y continuar el crecimiento del negocio en base a los ingresos del mismo negocio.\n- **VC:**  Venture Capital. Inversionistas de Capital de Riesgo.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;el-futuro-del-trabajo-ed53d6233dc1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;El futuro del trabajo&quot;],&quot;description&quot;:[0,&quot;Varias veces me he preguntado por qué me pasa esto y creo que hoy por hoy es lo que le sucede a bastante gente. Nadie quiere verse 40 años haciendo lo mismo hasta morir. Para la generación de…&quot;],&quot;date&quot;:[3,&quot;2018-08-16T02:04:17.017Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/0_9aB5b6fssLP2icVd.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Futuro del trabajo&quot;],[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n&gt; Me viene como un mareo cuando me hablan del futuro, más si se trata “del futuro laboral”.\n\nVarias veces me he preguntado por qué me pasa esto y creo que hoy por hoy es lo que le sucede a bastante gente. Nadie quiere verse 40 años haciendo lo mismo hasta morir. Para la generación de nuestros abuelos o padres el “hacer carrera” en una empresa o institución era el sueño de muchos, levantarse todos los días, dejar a los niños en el colegio e ir a trabajar de ocho a una y de tres a seis, de lunes a viernes, hasta que un día te ascendían y tu oficina era un poco más grande, hasta que un día te regalaban un reloj y un diploma por haber dejado tu juventud al servicio de otros y ya todo se había acabado.\n\nPero no quiero ser negativa, ni menos denostar a esa gente esforzada que aún hoy se esmera por permanecer en un lugar y llegar lo más alto que pueda en ese espacio. Simplemente siento que eso no es para mí y a varias personas le pasa igual. Entonces cuando me hablan “del futuro del trabajo” uno piensa:\n\n&gt; “Me están preguntando qué voy a hacer en lo personal o para donde vamos como sociedad o raza humana?”.\n\nEl mero cuestionamiento filosófico que supone descifrar lo que está detrás del enunciado da ganas de echarse una siesta, sin embargo están muy ligados.\n\nSi hablamos del futuro del trabajo en términos generales la respuesta es fácil, basta con ver las actuales tendencias: las personas buscan experimentar, no soportan mucho tiempo en el mismo sitio, en más de una ocasión durante la vida las personas tendrán la inquietud de emprender o tomarse años sabáticos y todos quieren ganar más trabajando menos, incluso en países como Holanda se han promovido leyes para reducir la semana laboral a 4 días de trabajo y tres de descanso. Esto sucede porque hemos llegado a un punto donde entendimos que el tiempo que dejamos en la faena no es devuelto y que finalmente trabajar en algo que no te llena, es básicamente vender tiempo de vida que no le dedicaste a tus hijos, mascotas, plantas o a ti mismo.\n\nEntonces, si me preguntan qué voy a hacer en el futuro yo contesto que no tengo idea, más bien podría decirse que hay uno o dos planes bajo la manga, el resto es improvisación. En cambio si me preguntan hacia dónde creo que va el trabajo en el futuro, pienso que la modalidad remota ganará cada vez más terreno. El pequeño pánico que se ha sembrado a través de la idea sci-fi de que para el futuro próximo un alto porcentaje de las funciones que hoy realizan humanos serán reemplazadas por máquinas ha hecho que algunos enciendan la luz de alerta, pero no sacamos nada con preocuparnos, las máquinas van a reemplazarnos igual y todo lo que dice Terminator es cierto.\n\nLo que debemos hacer es ocuparnos de nosotros mismos, escucharnos, preguntarnos frecuentemente si somos felices en lo que hacemos, si estamos haciendo bien lo que hacemos o si estaríamos más a gusto en otro sitio, e incluso si fuésemos más lejos, preguntarnos si seríamos un mejor aporte en otro sitio y no en el que estamos. Creo que está bien migrar y cerrar ciclos breves en lo que al trabajo se refiere, es sano y honesto que el dinero sea una consecuencia de hacer lo que nos gusta y no una recompensa insuficiente a una vida de sacrificios que a nadie le importan. Si me preguntan qué es para mi el futuro del trabajo no me dan ganas de contestar como si tuviera una bola de cristal en frente, vaticinando cómo será el mercado laboral en veinte o treinta años más, sólo puedo augurar desde mi experiencia en el hoy que el futuro está en la autoconciencia humana, algo que nunca podrán suplir las máquinas.\n\nEntonces, la tarea está en el trabajo personal señoras y señores, en humanizar nuestras conductas, generar redes de colaboración sólidas, no pasar a llevar al resto e ir dejando lo mejor que podamos en cada lugar donde trabajemos, para que al momento de aburrirnos y querer cambiar el rumbo vayamos dejando palitos en el puente y no dinamitando nuestra única vía de regreso en caso de que nos toque retroceder.\n\nEn 9punto5 no leemos las cartas ni adivinamos el futuro, pero nos gusta reflexionar y ser honestos con los temas que nos preocupan a todos, por eso te compartimos nuestros puntos de vista sin temor.\n\nNos vemos entre el 6 y 8 de septiembre en la tercera versión de 9punto5 para hablar de esto y más.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;esta-bien-trabajar-desde-nuestra-casa-138b8cb7d673&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¿Está bien trabajar desde nuestra casa?&quot;],&quot;description&quot;:[0,&quot;La interrupción de los hijos en una videoconferencia puede ser divertida y normal. Lo importante está en otro lado.&quot;],&quot;date&quot;:[3,&quot;2017-03-24T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/home-work.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Hace poco el video de un hombre que desde Corea del Sur realizaba una entrevista de manera remota para la BBC dio la vuelta al mundo. Pero esta “noticia viral” no trascendió precisamente por su contenido (al menos no por lo que dijo el entrevistado), sino más bien por un hecho fortuito que captó la atención de millones de telespectadores.\n\n&lt;Youtube client:load id=\&quot;-DHZeI4CG8A\&quot; title=\&quot;Entrevista a Robert Kelly en la BBC\&quot; /&gt;\n\nRobert Kelly, académico experto en temas políticos, discutía sobre la destitución de la presidenta Park Geun-hye, en una transmisión que hacía mediante videoconferencia desde su casa, cuando de improviso una niña entra a la habitación de manera ruidosa.\n\nLa escena se vuelve muy graciosa al ingresar otro niño en un andador, lo que descoloca a Kelly, quien intenta retirar sin éxito a los pequeños tratando de mantener la compostura, evidentemente nervioso. Pero el asunto no queda ahí, ya que detrás de los niños ingresa velozmente una mujer, quien sería la madre de ellos y Kelly comienza a repetir “Lo siento, lo siento”.\n\nSi bien el hecho no pasa de una simple anécdota, para muchos se convirtió en un punto álgido de debate, ya que con esto se comienza a cuestionar qué tan eficiente es trabajar desde casa y qué tan graves pueden ser los eventuales problemas que esto implica.\n\nEn posts anteriores, hemos hablado sobre las interrupciones en el trabajo cuando somos independientes y optamos por desenvolvernos de manera remota.\n\nJustamente uno de nuestros principales obstáculos detectados era lidiar con la familia y los hijos.\n\nPero también sabemos que existen varias formas de evitar que situaciones como estas ocurran, como por ejemplo, organizar tus tiempos, procurar un espacio de trabajo tranquilo donde puedas entablar reuniones o dedicarte a procesos creativos, avisar en casa que tendrás una reunión importante y no quieres ser molestado, pero sobre todo: **entender que el trabajo remoto es también una filosofía de vida que tanto tú, como tu círculo y quienes trabajan contigo deben comprender.**\n\n**Que tus hijos interrumpan una reunión no es grave. No llegar a una reunión sin previo aviso sí lo es.**\n\nSi debes realizar una videoconferencia y sabes que habrá ruido de fondo, busca un lugar más tranquilo.\n\nSi por alguna razón un niño irrumpe corriendo durante tu reunión, tómalo con naturalidad y continúa con lo que estás haciendo.\n\nPero ¿es legítima la preocupación e incomodidad de Robert Kelly?\n\nSi y no.\n\nEntendiendo que todos tenemos distintos niveles de ansiedad y stress frente a las situaciones laborales y que además el tema de la entrevista no era algo sencillo de tratar, es comprensible que la interrupción de golpe haya significado para el académico un balde de agua fría.\n\nNo obstante, quienes trabajamos fuera de la oficina debemos adaptarnos a este y otro tipo de imprevistos.\n\nLos límites los ponemos nosotros mismos y en ese sentido nos basta con ser ordenados y organizar bien cada actividad que emprendamos. Si comprendemos que nuestro trabajo y lo que nos apasiona se encuentra en nuestras cabezas y no en el lugar donde estemos, podremos asumir la inmensa libertad que implica sentarse en un escritorio o en la cima del Everest a cumplir nuestros objetivos.\n\nCaminemos sin miedo en un mundo habitado por personas que aman lo que hacen y no están ancladas a nada.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;eventos-imperdibles-en-chile-este-2017-5b5d31b5c460&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Eventos imperdibles en Chile este 2017&quot;],&quot;description&quot;:[0,&quot;Tecnología, ciencia y trabajo remoto. Conoce eventos imperdibles como StarsConf, Agile Open Camp y 9punto5&quot;],&quot;date&quot;:[3,&quot;2017-02-09T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/StartechConf.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Oportunidades&quot;]]],&quot;tags&quot;:[1,[[0,&quot;StarsConf&quot;],[0,&quot;Agile Open Camp&quot;],[0,&quot;9punto5&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Es un hecho. En nuestro país están pasando cosas interesantes en relación a la tecnología, la ciencia y el trabajo remoto. Algo pasó, **nos aburrimos de lo convencional, nos agarró la ola de la modernidad, se nos cayó la venda de los ojos**.\n\nSin duda, un gran responsable de este salto es internet y la globalización, que para bien o para mal nos ha pegado a todos en la cara. Entonces, el conectarnos con el mundo debemos asumirlo como un _must_ de los tiempos que corren y sacarle el mayor provecho.\n\nDiscutiendo con alguna gente sobre qué tan bueno es agringarse, incorporar cada vez más aforismos a nuestro lenguaje, dejar más cosas en manos de las máquinas que de nosotros mismos y ser cada vez individuos más virtuales que presenciales puedo rescatar muchísimas reflexiones, pero lo más importante para mí a la hora de subirse a este carro demencial es no perder nunca la identidad. Somos chilenos y nos vamos a morir chilenos, la pregunta clave es ¿cómo nos vendemos hacia fuera?\n\nNo vamos a discutir por supuesto las bondades ni los defectos del uso de la tecnología, ya que desde “9punto5” partimos de la base que para el desarrollo de un país ciencia, tecnología y sociedad deben ir siempre de la mano.\n\nA lo que voy es súper simple. **Considero que para cada iniciativa que levantemos, sea grande o pequeña, no podemos perder el sello, tenemos que mantenernos originales e intentar por sobre todo traspasar a quienes asistan el orgullo de pertenecer a un territorio**.\n\nPor eso, hemos querido abrir esta conversación partiendo por contarles sobre algunos eventos de tecnología que se realizarán este año (2017) en Chile y figuran como imperdibles, para después ir desmenuzando en las publicaciones que sigan cómo lo hacemos para generar una marca chilena, que sea interesante para todo el mundo y no deje nunca de picar en la lengua como un buen ajicito 🌶.\n\nPara comenzar les comentaré sobre StartechConf, que ahora es StarsConf. Un evento que se realiza año por medio y que este 3 y 4 de noviembre celebrará su cuarta versión. Igual que en eventos anteriores, la conferencia incluirá a verdaderas estrellas en el desarrollo de software, en lenguajes, en diseño de servicios y experiencias inolvidables, que además liderado por equipos de primera. El Centro de Extensión de la Universidad Católica (en pleno centro de Santiago) fue el seleccionado como el hogar de StarsConf 2017. El 2015 tuvieron una increíble acogida con sus talleres, por eso este año no será la excepción. Quienes estén interesados deben estar atentos, porque naturalmente los cupos para estas dinámicas serán limitados.\n\nEl equipo detrás de StartechConf 2015 (Continuum + Synaptic).\nTambién quiero hablarles sobre el Agile Open Camp a realizarse del 4 al 7 de mayo. Un evento comunitario, sin fines de lucro, auto-organizado y en contacto con la naturaleza, donde la Comunidad Ágil de Latinoamérica podrá compartir en un mismo sitio actividades de divulgación, exploración y creación de actividades y temáticas relacionadas con el agilismo, gastronomía, turismo, deporte y/o de entretenimiento en un formato relajado y desestructurado. Esta comunidad se reúne en torno a la temática de la agilidad en todos sus dominios (marcos de trabajo, desarrollo de software, habilidades blandas, trabajo en equipo, entre otros). Su objetivo es lograr que el evento sea lo más abierto posible en cuanto a la diversidad de los participantes, temáticas y actividades propuestas. En los 4 días del evento, se enriquecerá la experiencia a través de la conexión con la naturaleza, actividades turísticas, deportivas y entretenimiento, además de encuentros y debates casuales, en un lugar el cual facilita todo lo anteior.\n\n![AgileOpenCamp](/blog/images/posts/AgileOpenCamp.webp)\n&gt; Versión 2016 de Agile Open Camp\n\nY por supuesto no podíamos dejar fuera a “9punto5”, evento que se ha concebido como un gran evento para desarrolladores de software que el 1 y 2 de septiembre de 2016 celebró su primera versión de manera exitosa. Este año, espera el 31 de agosto y 1 de septiembre de 2017 convertirse en referente mundial en la temática del trabajo remoto posicionando a Valdivia y el sur de Chile en un lugar donde se ofrecen servicios digitales al mundo. De esta manera se impulsa la creación de un nuevo hotspot para programadores, desarrolladores, ingenieros informáticos y emprendedores digitales. Además el evento permitirá, a través de charlas, talleres y meetups, desarrollar este talento en torno construcción, calidad, validación y comercialización de software todo con especial énfasis en trabajo remoto. Más información, pronto en [9punto5.cl](https://9punto5.cl/)&quot;]}],[0,{&quot;slug&quot;:[0,&quot;fragmentos-1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Fragmentos 1 – Acabar con el trabajo remoto no será fácil&quot;],&quot;description&quot;:[0,&quot;El trabajo a distancia se ha vuelto popular y es poco probable que desaparezca, incluso con la presión de algunos directores de empresas.&quot;],&quot;date&quot;:[3,&quot;2023-01-23T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/fragmentos-1.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Fragmentos&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;],[0,&quot;Oportunidades laborales&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;El newsletter se me quedó corto para escribir y desarrollar ideas. Ahora mismo estoy terminando dos artículos que vivirán mejor en el formato de post individual. Por eso desde esta semana comenzarás a recibir artículo por separado, así como esta sección con recordatorio de las próximas actividades y (algunas veces) con recopilación de artículos.\n\nReserva tu cupo al curso de productividad para miembros de 9punto5 que tendremos durante el primer trimestre de 2023.\n\n---\n\n## [Getting Rid of Remote Work Will Take More Than a Downturn  – NYT](https://www.nytimes.com/2023/01/07/business/dealbook/remote-work-downturn.html)\nEs poco probable que la presión de algunos CEO destacados para acabar con el trabajo a distancia durante la recesión económica tenga éxito, ya que esta modalidad se ha establecido como la nueva normalidad. \n\nLos datos muestran que, desde que comenzó la pandemia, el trabajo a distancia es más popular que nunca: los trabajadores prefieren trabajar a distancia una media de 2,8 días a la semana y los empresarios les permiten hacerlo 2,3 días a la semana. Las empresas también encuentran beneficioso el trabajo a distancia, ya que les permite mejorar la propuesta de valor a empleados sin aumentar el salario. Terminar con el trabajo a distancia también es complicado, puesto que trae el riesgo de perder a los mejores talentos de la organización. Por tanto, es probable que el trabajo a distancia siga formando parte del paisaje empresarial incluso durante una recesión.\n\n---\n\n## [6 Questions Everyone Has About Working From Home](https://remotive.com/blog/6-questions-everyone-has-about-working-from-home/)\nTrabajar desde casa tiene la ventaja de la flexibilidad, pero...\n- Puede facilitar rutina como hacer ejercicio y tomarse descansos cuando es necesario. \n- No es raro que desconectar del trabajo puede te resulte difícil, para lo que es importante establecer límites que eviten que el trabajo se apodere de tu vida.\n- Si tu día a día actual no te está resultando agradable, prueba cambiar de rutina, horarios y lugares de trabajo (como ir a un café).\n- Para que el trabajo tenga sentido y te motive es importante entender la razón por la que lo que haces es importante. \n- Trabajar remoto no te fuerza a estar en casa. Hay quienes prefieren la modalidad híbrida e ir a la oficina algunos días a la semana. \n- Es posible disfrutar trabajar desde casa, pero eso no necesariamente pasará de forma automática, hacerlo trae sus propias dificultades y requiere experimentar con técnicas y mecanismos que te ayuden a mantener tu actividad y productividad.\n\n---\n\n## [January And February Are Top For Hiring: 3 Ways To Set Yourself Apart – Forbes](https://www.forbes.com/sites/tracybrower/2023/01/08/january-and-february-are-top-for-hiring-3-ways-to-set-yourself-apart/)\nEnero y febrero suelen ser meses en los que la contratación aumenta, ya que las empresas suelen centrarse en encontrar nuevos talentos y hacer ofertas al comienzo del nuevo año. Esto se debe a varias razones, como que las áreas reciben el presupuesto para el año, existe una mentalidad colectiva por empezar el año con fuerza y que la gente renuncia a su trabajo en enero después de recibir el bono de fin de año. Si quieres postular a un nuevo trabajo, quienes contratan estarán buscando características como compromiso, motivación, capacidad de aprendizaje, crecimiento y adaptación. Los profesionales de la contratación también buscarán personas que se sientan cómodas con la tecnología y puedan adoptar las nuevas tecnologías. Si estás en búsqueda de nueva oportunidades esta es una buena época del año para hacerlo.\n\n¡Buena semana #4 del año y hacer cosas!\n\n–Fabián&quot;]}],[0,{&quot;slug&quot;:[0,&quot;fragmentos-2-obstaculos-trabajo-remoto-hibrido&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Fragmentos 2 – Cinco obstáculos del trabajo remoto o híbrido&quot;],&quot;description&quot;:[0,&quot;Obstáculos en el trabajo como sesgos, comunicación y falta de sentido de comunidad. Comienzan políticas de retorno al trabajo presencial y de trabajo híbrido.&quot;],&quot;date&quot;:[3,&quot;2023-01-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/fragmentos-2.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Fragmentos&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Despidos&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Partimos esta semana con la selección de cuatro artículos. Antes de ir a ello no olvides estos dos puntos:\n\n1. Reserva tu cupo al curso de productividad para miembros de 9punto5 que tendremos durante el primer trimestre de 2023.\n2. Nos vemos hoy en Hacedores Anónimos a las 5:00 pm (GMT-3). El acceso en nuestro slack.\n\n---\n## [Cinco obstáculos del trabajo remoto o híbrido](https://www.worklife.news/culture/the-biggest-hybrid-and-remote-working-hurdles-and-how-to-fix-them/) – WORKLIFE\n1. **El sesgo por proximidad:** Los trabajadores que van a la oficina tienen ventaja sobre los que trabajan a distancia o de forma híbrida cuando se trata de visibilidad, aumentos, bonos y ascensos\n2. **La comunicación** es quizá uno de los principales retos del trabajo a distancia. Las empresas deben entregar herramientas, tecnología y conectividad a sus empleados. Además de definir y reforzar cómo es una buena comunicación.\n3. **La falta de sentido de comunidad** es otro desafío. Cómo generar buenas relaciones entre compañeros de trabajo. Los equipos necesitan niveles de conexión y relaciones que no sean solo funcionales, sino también con vínculo emocional.\n4. **La brecha generacional** entre trabajadores con más edad, que serían quienes prefieren volver a la oficina, y los más jóvenes, que quieren mantener el trabajo remoto, al menos de forma híbrida.\n5. **El onboarding** o la incorporación de nuevos empleados en empresas que están transitando a modelos remotos o híbridos. Es necesario facilitar el aprendizaje de la cultura y procesos de la empresa.\n\n---\n\n## [Siguen los despidos](https://www.nytimes.com/2023/01/25/business/layoffs-remote-work.html) – NYTIMES\nEn [layoffs.fyi](https://layoffs.fyi/) se reportan cerca de 70 mil despidos en lo que va del año de empresas tecnológicas. Esto incluye a empresas como Meta, Lyft, Spotify e IBM. [Google despidió 12 mil trabajadores](https://www.nytimes.com/2023/01/20/business/google-alphabet-layoffs.html), el 6% de su fuerza laboral y Microsoft a 10 mil o un 5% de sus empleados.\n\nAunque los ejecutivos dicen que los despidos han sido inevitables, **existe una crítica generalizada por hacerlo de manera caótica – realizando notificaciones en mitad de la noche, o cortando bruscamente los accesos a los sistemas de la compañía**. Trabajadores que se quedan con una larga lista de preguntas sin responder, con una completa falta de claridad sobre quién puede ayudarlos.\n\nLas empresas pueden tomar medidas para asegurarse de que los ex-empleados se marchan de una forma más positiva, [como lo hizo Stripe el año pasado](https://news.9punto5.cl/p/despidos-twitter-stripe).\n\n---\n\n## [Washington D.C. tiene un 19,5% de oficinas desocupadas](https://www.wsj.com/articles/washington-d-c-office-market-feeling-ill-effects-of-remote-work-11674534492) – WJS\nAunque el Presidente Biden ha pedido que la gente vuelva al trabajo, el gobierno federal de Washington D.C. está permitiendo el trabajo remoto como una medida para retener a los trabajadores y reducir costes. Lo que ha generado un impacto negativo en el mercado inmobiliario.\n\nVeo que es imposible que algo así pase en Chile, ya que tener políticas así de diferenciadas solo funciona en países federados.\n\n---\n\n## [Los empleados remotos de TikTok podrían ser despedidos si no viven cerca de la oficina que tienen asignada](https://fortune.com/2023/01/24/tiktok-remote-employees-fired-not-live-near-assigned-office-location/?utm_campaign=hrb&amp;utm_medium=newsletter&amp;utm_source=morning_brew) – FORTUNE\nTikTok ha anunciado una política según la cual los empleados remotos en Estados Unidos deben demostrar que su domicilio coincide con la ubicación de su oficina asignada o podrían ser incluso despedidos. Empresas como Disney, Apple, Snap y Twitter también han puesto en marcha políticas en la que es necesario ir a la oficina.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;fragmentos-3&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Fragmentos 3 – Dónde están las respuestas&quot;],&quot;description&quot;:[0,&quot;Elon Musk apoya el trabajo remoto, control de la fatiga mejora decisiones, y la IA se destaca con ChatGPT de Microsoft y Bard de Google. ¿Nueva era en búsqueda de respuestas?&quot;],&quot;date&quot;:[3,&quot;2023-02-08T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/atencion.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Fragmentos&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;],[0,&quot;Oportunidades laborales&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;## [Elon Musk ahora está a favor del trabajo remoto](https://www.forbes.com/sites/glebtsipursky/2023/01/23/elon-musk-is-now-a-fan-of-remote-work/?sh=5c4a3436c663) 🤥 – Forbes\nTwitter está cerrando oficinas en Seattle y Singapur y solicitando a sus empleados trabajar desde sus casas. Esta decisión representa un giro importante, ya que por mucho tiempo Elon Musk ha sido un detractor extremo del trabajo remoto, diciendo que hacerlo es “[fingir como que trabajas](https://twitter.com/elonmusk/status/1531867103854317568?s=20)”, y entre las primeras cosas que hizo, como nuevo CEO de Twitter, fue [prohibir esta modalidad](https://www.theverge.com/2022/11/10/23451498/elon-musk-twitter-email-employees).\n\n---\n\n## [¿Quiere mantener la concentración y tomar decisiones más inteligentes? Empieza a controlar la fatiga de atención](https://www.inc.com/jeff-haden/want-to-stay-focused-make-smarter-decisions-all-day-long-start-managing-attention-fatigue.html) – INC\n¿Habías escuchado sobre \&quot;fatiga de atención\&quot;? Hay buenos y malos momentos para tomar decisiones. Y tu capacidad para hacerlo no es igual durante el día, tu atención es un recurso limitado y se desgasta. Si nuestra atención está siendo atestada por infinitas distracciones es normal que nos cueste encontrar las respuestas.\n\n- Toma decisiones importantes cuando tu atención está más fresca\n- Haz pausas durante el día para reponer tu atención\n- Organiza tu día para que las tareas que requieren más atención las hagas cuando esta esté disponible\n- Para muchas personas el momento con más atención es en las mañanas, pero no hay quienes la encuentran a medio día, en la tarde o en la noche\n- Es muy buena idea dejar pasar al menos un día para tomar una decisión importante\n\nEste artículo me recordó al libro [\&quot;Cuándo\&quot;](https://www.amazon.com/-/es/Daniel-H-Pink/dp/6077476323)  de Daniel Pink.\n\n---\n\n## ¿IA, la respuesta a todo?\n[Microsoft ya tiene lista de espera para usar Bing con ChatGPT](https://www.bing.com/new)\nAyer martes Microsoft anunció su nuevo buscador integrado con ChatGPT. Usa \&quot;Prometheus\&quot;, que es una versión mejorada de GPT 3.5, para responder a preguntas sobre acontecimientos recientes, generar texto, resumir páginas web, etc. [Puedes entrar a la lista de espera](https://www.bing.com/new).\n\n--- \n\n## Google reacciona a ChatGPT con Bard\n[Google ha anunciado su nuevo proyecto, Bard](https://blog.google/technology/ai/bard-google-ai-search-updates/), un servicio experimental de IA conversacional que estará disponible en “las próximas semanas”. Bard será capaz de responder preguntas en modo conversacional, y estará conectado a la web. Es una respuesta forzada, ya que Google se vino resistiendo a implementar soluciones de este tipo.\n\n&gt; Google tiene el 91% de la cuota de mercado de buscadores. El año pasado ingresó 163 mil millones de dólares por este concepto; Microsoft ni siquiera se le ha acercado con Bing. \n\n&gt; Tras más de dos décadas de reinado ¿Se abrió el espacio de buscar respuestas? https://www.generalist.com/briefing/all-the-answers\n\n&gt; @fabianhtml [February 5, 2023](https://twitter.com/fabianhtml/status/1622336412988366849?ref_src=twsrc%5Etfw)&quot;]}],[0,{&quot;slug&quot;:[0,&quot;freelancer-remoto-desde-chile-cobrar-pagar-impuestos-bole-honorariosa&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Freelancer y trabajo remoto: Cómo cobrar y pagar impuestos en Chile. Trabajando remoto al extranjero con Nicolás Gómez&quot;],&quot;description&quot;:[0,&quot;En menos de 25 minutos Nicolás Gómez repasa las claves sobre cómo cobrar y pagar impuestos en Chile cuando trabajas remoto hacia otros países.&quot;],&quot;date&quot;:[3,&quot;2023-03-13T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/taxes.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Charlas&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Impuestos&quot;],[0,&quot;Nicolás Gómez&quot;],[0,&quot;Transcripción&quot;],[0,&quot;Trabajo remoto&quot;],[0,&quot;Freelancer&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nEn menos de 25 minutos Nicolás Gómez repasa las claves sobre cómo cobrar y pagar impuestos en Chile cuando trabajas remoto hacia otros países.\n\n&lt;Youtube client:load id=\&quot;p6fAaowtRmk\&quot; title=\&quot;Freelancer y trabajo remoto: Cómo cobrar y pagar impuestos en Chile. Trabajando remoto al extranjero\n\&quot; /&gt;\n\n&lt;figcaption&gt;Charla en [YouTube](https://www.youtube.com/watch?v=p6fAaowtRmk).&lt;/figcaption&gt;\n\n## Introducción\n**Fabián:** Muchas gracias Nico por ayudarme a responder una pregunta. Estamos invitando a las personas a hacer preguntas en la comunidad y algo que siempre siempre llega es el tema de cómo manejar el tema de los impuestos, de cómo pagar impuestos, de la boleta, si facturo, no facturo y un montón de cosas relacionadas a esto. Pero en concreto aquí nos preguntaron: ¿Cómo cobrar y pagar impuestos en Chile siendo freelance para el extranjero?; y como tú has hecho esto por hartos años, de hecho hasta tienes una calculadora online para calcular más o menos este tipo de cosas: Cómo dirías tú que hay que hacer esto.\n\n## Cómo cobrar como freelancer remoto\n**Nico:** Bien esta pregunta tiene dos partes la primera es cómo cobrar y luego cómo pagar los impuestos. El cómo  cobrar va a depender de muchas cosas, desde el método de pago que tenga la empresa para la que estás trabajando, hay algunas empresas que ocupan por ejemplo PayPal y se quedan con eso, entonces ahí tú te tienes que ajustar a ellos.\n\nHay veces también en que tú puedes elegir y en esos casos yo recomendaría la opción de transferencia bancaria, es decir que transfieran directamente los dólares a tu cuenta en dólares, si es que tienes y si es que no aunque no tengas cuenta en dólares igual te pueden hacer una transferencia. La única diferencia es que probablemente tengas que ir a una sucursal a retirar tus dólares o a venderlos entonces ahí sería trabajar directo con un banco.\n\nAquí entra el tema de comisiones y de tipo de cambio. El tema de comisiones depende del banco y como últimamente hay más competencia generalmente los bancos se están tirando por 0% de comisión. Lo que sí hay ciertas comisiones del banco extranjero al banco de Chile, por la transferencia claro y esas comisiones no son tan transparentes en verdad. A mí me ha pasado varias veces que, como que mi empleador o la persona allá en el extranjero me manda cierta cantidad de dólares y acá chile llega un poquito menos, ¿cuánto menos? depende… por ejemplo para mi primer trabajo llegaban 20 dólares menos y ahora me están llegando 50 dólares menos. Entonces ahí no sé si es un fijo el al menos en el primer caso era un fijo y en este segundo caso no estoy seguro pero es un poco más variable.\n\n**Fabián:** Suele ser el costo del  wire transfer que que cobran los bancos por la operación internacional.\n\n**Nico:** Así que eso es es una referencia claro y, bueno. Luego el tema del valor dólar.\n\n**Fabián:** Una pregunta antes ¿has usado wise.com?\n\n**Nico:** No he tenido la oportunidad de usarlo, pero lo que entiendo es que la comisión es un poco alta pero el valor dólar que te danes más alto. Entonces ahí hay si recibes mucha plata… diría de 8.000 dólares para arriba mensualmente, ahí te conviene Wise. Por el tipo de cambio, quizás igual ahí tú tendrías que jugar con los números para para ir viendo cuál de las alternativas te conviene.\n\n**Fabián:** Igual Wise es como tener una cuenta fuera y te vas a tener que hacer Igual una transferencia a Chile entiendo, entonces en vez de que te transfieran la plata el empleador te las vas a tener que transferir tú a Chile. Bueno en algún momento vamos a invitar a alguien que esté usando Waise también, para para conversar de eso. Hay más alternativas, pero la del banco sentido entonces\n\nNico: Si el banco tiene sentido y como digo en Chile hay cero comisión y está la comisión internacional que te pueden cobrar y luego viene el valor dólar, ahí también depende del banco porque hay bancos que te dan mejor tasa y otros que no te dan tan buena tasa. Yo estoy utilizando el banco BICE y generalmente encuentro que me han dado súper buen cambio en general. Lo único malo que el banco BICE es que un poquito difícil sacar la cuenta.\n\n**Fabián:** Te piden estos requisitos como antigüedad y ahí cuando eres freelancer es importante intentar emitir tus boletas todos los meses, la constancia y tener varios meses de boletas es importante. Al final el Baco te toma como un independiente.\n\n**Nico:** Claro. pero por ejemplo, en el Scotiabank es súper fácil abrir una cuenta en dólares.\n\n## Impuestos: claves para freelancers sobre pagar impuestos y la renta anual\n\n**Fabián:** Oye ya, estamos listos con el banco entonces, después viene el tema de pagar impuestos\n\n**Nico:** Sí bien entonces como tú ya cobraste te llegaron los dólares. ¿Cómo declaras? ¿Cómo le dices a Chile que tienes un ingreso? ¿Que tienes que pagar impuesto?Porque al final en general las regla es: si tú aumentas tu capital tienes que pagar impuestos. Si no lo haces, es ilegal, hay evasión. Entonces la forma de hacerlo es a través de la boleta de honorarios, es decir cuando tú trabajas para el extranjero o si trabajas como independiente en Chile el mecanismo para declarar los impuestos es el mismo es decir: tienes que hacer una boleta de honorarios y luego en la siguiente declaración de renta general que son en abril, ahí tienes que pagar el impuesto. Entonces, por ejemplo si estás todo este 2022, mes a mes estás haciendo boletas para el extranjero, eso quiere decir que el 2023 vas a pagar realmente los impuestos del 2022.\n\nEntonces como la boleta de horarios tiene que estar en pesos chilenos, tienes que colocar un equivalente a los dólares que te están transfiriendo. Entonces si tú recibiste mil dólares y el dólar está a 900, eso quiere decir que tienes que hacer una boleta por 900 mil pesos\n\n**Fabián:** 900 mil pesos brutos, el monto total de la boleta\n\n**Nico:** Claro, entonces de ahí te van a descontar una retención, tú pagas al servicio de impuestos internos mes a mes por las boletas. De cierta forma el servicio de impuestos interno dice como esta persona quizás el próximo año no tenga plata para pagarme, le retengo un poquito ahora de manera de que junte un poquito para el próximo año. Entonces y después ese dinero se utiliza para pagar los impuestos, las cotizaciones como la AFP, el tema de salud también, algunos seguros que tenemos también en Chile de los independientes, en fin… se utiliza para pagar todas esas cosas y si quedas debiendo plata tienes que desembolsar de tu bolsillo para pagar el resto. Esto pasa para ingresos altos.\n\nAhora, como es muy probable que la empresa para la que trabajas no tenga una entidad legal acá en Chile, tendrás que hacerla tu Boleta con un rut especial.\n\nSi estás en Chile, estos son los RUT para emitir boleta o factura:\n\n- Boleta: 44.444.446-0\n- Factura: 55.555.555-5\n\n## Una herramienta útil para calcular tu sueldo neto\n\n**Fabián:** Además tu tienes una herramienta para calcular el tema de los impuestos.\n\n**Nico:** Sí, no es como una fórmula tan directa porque va a depender de toda tus fuentes de ingresos. Entonces eso dificulta un poco el calcular tu líquido. Generalmente el líquido… a veces las personas dicen: ya, recibo 900.000 le quita la retención y lo que me queda es líquido y realmente no están así porque la siguiente declaración renta lo que puede pasar es que tengas que pagar plata para cubrir algo que no cubriste con tu retención entonces y en esos casos si no tienes la plata guardada te puede afectar tus finanzas y la idea tampoco es estar en deuda con el servicio de impuestos internos.\n\nEntonces para eso yo hice una calculadora de impuestos, de manera de que tú coloques simplemente cuánto recibes en dólares al mes y ahí más o menos te dice cuánto es tu líquido real.\n\n**Fabián:** vamos a hacer el ejercicio en vivo, yo estoy en https://app.trabajoremoto.cl. Entonces si son 4.000 dólares, tu sueldo líquido real en pesos chilenos es más o menos $2.976.069 y $3.204.255  si eliges cotización parcial.\n\n¿Esto se hace una vez al año en abril verdad?\n\n**Nico:** si en abril tu tienes que elegir cotización total o parcial. En la parcial tu cotizas por un monto bruto menor perfecto, y eso a la vez significa que tienes un poquito menos beneficios, por ejemplo la licencia médica también se cotiza acá, entonces si te llegas a enfermar, la plata que te van a poner en ese tiempo que estás fuera sin trabajar, va a ser menor., entonces ahí bueno depende de cada uno.\n\n**Fabián:** Esta herramienta en https://app.trabajoremoto.cl sirve como referencia, más que te de el número súper exacto. Y también esto sirve para saber si tengo que ir ahorrando, porque no va a alcanzar con las rendiciones que se van haciendo mes a mes de la misma boleta de honorarios. Entonces debería yo ir guardando mes a mes un poco, para que después cuando en abril tenga que pagar impuestos (si es el caso, si voy a estar en el tramo en que me toca pagar), debería tener eso ahorrado.\n\n**Nicolás creo una calculadora de sueldo líquido para trabajadores remoto 🇨🇱 🇺🇸** que puedes encontrar en https://app.trabajoremoto.cl\n\n**Fabián:** Aprovechando de dar un consejo: no guarden la plata abajo del colchón, podrían meter ese ese monto en un depósito a plazo, algo con poco riesgo, que no se especule con esas lucas, y ese monto pueden ir generando algún grado de interés compuesto si vas renovando ese monto de ahorro.\n\n**Fabián:** Algo más que quieras agregar.\n\n**Nico:** Acá en la calculadora detalla más o menos cómo se llega al cálculo y de hecho, dentro de los enlaces que están abajo, está el código fuente me parece que eso también lleva a cómo se hace el cálculo, entonces puede que el cálculo no sea el mejor del mundo, pero es una buena aproximación, al menos en los años que llevo utilizando esta herramienta ha sido súper cercana a lo que al menos en mi caso ha resultado (como monto final de impuestos en Abril)\n\n**Fabián:** Claro, en abril ya llevas varias veces comprobando el cálculo anda cerca.\n\n**Nico:** al final también el tema de los impuestos tiene muchas cosas. Son hartos factores que no incluye la calculadora. Al final, la calculadora es simplemente una simulación sobre un escenario súper acotado donde tus ingresos son los dólares que recibes y listo.\n\nPero, por ejemplo, si tú tienes inversiones en APV en el B, las inversiones te reducen los impuestos que tienen que pagar. Y eso significa que lo que te está diciendo la calculadora es va a ser mayor a lo que realmente va a ser en la realidad. Y también hay otros beneficios tributarios que hacen que lo que tienes que pagar al final sea distinto. Entonces esto es una orientación, sirve para adelantarse un poquito a los escenarios y más o menos tener una idea de cuánto realmente vas a estar recibiendo. Entonces también te puede servir al momento de estar negociando un sueldo, de manera de tener una guía más concreta, tener el número más exacto de lo que recibirías realmente.\n\n## ¿Cuándo considerar un contador o crear una empresa?\n\n**Fabián:** Como una recomendación, de todas maneras, es buscar un contador. Esto sirve de referencia, pero cuando ya vas a estar full remoto y/o freelanceando permanentemente, de todas maneras hay que tener un contador. Y ahí también, sobre todo si ya empiezas a decidir el tema de formar una empresa o no, si es una EIRL o qué figura o qué tipo de empresa, la empresa me paga el sueldo a mí ya, y ahí se empiezan a abrir muchas posibilidades porque yo conozco developers que tienen una empresa chilena, y esa empresa era la que emite al RUT que hablábamos antes del 55.555.555-5 y después esa empresa te contrata. Puedes ser una SPA, etc.\n\nPero para ese detalle hay que ver el tema con un contador e incluso incluso otra opción es abrir una LLC en Estados Unidos y podría tener una empresa en Estados Unidos que no paga impuestos en Estados Unidos (una LLC no paga impuestos en Estados Unidos mientras no tenga activos ni empleados en Estados Unidos). Y dede ahí tener el rol de contrato para empresas gringas, o para empresas de otra parte del mundo.\n\nEn este caso puedes recibir ingresos en esa LLC, tienes las lucas afuera y te vas remesando desde ahí ya para tu cuenta en Chile. Y ahí vas a tener que hacer el mismo proceso de liquidación como de tus ingresos y pagar impuestos según como sea los tramos y vuelve a funcionar tu herramienta. Hay hartas opciones.\n\n**Nico:** cuando empezaba a meter empresas entre medio, ahí también va a depender de la situación de cada uno, que por ejemplo, si tienes muchos gastos que son declarables o sea: internet, quizás compras computadores, etc., al final, todos esos gastos los puedes declarar como empresas\n\n**Fabián:** o cada año, porque como la declaración de renta es anual, si un año cambiabas el teléfono, un año cambias el computador o te compras algún equipamiento más caro y lo compras con factura.\n\n**Nico:** Claro, por ejemplo, si trabajas remoto y estás viajando constantemente, digamos que tienes una casa en el sur y una casa en Santiago o un departamento y estás constantemente viajando, por ejemplo, entonces tú puedes tener quizá una camioneta y esa camioneta gasta petróleo. Y eso y eso también lo puedes declarar como gastos para la empresa. Entonces, al final, todas esas cosas se hablan con un contador porque es una persona experta en esos temas y él puede calcular y más o menos saber qué te conviene para tu caso particularmente. Para mí, la métrica muchas veces va relacionada como el nivel de gastos que tú tienes. Entonces, si tienes bajos gastos, generalmente como empresa no vas a poder declarar mucho. Entonces, al final, ahí el número ya no está tan tentador de tener la empresa en vez de hacerlo tú como independiente.\n\n**Fabián:** Una vez hablamos con @Zenemig y él tenía hasta el arriendo de la casa y lo pasaba como gasto de la empresa porque obviamente el arriendo ahí también hay que cumplir ciertas condiciones, no todos los arriendos le puedes pasar como gasto en la empresa. Pero como trabaja desde ahí, es tu oficina, al final ya está tu dirección comercial, puedes pasarlo incluso hasta eso como gasto y ahí entonces también vas descontando impuestos.\n\nPero de nuevo, siempre implica tener a alguien especialista en este caso un contador que sepa cómo planificar un poco esto. Entonces, definitivamente esto cobra sentido cuando ya estás como más estable en esta modalidad de trabajo, cierto, porque si son cosas como puntuales esporádicas… lo que dijiste antes como tener una cuenta en peso y emitir una boleta en horario… ya OK.\n\nPero si te vas a establecer a remotear como permanentemente, creo que estos son súper buenas ideas ya de ir planificando un poquito mejor tus finanzas.\n\n**Nico:** Claro, el consejo es tener un contador. A veces como que las personas dicen: a ver la empresa pagan 25% impuestos y uno piensa… ves la tabla de impuestos personales y ves que en cierto rango puedes pagar incluso 40% de impuestos como persona. Pero después si empiezas a hacer los cálculos, ese 40% en realidad no es 40%, es menor. Entonces, al final, siempre hay cálculos que hay que ir haciendo que un contador te puede ayudar mucho a hacer ese cálculo.\n\nIndependiente de eso, si tú trabajas con una empresa y pagas ese 25% que puede ser menor al que tú pagas como persona individual, sin embargo, esa plata que recibe tu empresa, después igual pasa a tu contabilidad personal. Y ahí tú también tienes que pagar ese impuesto.\n\nEntonces, si recibes la plata de la empresa, la empresa va a pagar, pero luego si esa plata pasa tu contabilidad personal, también tienes que pagar.\n\nAdemás no hay doble tributación por la plata que ya pagaste de impuestos por la empresa.\n\n**Fabián:** Claro, porque si eres socio de la empresa se van vinculando las dos impuestos.\n\n**Nico:** Claro, el impuesto que ya pagaste como empresa te lo descuentan de la plata que te está recibiendo…\n\nPero bueno, al final, todo eso son cálculos que hay que ir haciendo y que dependiendo de la situación es si te conviene o no. Y quién te puede decir eso es una sesión tributario o un contador. Esas son las profesiones que te pueden ayudar a todo esto.\n\n**Fabián:** Revisen remoto.netlife.app donde está la calculadora que hizo Nico, revisen esto y ahí también cualquier cosa pueden contactar a Nico por más detalle y ayuda.\n\nY aquí en 9punto5 siempre estamos teniendo este tipo de información y bueno, tenemos un Slack donde igual está Nico y de hecho ahí coordinamos para conversar de esto así que ahí también está es espacio.\n\nPero hay un montón de instancias para ir a hablar de esto, de hecho, hay un Slack que es de devsChile donde también hay un canal de remoto.\n\nAsí que instancias hay, y también conociendo experiencia a otras personas que están en esto como tú, pero creo que has cubierto como todo lo esencial.\n\nMuchas gracias Nico a no ser que quieras agregar algo.\n\n**Nico:** No, creo que cubrimos gran parte del área relacionada con esto.\n\n**Fabián:** Genial, súper buena conversación, muchas, muchas gracias y ya nos encontraremos en algún otro instante para seguir hablando esto y hacer más cosas juntos.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;futuro-trabajo-atomico-sergio-nouvel&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;El futuro del trabajo es atómico | Sergio Nouvel&quot;],&quot;description&quot;:[0,&quot;La tecnología y la inteligencia artificial están transformando el futuro del trabajo, llevándonos a startups de 1-3 personas, hiperpersonalización y más.&quot;],&quot;date&quot;:[3,&quot;2024-08-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/sergio-nouevel.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;9punto5&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Charlas&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Futuro del trabajo&quot;],[0,&quot;Futuro de los negocios&quot;],[0,&quot;Inteligencia artificial&quot;],[0,&quot;Startups&quot;],[0,&quot;Hiperpersonalización&quot;],[0,&quot;Nicho&quot;],[0,&quot;Sergio Nouvel&quot;],[0,&quot;Transcripción&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n¿Cómo sería un mundo donde todas las empresas tienen de una a tres personas? ¿Qué pasaría si pudieras crear cualquier producto que se te ocurriera, sin dificultades, al instante? ¿Dónde quedamos las personas en una época donde las máquinas y los algoritmos pueden hacer prácticamente lo que sea?\n\nEstas son las preguntas que intenta responder —y se aventura a hacerlo— Sergio Nouvel. Esta fue la charla de apertura de la conferencia 2024 de 9punto5, que organizamos desde 2016 para hablar de tecnología, cultura y el futuro del trabajo. \n\n&lt;iframe style=\&quot;border-radius:12px\&quot; src=\&quot;https://open.spotify.com/embed/episode/2gWsqLT4BRELrLdl7Gd9h4?utm_source=generator\&quot; width=\&quot;100%\&quot; height=\&quot;152\&quot; frameBorder=\&quot;0\&quot; allowfullscreen=\&quot;\&quot; allow=\&quot;autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture\&quot; loading=\&quot;lazy\&quot;&gt;&lt;/iframe&gt;\n\n\nEn la charla inaugural de la conferencia, Sergio Nouvel, cofundador y CEO de Get on Board comparte su visión sobre cómo la tecnología —especialmente la inteligencia artificial— está transformando radicalmente el futuro del trabajo. \n\nBusca ejemplos y genera reflexiones para ir por una tesis: en el año 2035 un empresa completa podría ser de apenas tres personas, o incluso de una sola persona.\n\nSergio cree que como crear productos será 100 veces más barato y 100 veces rápido que hoy, esto nos llevará a una \&quot;era atómica”, de hiper-nicos e hiper-perzonalización de productos.\n\nEsto traerá como consecuencia, la desaparición de roles y puestos de trabajo tal como las conocemos hoy. Llevándonos a profesionales hiper-especializados, a la creación de micro o nanoe-mpresas capaces de atender nichos cada vez más pequeños. \n\nSergio también plantea que la IA reducirá las barreras técnicas, cognitivas, y económicas para emprender. Abriendo el camino a un acceso universal a la innovación. Por lo que se plantea el reto de preguntarnos qué papel ocuparán los humanos en un mundo donde todo o mucho se puede llegar a automatizar y personalizar, y cómo descubriremos y crearemos los nuevos nichos y estéticas que darán forma a este futuro.\n\nVamos con la transcripción de esta interesante charla que puedes, también [escuchar en Spotify](https://open.spotify.com/episode/2gWsqLT4BRELrLdl7Gd9h4?si=7424b773226b4b66).\n\n\n## Transcripción\nSoy cofundador y CEO de Get on Board, una plataforma que se dedica, desde hace muchos años (de hecho, cuando di la primera charla acá, ya estaba metido en eso), a conectar talento con empresas tecnológicas que valen la pena. Talento como ustedes, con empresas como las de ustedes.\n\nLo que voy a hablar no tiene, tangencialmente, que ver con eso. Yo creo que esta es la única conferencia suficientemente ñoña para poder compartirles lo que les voy a compartir. Y, la verdad, es que, como les digo, esto tiene, tangencialmente, que ver con Get on Board. Es más una volada que me he estado pegando y que necesito decírselo a alguien. Creo que este es el lugar correcto. Como les digo, yo no sé si en otra conferencia podría pegarme esta volada.\n\nNo es la primera vez que hago el ejercicio de hacer una predicción. En 2015, escribí en *UX Magazine* sobre cómo el diseño web, que en ese tiempo estaba súper en boga, se iba a morir. Me odiaron mucho, pero si lo vuelven a leer, es un artículo que envejeció bastante bien.\n\nAsí que, aquí vamos de vuelta: ¡abróchense los cinturones y acompáñenme en el viaje al 2035! Les voy a contar de qué se trata su trabajo en 2035:\n\n- Esta es tu oficina: vives, tal vez, en Valdivia, o en algún lugarcito recóndito en la montaña, en la playa o donde se nos antoje.  \n- Tu empresa tiene tres personas en total, toda la empresa. Y no, no es una startup (no acaba de empezar): tu empresa tiene tres personas.  \n- No tienes un título definido. Tu rol no es claro; simplemente eres cofounder, y eso es lo más definido que puede llegar a estar tu función.  \n- Trabajas orquestando muchas cosas: orquestas servicios, orquestas aplicaciones, APIs. Digamos que tu trabajo del día a día se compone de elegir y orquestar.  \n- Diriges los productos que consumes.  \n- Tu propio negocio es absolutamente personalizado. Lo que tú produces tiene un nicho muy pequeño y, para esas personas que lo compran, o para esos negocios que lo compran, se siente hecho específicamente para ellos.  \n- Todo lo que tú consumes en el día a día—las aplicaciones que usas, los servicios que consumes, los productos que utilizas—se siente hecho a la medida para ti. Nadie usa lo mismo y nadie consume lo mismo. (Es un poco como el canal de Óscar; los más viejos se acordarán de esa referencia de *Plan Z*).\n\n\n¿Cómo te descubren? ¿Cómo haces que tu negocio se dé a conocer en este mundo tan atómico, tan hiperpersonalizado?\n\nHay marketplaces donde tú lanzas tus productos, postulas tu servicio. Tu producto automáticamente es comprado, automáticamente adquirido. Empiezas a tener plata el mismo día en que lo lanzas, y empieza a ser, digamos, comprado “programáticamente” por montones de otros servicios.\n\nCuando digo que el futuro del trabajo es atómico, *atómico* puede significar muchas cosas. Por ahí alguien me dijo: “Ah, yo pensaba que atómico era que era bacán”. Pero no sé si es bacán; no sé si esto es una utopía o una distopía. No lo sé.\n\nPero, cuando hablo de \&quot;atómico\&quot;, me refiero a nanoempresas hiperpersonalizadas. Y ese, digamos, es... son las dos grandes cosas que quiero exponerles hoy día.\n\nCreo que las empresas del futuro van a tener de una a tres personas, y no estoy hablando de startups. La mayoría de las empresas del futuro, o la empresa típica del futuro, la organización típica del futuro, va a tener de una a tres personas. Me voy a dedicar el resto de esta charla a explicarles por qué.\n\n## 100x más barato y 100x más rápido\n\nEstán pasando tres cosas muy locas y, por mucho que hace rato el taxista ya nos hable de inteligencia artificial, creo que casi nadie le ha tomado el peso a estas tres cosas que están pasando:\n\n1. La primera es que la inteligencia artificial y otras tecnologías están bajando el costo de construir productos en un factor de 100x. Esto está pasando ahora. Esto no es una predicción. El costo de construir productos está comenzando a disminuir en un factor de 100x.  \n2. De la misma forma, la inteligencia artificial y otras tecnologías están acelerando la velocidad en un factor de 100x. Y no es lo mismo, porque algo puede salirte 100 veces más barato pero tomarte la misma cantidad de tiempo, o algo puede salirte 100 veces más rápido pero costarte lo mismo. Ahora lo estás haciendo 100 veces más rápido y te está saliendo 100 veces más barato.  \n3. Además, la inteligencia artificial está bajando la barrera de conocimiento para poder construir una aplicación a cero. (No está todavía en cero, pero está tendiendo a cero).  \n\nY eso está pasando ahora. Hay una aplicación que se llama Bolt, donde, con un prompt y sin necesidad de saber nada de código, escribes qué quieres y, en 25 segundos, tienes una aplicación construida y corriendo en tu navegador. Eso está pasando ahora. No necesitas saber nada de código y, luego, con más prompts, la sigues conectando y la sigues mejorando. Eso está sucediendo en estos momentos. \n\n## Producción personalizada\nAsí que, cada vez, es menos necesario producir en serie. Y esto es otra cosa a la que no le hemos tomado el peso: los negocios de productos personalizados, como tazones y poleras, hace 30 años atrás no existían. ¿Se han preguntado por qué? Porque no existía la tecnología para producir cosas por unidad. La impresión 3D está permitiendo producir por unidad cualquier cosa.\n\nNacimos en un mundo donde las cosas se tenían que fabricar en serie, se tenían que fabricar a escala, donde era necesario replicarlas por 1.000, por 10.000 o por 100.000 para que fuera viable.\n\nEntonces, todos teníamos que comprar la misma polera en Falabella; todos teníamos que comprar el mismo tazón. Hacerle un tazón a mi papá por su cumpleaños era imposible. O sea, ¿quién te lo iba a hacer, a menos que lo pintaras a mano?\n\nLas tecnologías están llevándonos a que, cada vez, sea menos necesario producir cosas en serie. Y no le hemos tomado el peso a las consecuencias de eso.\n\nEntonces, procesemos estas ideas:  \n\nSi podemos construir productos que son 100 veces más baratos y las economías de escala dejan de ser un límite, como lo han sido hasta ahora, entonces podemos construir productos **100 veces más personalizados con el mismo costo**.  \n\nO sea, si yo tengo una aplicación, un chat, un banco o lo que sea, y me sale 100 veces más barato hacerlo, puedo generar 100 copias personalizadas para atender a 100 grupos de personas de manera mucho más específica y directa.  \n\nY, si el costo de lanzar startups está bajando y tendiendo a cero, porque ya el costo de hacer un MVP con algo como Bolt es cero (Bolt salió hace como dos semanas, por eso les digo que esto está pasando ahora), entonces podemos atender nichos de mercado mucho más pequeños.\n\n## Acceso universal al emprendimiento\n**¿El tamaño del mercado dejará de ser relevante?**\n\nSé que hay muchas personas emprendiendo acá, y cuando uno emprende tiene que pensar en el tamaño del mercado. Mientras más grande el mercado, mejor, porque es caro construir cosas, es caro montar aplicaciones, es caro hacer productos. Obviamente, tienes que poder rentabilizar, y para eso necesitas vendérselo a mucha gente.  \n\nPero, ¿qué pasa si el costo se va a cero? Puedes atender micronichos de mercado. Y si la barrera de entrada cognitiva para lanzar startups y construir aplicaciones tiende a cero, cualquier persona puede ser parte de las startups del futuro.\n\nY cuando digo \&quot;cualquiera\&quot;, es cualquiera. Da lo mismo su nivel de educación, da lo mismo su nivel de preparación, da lo mismo sus conexiones sociales. Si necesito cero cognición, solo necesito tener una idea. Cualquiera, potencialmente, puede tener una idea.  \n\nEso no significa que todo el mundo lo va a hacer. Pero cualquier persona va a poder hacer las startups del futuro.  \n\nHay un libro que a mí me encanta, que se llama *What Technology Wants*. Lamentablemente, no está en español —no sé por qué, porque tiene como 20 años—, y es de Kevin Kelly, el fundador de la revista *Wired*. En este libro, habla de cómo la tecnología tiene ciertas tendencias propias: se mueve con su propio ritmo, es un ser vivo con su propia voluntad. Más allá de lo que a nosotros, los humanos, nos importa o queremos, la tecnología avanza, por un lado o por otro, en ciertas direcciones que no se detienen ni se revierten.  \n\nLa tecnología progresa continuamente hacia ser más barata. Nunca, ningún progreso tecnológico ha sido más caro. Por supuesto, hay cosas como nuevos fármacos que, cuando se lanzan, son más caros, pero la alternativa era la nada, y luego tienden a bajar de precio inevitablemente. Todo lo que se ha construido tiende, eventualmente, a bajar de precio y también a ser más distribuido.\n\nTal como pasa con la impresión 3D, con lo bueno y lo malo. La gente puede imprimir pistolas en cualquier lugar del mundo con una impresora 3D, pero también puede hacer juguetes en cualquier parte del mundo de forma más fácil y modular. O sea, ya no tenemos que comprar un bloque gigante, un monolito; podemos comprar las piezas.  \n\nSi algo es más barato, puedes producir más de eso. Si es más distribuido, lo puedes producir en cualquier parte.\n\nAntes, la producción y la fabricación se concentraban en puntos específicos; incluso la construcción de tecnología tendía a concentrarse en puntos específicos.\n\nAhora, gracias a Starlink, internet, YouTube y GPT, cada vez podemos hacer las cosas en más lugares.\n\nSiendo todo más distribuido, es más fácil que cualquiera pueda hacer las cosas de forma más modular.\n\nAdemás, no necesitas hacerlo todo tú, y eso es cierto desde que empezó la computación. Uno dice: \&quot;Estoy programando una aplicación\&quot;, pero eso es solo la punta del iceberg. Por debajo hay una gran cantidad de módulos, librerías y sistemas que se conectan y te facilitan la vida para que puedas escribir tu código. Uno ni siquiera se da cuenta.\n\nSi algo es cada vez más inteligente, significa que no necesitas entenderlo ni monitorearlo. Todo ya funciona así. Simplemente, no hemos tomado conciencia de hasta qué punto es así, pero estas tendencias no se detienen ni se revierten.\n\nSi empezamos a proyectar estas líneas hacia el futuro, comenzamos a ver las cosas que se materializan.\n\n## Reducir la complejidad\nNo sé si han estado siguiendo los avances de Ruby on Rails y las charlas de DHH, pero parte de su filosofía es que nos estamos enredando tanto con tanta complejidad para lanzar una aplicación web, cuando antiguamente era subir un HTML a un FTP y tenías tu página web.\n\n¿En qué momento nos complicamos tanto la vida? ¿En qué momento nos enredamos tanto?\n\nCuriosamente, algunos de los progresos tecnológicos son más simples, y el hecho de que sean más simples también es una variable que los vuelve más accesibles.\n\nO sea, no es solamente que nos hagan la vida más fácil a nosotros, los usuarios, mientras que por debajo es una maraña cada vez más compleja. Muchas veces es así, pero no siempre, y no lo es para todo el mundo. También podemos usar la inteligencia para simplificar las cosas, y hoy en día estamos teniendo más abundancia de inteligencia.\n\nPor ende, podemos usar esa inteligencia para simplificar también, y esto habilita tres cosas.\n\n## 1. Acceso universal al emprendimiento y startups de una persona\n\nLa primera es el acceso universal al emprendimiento. Y cuando digo que \&quot;se habilita\&quot;, no quiero decir que ya se materializó y que ahora corramos por los prados en pelota, sino que estas son cosas que se vuelven posibles: el acceso universal al emprendimiento.\n\nLiteralmente, cualquier persona va a poder hacer un producto. Por ende, explotarán las startups de una persona, o incluso de menos de una persona. Esto ya está pasando. Hay personas –y creo que incluso hay gente acá en la audiencia– que no trabajan en una sola cosa, sino que tienen un portafolio de pequeños negocitos, de pequeños proyectitos, y cada uno les renta un poco de plata.\n\nEs decir, su dedicación es de 0.5 personas o incluso de 0.3 personas. Ni hablar de quienes se dedican full time a algo. Las startups de una persona van a explotar, porque cualquiera va a poder hacer una startup.\n\n\n## 2. La hiperpersonalización y los hiper-nichos\n\nLo segundo: la hiperpersonalización y los hiper-nichos.\n\n¿Qué pasa si cualquiera puede emprender y crear una startup? Tienes infinita competencia, porque, para lo que sea que quieras hacer, cualquiera lo puede hacer.\n\nTal como tú pudiste hacer un prompt y sacar una aplicación en dos minutos, el resto del mundo también lo puede hacer.\n\n¿Cómo escapas de la infinita competencia?\n\nTe refugias, te escapas, te vas hacia un nicho. Un nicho lo más específico posible, donde nadie más te haga la competencia. Un nicho que, necesariamente, está cerca de ti, cerca de lo que tú haces.\n\nDe esa forma, escapas de la competencia. Tal vez alguien está haciendo una aplicación de chat para los negocios de fintech en Santiago; bueno, yo voy a hacer una aplicación de chat para los negocios de fintech en el sur, en Valdivia. Y tal vez lo hago hiperpersonalizado e hiperespecífico para ese nicho y, por ende, no tengo que andar compitiendo.\n\nEsto ya está sucediendo, solo que en una escala un poquito mayor.\n\nAntes, esto no era posible porque las economías de escala no permitían hacer un producto tan específico, tan hiper-nicho, tan mega-personalizado. Entonces, esta es otra de las cosas que se empiezan a habilitar con todo esto que está pasando.\n\n## 3. Productos y equipos cada vez más pequeños\n\nLo tercero: las empresas y los servicios se miniaturizan y se vuelven modulares.  \n\nLos equipos de trabajo son cada vez más pequeños.  \n\nPorque, si el costo de hacer algo baja en 100x y, al mismo tiempo, la facilidad para hacerlo sube infinitamente, entonces no necesito tanta gente para lograrlo. Necesito menos personas para operar. Por ende, mi *overhead* es más pequeño, lo que significa que puedo sacar muchas más cosas con una, dos o tres personas.  \n\nTodo tiende a modularizarse; todo se \&quot;apifica\&quot; (que es una palabra que he estado escuchando mucho en hackathones últimamente).  \n\nTambién se vuelve fraccional. Muchas personas aquí están comenzando a hacer su trabajo de manera fraccional, y la palabra \&quot;fraccional\&quot; hace tres o cuatro años ni siquiera la escuchaba.  \n\nEsto está empezando a pasar: se está subdividiendo, modularizando. Ya no necesitamos trabajar a tiempo completo en muchas cosas. Todo se convierte en un servicio, en una API. Además, muchas de estas nuevas posibilidades de negocio o hiper-nichos son agregadores o integradores de otras soluciones.  \n\nPor ejemplo, hay un servicio que se llama Merch. Merch lo que hace es ofrecer una API para conectarte con más de 200 servicios: CRMs, ATS, plataformas de pago, de contabilidad, de tickets, etcétera. Ellos han montado un negocio siendo agregadores de otras APIs. Eso ya existe, es un negocio que les va bien, ya se usa y es súper conveniente.  \n\nAhora imaginen un esquema donde tal vez viene alguien más que se agrega a Merch y agrega otros agregadores.  \n\nO puedo hacer un Merch mucho más especializado. Si Merch se integra con 200 servicios pero lo hace de manera genérica, yo podría hiper-especializarme y ser un agregador solo para negocios de salud, porque la salud tiene ciertas necesidades que otros no tienen.  \n\nOtro ejemplo es Plaid. Plaid no es un banco; se especializa en una capa muy delgada de la experiencia bancaria: el registro y validación de identidad de los clientes y, por ende, el *onboarding* para asegurar las transacciones y mover dinero. Hoy en día, si quieres montar un *neobank* o una fintech, uno de los servicios que orquestas es Plaid. Nuevamente, esto ya está pasando.  \n\nBillie Eilish sacó una canción llamada *Ocean Eyes*, que fue la primera en volverse famosa. Es una canción que ganó triple disco de platino. Tradicionalmente, para hacer una canción con ese nivel de éxito, se requiere un montón de gente:  \n\n- Los músicos de sesión (tres, considerando que una persona puede tocar más de un instrumento).  \n- La persona que canta.  \n- El productor.  \n- El ingeniero de grabación, mezcla y masterización.  \n- El manager del estudio, porque, por supuesto, esto se tiene que grabar en un estudio.  \n\nBueno, Billie Eilish y su hermano hicieron todo eso entre los dos, en el living de su casa, usando *Logic Pro*, y consiguieron triple platino.\n\nEl nivel de producción y calidad necesario para alcanzar ese reconocimiento y fama fue logrado por dos personas. Y no usaron inteligencia artificial, por si acaso. Esto demuestra que esta tendencia no tiene que ver solo con la inteligencia artificial, sino con hacia dónde nos lleva la tecnología como una globalidad.  \n\nEsto tiene tres consecuencias. Y si las empiezas a asimilar y a masticar, te deja pensando:  \n\n### 1. Mueren las *job descriptions* y los roles: dejas de definir tu carrera como una colección de tareas.\n\nSi te preguntan: “¿Qué eres tú?”, y respondes “Soy programador” o “Soy diseñador”, te estás definiendo en función de una tarea. Pero las tareas ya no van a importar; las tareas las hará una inteligencia artificial. Entonces, si las tareas que solían definirte las hace una IA, ¿a qué te dedicas tú? ¿Cómo te defines tú?\n\nYo pienso –y esto es parte de mi volada; ustedes pueden tener la suya, y ojalá la tengan– que tu carrera se va a definir como *expertise* en un hiper-nicho. Es decir, serás una persona experta en algo que nadie más domina, y así definirás tu carrera. Por ende, los empleos, en lugar de ser un listado de tareas o funciones como “necesitamos que haga esto, cuide esto otro, programe aquí y mantenga esto allá”, se parecerán más a buscar un co-founder. Serán un llamado a una misión: “Quiero resolver este problema, y necesito a la persona que más se apasione por este tema en el mundo. ¿Dónde está? ¿Quién es?”.  \n\n### 2. El trabajo se vuelve remoto por defecto\n\nPara mí, esto es una consecuencia lógica. Si vas a atender un nicho muy estrecho e hiper-especializado, más te vale encontrar a la persona que más sepa de esto en el mundo. Porque, si no la encuentras, alguien más lo hará, y perderás en la competencia. Por lo tanto, tiene sentido buscar a estas personas hiper-expertas, sin importar dónde estén, y la tecnología ya lo permite. Hace mucho rato que muchos de acá trabajamos de forma remota.  \n\n### 3. Todo pasa a ser protocolos que pueden interoperar y componerse\n\nTodo se convierte en bloques de Lego. Lo que hoy entendemos como *productos* comienza a desarmarse; el famoso *unbundle*. Esto ya está pasando: productos que se convierten en combinaciones de piezas independientes que encajan entre sí, infinitos servicios e infinitas APIs.  \n\nEntonces, lo que uno llama un producto, en realidad, es una cáscara, una bolsa, una caja llena de piezas de Lego. En este ecosistema, donde tienes infinitos servicios, microproductos y nanoproductos, habrá compradores con inteligencia artificial que evaluarán una API. Automáticamente, decidirán si les sirve para su propósito y, si les sirve, comenzarán a pagar por ella en ese mismo momento.  \n\nPasas de una idea a tener plata entrando en un día: lo que te demoras en sacar el servicio, lanzarlo, ser descubierto por uno de estos sistemas, y que comiencen a comprarlo y consumirlo. Porque consumir una API es fácil y rápido.  \n\n## ¿Dónde quedan los humanos en todo esto?\n\n### Nichos, nichos, nichos\n\nBueno, ¿dónde quedamos los humanos en todo esto? Esa es la gran pregunta. Yo creo que en dos grandes cosas.  \n\nLa primera tiene que ver con el descubrimiento de nuevos nichos, porque, cuando hablamos de nichos, el nicho es algo que es inherentemente humano.  \n\nLas máquinas no tienen gustos ni necesidades. Incluso si una máquina expresa empatía o crea, es porque un humano le dijo que lo hiciera.  \n\nLos nichos son inherentemente humanos por dos razones. Primero, porque son arbitrarios. Acuérdense de los pokemones, esas tribus urbanas con sus propias necesidades, gustos y demandas específicas: ropa, maquillaje, música. Todo eso es arbitrario, es random, definido caprichosamente por nuestros gustos.  \n\nSegundo, los nichos están totalmente sujetos a la cultura y cambian constantemente. ¿Cuántos pokemones quedan? Ninguno, obvio, porque se aburrieron. Ahora hay nuevas tribus urbanas, nuevas estéticas y nuevos conceptos. Tal vez hoy están mucho más atomizados que antes. Piensen en cómo han explotado los géneros musicales: ya está pasando.  \n\nCon la famosa pirámide de Maslow, comenzamos satisfaciendo nuestras necesidades más básicas y luego nos vamos elevando.  \n\nPor ejemplo, los millonarios que empezaron explotando petróleo o vendiendo granos de maíz se hicieron ricos. Una generación más tarde, fundan institutos culturales, hacen filantropía. Nos elevamos.  \n\nEventualmente, todos nos comportaremos como los billonarios actuales, porque las necesidades más plebeyas, más cotidianas, estarán cubiertas. Entonces, nos elevaremos y empezaremos a preguntarnos: **¿Qué le aporto yo al mundo?**\n\nY nos vamos a mirar de manera más amplia, y vamos a tener un séquito de asesores y consultores virtuales que nos van a asesorar, tal como hoy en día asesoran a Bill Gates. Eso ya está empezando a pasar.  \n\nNunca vamos a dejar de tener necesidades; por ende, siempre vamos a tener nichos nuevos que se podrán descubrir e inventar. Muchas de las necesidades que tenemos hoy en día, culturales y sociales, son inventadas por nosotros. Porque se nos antojó, y está bien, no hay ningún problema con eso.  \n\nY eso me lleva a lo segundo: **la creatividad y la redefinición estética.** Descubrir nuevos nichos es un acto creativo, tal como cuando se lanza un nuevo género musical, un nuevo estilo estético, una nueva c
