g&quot;:[0,&quot;3-libros-para-entender-mejor-el-trabajo-remoto-95e15af3e51d&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;3 libros para entender mejor el trabajo remoto&quot;],&quot;description&quot;:[0,&quot;Aprende sobre las ventajas, desafíos y estrategias del trabajo remoto con estas lecturas esenciales para profesionales y empresas&quot;],&quot;date&quot;:[3,&quot;2017-06-29T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/3-libros-trabajo-remoto.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Libros&quot;],[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nA pesar de que cada vez es más frecuente escuchar que los libros van a desaparecer, que la gente ya no lee y que las redes sociales y su formato “express” con contenidos principalmente audiovisuales se han apoderado del conocimiento, al menos del cotidiano, los libros siguen siendo una buena y confiable fuente para aprender.\n\nAdemás, los libros tienen esa magia asociada a los objetos de colección donde todavía una linda portada y una edición de calidad, con un empaste prolijo y un cuerpo elaborado con materiales duraderos pueden llevarnos fácilmente a gastar sin medirnos cuando de adquisiciones literarias se trata.\n\nOtro punto importante y a favor del libro es que lo digital, más allá de matar el soporte escrito, ha facilitado las cosas en términos de portabilidad, lectura y acceso a precios razonables a través de los e-books y la masificación de las Kindle.\n\nPero hoy no voy a hablar del hábito de lectura propiamente tal, sino más bien de aquellos libros, digitales o impresos, que nos aportarán una nueva visión sobre el trabajo remoto o reforzarán aquello que ya sabemos en relación a esta modalidad que ha venido para instalarse. He aquí tres recomendaciones:\n\n## 1. Remote: Office Not Required\nEl fenómeno del “trabajo desde casa” se explora a fondo en este libro de los fundadores de Basecamp, Fried y Hansson, que señalan la creciente tendencia de los empleados que trabajan desde casa (y en cualquier otro lugar) y explican los desafíos y beneficios inesperados que esta modalidad tiene.\n\nLo más importante, muestran por qué algunas empresas como Yahoo y otras mundialmente conocidas, quieren promover este nuevo modelo de hacer las cosas. La figura laboral jerárquica “bajo un mismo techo” está disminuyendo constantemente debido a la tecnología que está creando rápidamente espacios de trabajo virtuales y permitiendo a los trabajadores aportar sin agruparse físicamente.\n\nHoy en día, el nuevo paradigma es “mover el trabajo a los trabajadores, en lugar de los trabajadores al lugar de trabajo”. Según Reuters, 1 de cada 5 trabajadores mundiales opta por el teletrabajo y casi el 1 0%de esta fracción trabaja desde casa todos los días. Otro dato importante es que las madres, en particular, acogerán esta tendencia y por otra parte, un 60% desea tener una opción de trabajo flexible.\n\nPero las empresas también ven ventajas en el modo en que el trabajo a distancia aumenta su grupo de talentos, reduce la rotación, disminuye su huella inmobiliaria y mejora la capacidad de realizar negocios en múltiples zonas horarias, por nombrar sólo algunas ventajas.\n\n**Fried y Hansson convencerán a los lectores de que dejar que todo o parte de las funciones de trabajo a equipos a distancia, demostrando con precisión cómo se puede llevar a cabo un trabajo remoto de excelencia.**\n\n## 2. El Teletrabajo\n\nEste libro de María Belén Romero habla sobre como la unión entre el progreso tecnológico y la externalización productiva, ha hecho posible la aparición y desarrollo en el panorama laboral de un nuevo fenómeno denominado “teletrabajo”, que compagina el uso de las nuevas tecnologías informáticas y de las comunicaciones con el concepto de flexibilidad del lugar de trabajo.\n\nAdemás, se postula que en los próximos años el número de teletrabajadores aumentará sensiblemente, sobre todo, una vez que se superen los principales impedimentos para su generalización.\n\nUna de las más importantes limitaciones para su expansión ha sido hasta ahora la ausencia de una respuesta normativa específica a esta realidad socio-laboral, que generaba una sensación de desprotección en las personas proclives a practicarlo y la oposición de los sindicatos por temor a que esta nueva forma de organización del trabajo favorezca la explotación de los trabajador.\n\nSin duda un análisis profundo de la realidad social y económica en torno al trabajo remoto que no puedes dejar de leer.\n\n## 3. The Remote Jobseeker’s Handbook / La guía para los que buscan trabajo remoto\n\nSi nunca antes trabajaste de manera remota, es difícil saber cómo empezar, qué puertas tocar, qué es lo que los empleadores buscan realmente y cómo conseguir tu primer trabajo remoto.\n\nPor eso, esta práctica guía te abrirá la mente a la hora de planificar tu estrategia de búsqueda y te dirá también cómo comportarte adecuadamente en el singular mundo del teletrabajo. Mediante este libro, podrás construir un plan de acción sólido para encontrar ese trabajo que tanto soñaste, de manera fácil, clara y bien pensada.\n\nPor último te dejamos otros links de interés con más lectura para los más curiosos. 🤓\n\n1. http://www.emprendedores.es/gestion/descarga-libros-gratis-trabajo-distancia-remoto\n2.  https://zapier.com/learn/remote-work/\n3. http://scottberkun.com/yearwithoutpants/\n4. http://blog.arkency.com/async-remote/\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;3-pasos-fundamentales-para-crear-marca-personal-y-conseguir-un-trabajo-remoto-7a9673d15360&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;3 pasos fundamentales para crear marca personal y conseguir un trabajo remoto&quot;],&quot;description&quot;:[0,&quot;Descubre cómo construir tu marca personal, destacar en comunidades y fortalecer tu reputación online y offline.&quot;],&quot;date&quot;:[3,&quot;2017-01-24T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/alvaro.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Marca Personal&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nCrear una marca no es algo que logremos de la noche a la mañana. La competencia en el mundo laboral es dura y si no nos esforzamos corremos el riesgo de ser fácilmente reemplazados, quedando en el anonimato.\n\nPero también es cierto que para lograr el éxito debemos crecer siempre a nuestro propio ritmo, sin forzar las cosas y tratando primero que todo de superarnos a nosotros mismos. No existe nada de malo en repetir los procesos muchas veces hasta que nos salgan bien. Lo importante es nunca perder el norte.\n\n![nicho](/blog/images/posts/alvaro.webp)\n*Álvaro Herrera, colaborador de PostgreSQL, participando de la versión 2016 de “9punto5”.*\n\nSi somos talentosos, generamos un producto interesante y destacamos en una comunidad, es muy probable que una empresa de nuestra área en busca de talentos pose sus ojos en nosotros. Es cuestión de saber apretar las teclas adecuadas.\n\nPero veamos. Existen ciertos elementos que son muy valorados a la hora de levantar una marca y lograr ese tan ansiado puesto en un equipo de mundial. Primero hay que tener una buena reputación. Esto, no es más que la propia identidad de cada uno, que a medida que nos profesionalizamos va ganando valor, es lo que puedes vender al resto. Una buena reputación habla de uno mismo antes de que la gente te conozca, por eso es tan importante en sus dos ámbitos de acción.\n\nLa reputación offline es la que se genera en la vida real, trabajo, redes de la vida rutinaria, mientras que la reputación online es la presencia que tenemos en internet, la participación en comunidades virtuales, la publicación de proyectos, la ayuda a otros usuarios en foros y plataformas, entre otras. Lo importante es no olvidar que todo suma, que cada persona es importante y puede lograr una diferencia.\n\nPero este post anuncia 3 pasos esenciales para acercarse al levantamiento de una marca y ser un buen prospecto para el trabajo remoto.\n\n## 1) Compartir conocimiento y trabajo en plataformas\nCompartir conocimiento es fundamental en la industria actual. Crear proyectos, asociarse, apoyar a otras personas en situaciones similares, son acciones básicas que permiten construir una base de tu reputación. Las empresas actualmente buscan tus perfiles en plataformas, porque saben que el contacto con la comunidad y la habilidad de hacer un impacto en esta es fundamental. Las plataformas varían desde Github, Stack Overflow, Reddit, Dribbble, entre otras (no olvides dejar tu trabajo en modo público).\n\n## 2) Escribir en blogs \n&gt; Como por ejemplo Medium, Tumblr, Blogger\n\nTener una opinión sólida que se sustente en el conocimiento y en la constante investigación siempre despertará el interés y la curiosidad de otros usuarios, que a la vez validarán el contenido y replicarán a sus contactos. Mediante este tipo de redes es muy fácil cautivar la atención de potenciales clientes o empresas que buscan talentos. De igual forma, crear perfiles detallados en LinkedIn y Angelist nos mantiene vigentes. Al final de cuentas, se trata de ser un proyecto activo e ir actualizando periódicamente nuestra información.\n\n\n![ignacio][image-2]\n&gt; Ignacio Romero de Slack, hablando en “9punto5” sobre los problemas al colaborar entre varias personas.\n\n## 3) Promocionar proyectos en charlas o redes sociales\n\nCuando tu opinión ha alcanzado un nivel profesional y comienzas a ser invitado a diversas instancias como congresos, eventos masivos o plataformas de tutoriales, para contar tu experiencia debes ser constante en la promoción de estos logros. No cualquiera es invitado a dictar una charla especializada frente a una audiencia y por pequeña que esta sea, nos posiciona como líderes de opinión en relación a un determinado tema. Nunca olvides capitalizar cada instancia en que tu nombre se posiciona. Nunca sabes quién puede estar observando.\n\nPero además de lo técnico, también debes contar con habilidades que siempre son bienvenidas en cualquier equipo y que las empresas actualmente buscan cada vez con más frecuencia: empatía, destreza, cortesía, ludicidad, solidaridad y buena administración de los tiempos.\n\nFinalmente, esperamos que comprendas que detrás de cada proyecto existen personas. El éxito o el fracaso de estos dependerá de la constancia y de cuánto esfuerzo pongamos en su ejecución. Importa contar con las herramientas profesionales para lograr un producto de alto nivel, pero no podemos desconocer que somos individuos que se desenvuelven en sociedad y que las redes son factor crucial a la hora de alcanzar nuestras metas.\n\nNo descuides tu interacción en el ámbito personal, laboral, virtual y presencial. Verás que de cada grupo humano podrás obtener un aprendizaje que te ayudará a subir otro peldaño más.\n\n[image-1]:\t/blog/images/alvaro.webp\n[image-2]:\t/blog/images/ingacio.webp&quot;]}],[0,{&quot;slug&quot;:[0,&quot;9punto5-proyecciones-y-desafios-para-el-2017-4c2f77ea042c&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Proyecciones y desafíos para el 2017&quot;],&quot;description&quot;:[0,&quot;Conoce los desafíos 2017 de 9punto5: ruedas de negocios, demo day y apoyo a creativos para internacionalizar servicios trabjanado remoto.&quot;],&quot;date&quot;:[3,&quot;2017-01-12T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/proyecciones-desafios-2017.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;9punto5&quot;],[0,&quot;2017&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;2016 fue un año bien movido para Uprise y Nube Cowork. Ambas empresas crecieron y expandieron sus redes tanto en el ámbito de la creación de software y apps, como la instalación de un espacio de trabajo colaborativo que pudiera concentrar al mundo emprendedor e innovador de Valdivia en un sólo lugar.\n\nDiversos proyectos y actividades nos mantuvieron ocupados. En el camino conocimos a mucha gente, nos ganamos la confianza de personas maravillosas y pudimos demostrar lo que somos capaces de hacer cuando uno le pone ganas y pasión a lo que le gusta.\n\nAlgunos de los asistentes de la primera versión de 9punto5.\nPero también estas dos iniciativas valdivianas se unieron con el fin de realizar “9punto5”. El encuentro de trabajo remoto más grande de Latinoamérica. Como somos “malos para soñar”, la idea que teníamos era levantar un hotspot no sólo para los desarrolladores digitales, sino para el trabajo remoto en Valdivia. Y lo logramos.\n\nEl pasado 1 y 2 de septiembre esta ciudad vibró e instaló temas importantes para el futuro del ámbito laboral en la región y el país, logro del cual nos sentimos sumamente orgullosos.\n\nCon la vara así de alta, conseguimos que vinieran a Valdivia representantes de empresas tan importantes como Google, Slack, Toptal, Spotify, entre otras, incluso Jordan Rudess, tecladista de la banda Dream Theater.\n\nPanel de discusión creativo.\nPara este 2017, además de una interesante parrilla de expositores, la organización se plantea nuevos desafíos, por lo que se espera contar con instancias que complementen el alcance y la posibilidad de generación de redes globales que ofrece el evento.\n\nNuestros desafíos más importantes:\n\n## 1.- Generar ruedas de negocios para conectar empresas con talentos remotos\n\nEl foco de esta actividad es conectar empresas con desarrolladores, diseñadores, escritores, músicos y miembros de la comunidad creativa de la región y alrededores. Queremos vincular gente que usualmente no tiene oportunidades de acceder a contactos importantes en empresas y por otro lado, dar a conocer a los talentos que están siendo buscados para desafíos laborales.\n\n## 2.- “Demo Day”\n\n“Demo Day” generalmente se relaciona con empresas presentando un producto para obtener inversión y cash extra. ¿Podemos hacer un “Demo Day” de talentos remotos? Más de esto pronto.\n\n## 3.- Apoyo a las empresas relacionadas al ambiente creativo para internacionalizar sus servicios\n\nEsto es ambicioso. Existe una deuda con el sector creativo, su profesionalización y su adecuada internacionalización. Queremos que, al igual que un desarrollador o programador de apps, un creativo pueda vender sus productos y servicios, trabajando de manera remota, a su ritmo y sin sacrificar sus ideas. Entendemos que estos procesos tienen otros tiempos, requerimientos y finalidades, por eso consideramos elaborar un documento guía que sirva para encauzar esa materia prima que da vida a nuestra región, de manera tal que pueda convertirse en una herramienta de desarrollo personal y profesional para los creadores.\n\nContinuamos con las pilas cargadas este 2017 para seguir levantando temas de interés en torno al trabajo remoto. Esperamos no solo ver crecer nuestra región, sino también el país con lo que cada profesional y creativo puede hacer y generar con sus negocios. Manténgase atentos.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;9punto5-y-google-unen-fuerzas-884016b6896&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;9punto5 y Google unen fuerzas&quot;],&quot;description&quot;:[0,&quot;Únete al primer Launchpad Build de Google en Chile en “9punto5”. Accede a charlas exclusivas, talleres y aprendizaje con líderes como Paco Solsona.&quot;],&quot;date&quot;:[3,&quot;2017-06-15T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/9punto5-Launchpad-Build.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Oportunidades&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Google&quot;],[0,&quot;Launchpad Build&quot;],[0,&quot;Paco Solsona&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nParticipa del del primer Launchpad Build dirigido a startups, y que se llevará a cabo en el marco de la segunda versión de “9punto5”.\n\n\nDespués de tanto tiempo sin publicar, queremos empezar anunciando las primeras sesiones y speakers de la versión 2017 de “9punto5”.\n\nY nos complace anunciar, que Valdivia será el epicentro de evento inédito de Google en Chile.\n\nAsí es.\n\nContaremos con la participación de Francisco “Paco” Solsona, líder del equipo de Google Developers Ecosystem para América Latina de habla Hispana (SpLATAM), quien encabeza el apoyo a startups en esta parte del mundo por parte de Google.\n\nJunto a esto se anuncia el primer “Launchpad Build” de Google en Chile, que consiste en un día intenso de aprendizaje y trabajo en el que se entregan los mejores recursos para construir un negocio a través de contenido en charlas y talleres especializados.\n\nO sea, cualquier persona con ticket para “9punto5”, tendrá acceso a estas sesiones de aprendizaje.\n\nPara la venta de tickets, puedes ver más información acá.\n\nAhora, la pregunta. ¿Qué tiene que ver Google y un “Launchpad Build” con el trabajo remoto?\n\n\nLaunchpad de Google previamente en Latinoamérica.\nCreemos que varias interrogantes que tiene la comunidad van por el lado de “como partir en el ecosistema”, “como desarrollar habilidades de negocio”, “como iniciar un negocio”, “como conseguir un trabajo remoto”, etc.\n\nEstas sesiones responderán esas preguntas, con el sello Google y toda su infraestructura en términos de influenciadores y socios en la región.\n\nPara “9punto5”, es fundamental que las empresas y emprendedores locales le tomen el peso a poder desarrollar un plan de ventas y marketing congruente. Tener el apoyo de Google en esto será crítico para motivar y enseñar cómo los negocios funcionan en el mundo.\n\nGoogle tiene un activo en ayudar a las startups con potencial a convertirse en compañías exitosas. Cada año impactan en más de 400 startups, 1.200 emprendedores, 100 mentores e influenciadores y 50.000 desarrolladores y emprendedores a través de los eventos de sus comunidades.\n\nEstamos más que contentos en contar con el apoyo de este gran referente tecnológico.\n\nPor último, tenemos confirmadas speakers y charlas de la aerolínea Latam, Fintual, BCI, #700, Continuum, ArchDaily, entre otras. Más info de eso, pronto.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;atraccion-retencion-y-retorno-del-talento-f26e471a64c5&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Consejos prácticos para cambiarte a vivir a la &#39;ciudad de tus sueños&#39;&quot;],&quot;description&quot;:[0,&quot;Descubre cómo hacer una transición exitosa a una nueva ciudad y trabajar remotamente desde allí&quot;],&quot;date&quot;:[3,&quot;2017-12-23T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/tips.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Comunidades&quot;],[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;**Me gustaría vivir en.... O quisier volver a... ¿Qué hago ahora?**\n\nEsta pregunta es común entre quienes deciden cambiar de ciudad por diversas razones, como:  \n\n- Perfeccionar sus habilidades o cursar un posgrado, aprovechando programas como Becas Chile u otras alternativas.  \n- Explorar nuevos lugares, culturas diferentes y adquirir experiencia profesional para su desarrollo personal.\n- Buscar nuevos orizontes, debido a la falta de oportunidades que hay en el lugar donde viven hoy. O bien, atraídos por la calidad de vida que ofrece otro país o ciudad.\n\nEl origen de este post viene de un correo relacionado con esto mismo, que nos alegró mucho recibir, y que sirve para compartir ideas de lo que podría hacer alguien que esté explorando formas de instalarse en una nueva ciudad.\n\n\n![mail](/blog/images/posts/mail.webp)\n&lt;figcaption&gt;Gracias María José por tu mail y dejar que lo compartiéramos.&lt;/figcaption&gt;\n\nAl organizar 9punto5 hemos conocido muchos casos de chilenos y extranjeros que se han movido de país y/o ciudad (yo mismo me vine al sur de Chile el 2013), entre ellos varios vivien el trabajo remoto.\n\nAsí que aprovecho de compartir algunas ideas que hemos aprendido y pueden servir para comenzar a prepara el viaje.\n\n## Trabajar en el lugar donde quieres vivir\nClaro, una vía es encontrar trabajo en el mismo lugar, pero en el caso de ciudades pequeñas (Valdivia tiene unos 160 mil habitantes) claramente existen menos posibilidades, aunque la razón de sus muchas virtudes y buena calidad de vida vienen también precisamente de su tamaño.\n\nClaramente desde 9punto5 buscar trabajo a nivel local, no es nuestra única o primera opción, porque sabemos que vivir en una ciudad no significa necesariamente trabajar en y para esa ciudad, sino que es perfectamente posible trabajar desde ella. Lo que además genera beneficios a nivel local, ya que tener talento instalado aporta a su desarrollo (genera conocimiento, diversidad, movilidad, redes, consumo, incluso empleo).\n\n## Trabajar desde el lugar donde quieres vivir\nEntonces ¿cómo hacer para moverme a una nueva ciudad?, acá van las ideas,\n\n1. Aprende todo lo que puedas sobre como funciona el medio del que te gustaría ser parte (comunidad), conversa mucho en el, abre los ojos y oídos para detectar dolores, problemas y oportunidades.\n2. Busca, conéctate y colabora de forma genuina en esas comunidades, ya sea de forma offline u online, se un aporte real para esa comunidad.\n3. Busca comunidades del lugar que estás explorando como destino (igual cómo hizo María José). Empieza a probar desde ya como es su “onda” o ambiente. Puedes utilizar eventbrite, meetup.com o welcu para descubrir comunidades que regularmente estén haciendo actividades sobre temas que te interesan.\n4. Desde ya comienza a generar tu propio aprendizaje, posicionamiento y reputación o marca personal (ej. escribe aquí mismo en Medium, sobre lo que te gusta y lo que quieres hacer, también podrían ser en youtube, a través de podcast u otros medios) acá es muy importante ser constante, incluso esto puede ser una vía para descubrir que cosas te motivan e interesan de forma más profunda.\n5. Genera redes y conversaciones con la intención de ofrecer solucionar problemas con tus capacidades.\n6. Comienza desde ya a validar si del otro lado estarán dispuestos a trabajar contigo.\n7. Encuentra quienes valoren el cumplimento de objetivos y plazos por sobre la “hora silla” (el tiempo que trabajas, el tradicional marcado de tarjeta).\n8. Construye una propuesta de lo que podrías hacer por otros y compártela la mayor cantidad de veces que puedas, escuchando con atención los comentarios que recibas de vuelta.\n9. Busca de forma activa el primer “cliente” que diga que si (podría ser alguien que quiera contratarte como empleado o bien en modalidad de prestación de servicios), una vez llegado acá el siguiente debería ser mas fácil.\n10. Aprende de los que dicen que no y por qué lo hacen.\n\nLo se, no es fácil. Esto representa el desafío de que tu mismo seas capaz de generar oportunidades, pero hemos visto que funciona, cada vez conocemos más casos.\n\nFinalmente decir que acá no tienes una receta, agrega o quita todo lo que necesites o te haya dado resultados. Mejor aún si nos dejas comentarios aquí o un link a otras ideas, así todos vamos aprendiendo.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;bienestar-felicidad&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Explorando el bienestar y la felicidad con Caroline Knopel&quot;],&quot;description&quot;:[0,&quot;Explora los modelos de felicidad y bienestar con Caroline Knopel, quien profundiza en propósito, autoconocimiento y relaciones clave para una vida plena.&quot;],&quot;date&quot;:[3,&quot;2023-11-19T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/bienestar-caroline-knopel.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Bienestar&quot;],[0,&quot;Caroline Knopel&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;En nuestra última sesión en vivo, Caroline Knopel de [Denken Consultores](https://denkenconsultores.cl/) profundizó en la idea del estar bien.\n\nRevívela cuantas veces quieras:\n&lt;Youtube client:load id=\&quot;vE0j7jA-MRA\&quot; title=\&quot;Lo que no se dijo sobre el bienestar con Caroline Knopel de Denken Consultores\&quot; /&gt;\n\nCaroline desglosó los modelos de felicidad:  Hedonismo, Eudaimonia, y el modelo PERMA de Martin Seligman que integran los elementos de ambos enfoques.\n\n1. El **hedonismo** se enfoca en maximizar las emociones positivas y el placer.\n2. La **eudaimonia** se centra en vivir plenamente, aprovechando nuestros potenciales y viviendo con propósito.\n3. El **modelo PERMA**, por otro lado, combina elementos de ambos enfoques y se enfoca en cinco dimensiones clave para la felicidad a largo plazo: emociones positivas, compromiso, relaciones interpersonales, sentido de la vida y logro.\n\nAl abordar el concepto de significado (meaning en inglés), Caroline nos  comentó que es algo esencial para la felicidad a largo plazo. Según el modelo de Seligman, el significado se refiere a tener una vida con un propósito claro y coherente. Y para alcanzar una sensación de significado en la vida, es importante cumplir con tres componentes:\n\n1. **Vivir una vida significativa**: Implica tener una existencia que uno considera valiosa y que tiene un propósito claro. No se trata solo de buscar la felicidad a corto plazo, sino de perseguir metas y objetivos que aporten un sentido más profundo y duradero a la vida.\n2. **Propósito**: Este aspecto del significado se relaciona con tener objetivos y metas que movilicen y den dirección a la vida. Donde es importante identificar un propósito que sea personalmente relevante y motivador, lo que es un gran motor para el bienestar general.\n3. **Coherencia**: Se refiere a la alineación entre las acciones, los valores y las creencias de una persona. Una vida coherente es aquella en la que hay una concordancia entre lo que se hace, lo que se valora y en lo que se cree.\n\nCaroline también resaltó la importancia del **autoconocimiento**, la **gratitud**, el **optimismo realista**, y el **cuidado de las relaciones interpersonales** como elementos esenciales para alcanzar un estado de bienestar.\n\nMuy interesante también fue lo que nos comentó sobre el valor de establecer objetivos alineados con nuestros propósitos y ser flexibles en su revisión y ajuste.\n\nCaroline además compartió el estudio de Sonya Lyubomirsky que indica que nuestra felicidad depende tanto como un 40% de actividades deliberadas y que están en nuestro control. Algo que subraya la capacidad que tenemos de influir fuertemente en nuestro bienestar.\n\nOtras ideas que podrás encontrar:\n\n1. **Importancia del autoconocimiento**: Reconocer y comprender las propias fortalezas y debilidades es esencial para el crecimiento personal y la felicidad.\n2. **Establecimiento de metas personales**: Las metas deben estar alineadas con los valores y propósitos personales, y deben ser realistas y flexibles para adaptarse a los cambios de circunstancias.\n3. **Gestión de pensamientos pesimistas**: Reconocer y cuestionar pensamientos negativos es crucial para mantener una perspectiva optimista y realista de la vida.\n4. **Práctica de la gratitud**: Cultivar la gratitud mejora la apreciación de la vida y refuerza las relaciones personales.\n5. **Mantenimiento de relaciones sociales saludables**: Las relaciones interpersonales son fundamentales para el bienestar emocional. La comunicación honesta y la escucha activa son esenciales en este aspecto.\n6. **Expresión del afecto y apreciación**: Demostrar aprecio y afecto hacia las demás personas no solo beneficia al resto sino también a quien expresa el afecto y agradecimiento.\n7. **Gestión del tiempo y rutinas saludables**: Organizar el tiempo eficientemente y mantener hábitos saludables son clave para lograr un bienestar integral.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;bienvenidos-a-9punto5-2019-512741f0f7fb&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Preparándonos para la cuarta versión de 9punto5&quot;],&quot;description&quot;:[0,&quot;Explora las nuevas formas de trabajar y crear en 9punto5, con más de 30 referentes internacionales. ¡Aprovecha el White Sale ahora!&quot;],&quot;date&quot;:[3,&quot;2019-05-19T03:00:17.342Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/futuro-trabajo.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;9punto5&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nRegularmente recibo notificaciones de *Google Trends*  sobre cuanto interés existe por el “Futuro del Trabajo” y “Future of Work”. En el último tiempo, diría que desde el año 2007, estos temas tienen un interés cada vez más creciente como muestra la imágen de arriba.\n\nY es que el trabajo, como lo conocemos, está enfrentando — y enfrentará — cambios muy significativos. Por eso, este 2019 nos reuniremos por cuarto año consecutivo para pensar y hablar sobre estas transformaciones, conocer a personas que están empujando estos movimientos, empresas que están apostando por nuevas formas de trabajar y crear, las tecnologías que están impactando e impactarán el futuro y como es emprender y hacer negocios en este nuevo contexto.\n\n9punto5 este año será los días 29, 30 y 31 de agosto ¡Nos vemos en Valdivia!\n\n## White Sale hasta el 21 de mayo\n\nHasta el 21 de mayo puedes aprovechar el “*White Sale*”, con un hasta un 40% de descuento, el mejor precio público al que puedes conseguir tu ticket a la conferencia antes de que empecemos anunciar Speakers.\n\n![Medium-Image](/blog/images/posts/1*QLVt0x5kzLrC19qUT7jTPA.png)\n\n*9punto5 nació en el año 2016 como un esfuerzo por construir* ***la principal conferencia anual sobre trabajo remoto y tecnología de Latinoamérica.*** *Estamos preparando todo para su cuarta versión consecutiva en Valdivia, en la que reuniremos más de 400 asistentes de más de 10 países junto a más de 30 referentes internacionales y nacionales en estas temáticas que participan como expositores del evento.*\n\n---\n*Como cada año, nos reunimos durante 3 días para disfrutar la ciudad de Valdivia y hablar sobre las habilidades que necesitan desarrollar las personas y las empresas ante los cambios que enfrenta la forma trabajar y hacer negocios.*&quot;]}],[0,{&quot;slug&quot;:[0,&quot;buscando-el-equilibrio-entre-el-trabajo-y-la-familia-f5b464e51499&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Buscando el equilibrio entre el trabajo y la familia&quot;],&quot;description&quot;:[0,&quot;En marzo de 2020, Felipe viajó a México y grabó un curso con Platzi, compartiendo su experiencia en equilibrar trabajo y familia en tiempos de pandemia.&quot;],&quot;date&quot;:[3,&quot;2020-04-30T04:31:05.374Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/platzi.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Platzi&quot;],[0,&quot;Cursos&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nEn tiempos de anuncio de pandemia y comienzo de cierre de fronteras y *lockdowns,*  hacer un viaje internacional es una decisión riesgosa desde el punto de vista que se le mire. Mi pasión por la música, la comida y pasar un tiempo de relajo con mi familia, me llevó a estar en México durante las primeras semana de Marzo de 2020. Pude ver a una de mis bandas favoritas en Toluca, comer muchos tacos con flan mexicano, y regalonear a mis seres queridos.\n\nComo buen hábito al viajar y ya con algunos conocidos en el DF contacté a Fabián de 9punto5 para enviar algunos correos y ver posibilidades de colaboración. Platzi es uno de ellos, ya que estuvieron presentes el 2018 en Valdivia con uno de sus founders, Christian Van Der.\n\n## Grabamos un curso para Platzi sobre trabajo remoto\n\nPara nuestra suerte, y entre correos que iban y venían logramos concretar un capítulo en uno de los cursos de trabajo remoto que tiene esta monumental plataforma de aprendizaje.\n\nEra mi primera vez grabando un curso bajo condiciones pro, con un equipo dedicado a la educación remota, y con una profunda comunidad. No les voy a mentir. **Fue una experiencia frenética, casi instantánea y de varias horas de incertidumbre de mi parte antes de grabar.**\n\nCuando llegué a grabar, Diego de Platzi me decía: “Generalmente le damos 1 mes de plazo para generar contendo para un video de duración de 10 minutos”. ¡Yo tuve 12 horas! (Disculpen mi cara sin sueño placentero).\n\nSi el bien contenido “me lo sé de memoria” por mi experiencia viajando, trabajando remoto y organizando una conferencia de esta temática por quinto año consecutivo, siempre aparecen los nervios. Más aún, el miedo de hacer el ridículo o de equivocarse más de la cuenta mientras se graba.\n\n**La temática de este capítulo fue sencilla y toca mi fibra principal, que es mi familia.**  En el, intento explicar ciertos desafíos y vivencias de cambiarse de país, viajar con familia mientras trabajo y disfrutar nuevas culturas y espacios en el mundo. El contenido es corto, al grano y especial para estos tiempos de pandemia donde varios se encontraron de golpe “encerrados” con sus hijos o parejas.\n\nUnos días más tarde, tuvimos otra oportunidad de colaboración con Platzi, esta vez junto Fabián, para grabar un episodio del podcast “Humans of Platzi”.\n\nEspero les guste y disfruten de estas dos instancias.\n![Medium-Image](/blog/images/posts/1*u6ASVgaRdU7JzMLF1dUTSw.png)\n\n- Video de Platzi: [Equilibrio entre trabajo y familia al teletrabajar](https://platzi.com/clases/1872-teletrabajo-trabajo-remoto/27401-equilibrio-entre-trabajo-y-familia-al-teletrabajar/)\n\n![Medium-Image](/blog/images/posts/1*TcqWVIguyatVNeqV4u3mLQ.jpeg)\n\n- Podcast: [Humans of Platzi — Felipe Peña y Fabián Acuña](https://soundcloud.com/platziteam/redefinir-el-futuro-del-trabajo-remoto-fabian-acuna-y-felipe-pena)&quot;]}],[0,{&quot;slug&quot;:[0,&quot;certeza-psicologica&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Certeza psicológica: Cómo Google descubrió las claves del éxito de los equipos de trabajo&quot;],&quot;description&quot;:[0,&quot;Google revela cómo la certeza psicológica impulsa equipos de alto desempeño&quot;],&quot;date&quot;:[3,&quot;2023-02-16T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/certeza-psicologica.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Equipos&quot;],[0,&quot;Alto desemepeño&quot;],[0,&quot;Certeza psicológica&quot;],[0,&quot;Google&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Durante años, Google ha invertido recursos y esfuerzos en determinar los factores que hacen que los equipos sean exitosos. Su proyecto “Aristóteles” fue uno de los más emblemáticos sobre esto, encontrando hallazgos sorprendentes en cuanto a lo que hace que un equipo sea efectivo.\n\nEl origen del proyecto Aristóteles de Google estuvo en responder a la pregunta: **¿Qué características tienen los equipos de trabajo más exitosos?**\n\nLa meta del proyecto era determinar qué patrones y dinámicas son las que marcan la diferencia en los equipos que logran resultados sobresalientes, en comparación con aquellos que experimentan fracasos o dificultades.\n\nEl estudio no fue fácil y tomó años. Inicialmente, tuvieron dificultades para encontrar patrones y conclusiones concretas.\n\n## Patrones que no hacen la diferencia\nAlgo confuso fue notar que los equipos efectivos tienen configuraciones y dinámicas muy diferentes. Por ejemplo:\n\n- Algunos equipos exitosos se componían de amigos que mantenían lazos fuera de la oficina; en otros equipos igualmente efectivos, las personas se convertían en completas extrañas una vez terminada la jornada laboral.\n- Unos tenían estructuras más jerárquicas, y otros equipos igualmente exitosos eran más horizontales.\n\nPero lo más confuso fue darse cuenta de que equipos parecidos a simple vista mostraban una efectividad totalmente diferente.\n\nTambién encontraron variables que no hacían la diferencia como:\n\n- Estar en la misma oficina\n- Que las decisiones se tomen de forma consensuada\n- Cuán extrovertidas son las personas del equipo\n- El nivel de seniority de las personas que componían los equipos\n- El tamaño del equipo\n\n## La respuesta de los equipos exitosos: certeza psicológica\n\n**Finalmente, llegaron a la conclusión de que los equipos efectivos compartían como factor común la \&quot;certeza psicológica”.**\n\n### ¿Qué es la certeza psicológica?\nLa seguridad compartida en un equipo. Saber que puedes tomar riesgos y mostrarte vulnerable en el grupo sin que esto traiga consecuencias negativas.\n\nHacer esto no pone tu trabajo en peligro. No es un problema decir que no sabes, puedes hablar de tus errores, hay espacio para experimentar, para innovar y aprender.\n\nEl efecto multiplicador de un equipo está en la forma de interactuar y su capacidad para colaborar\n\n## Los aportes individuales no hacen la diferencia\nLa cultura y el ambiente de trabajo permiten que esto pase.\n\nY aunque a algunos les gustaría creerlo, no importa tanto el perfil y las capacidades de un empleado a nivel individual. Las dinámicas de un equipo siempre serán el límite de lo que alguien podrá hacer a nivel individual.\n\nY aunque es cierto que los equipos se beneficien de tener “densidad de talento”, este factor por si solo no hará que un equipo sea exitoso.\n\nEntonces, cuando llevamos el problema de la productividad a nivel organizacional, tendremos que decir que —en esta mirada— **las habilidades individuales de cada persona importan menos que la cultura del equipo y de la organización**.\n\nPero recuerda que hay distintos tipos de equipos y, como dijimos antes, el estudio de Google encontró certeza psicológica en equipos jerárquicos y horizontales, en los equipos de amigos y en los con trato solo profesional.\n\nEsto quiere decir que la certeza psicológica se manifestará diferente en distintos equipos. Así y todo, en el fondo, lo que encontrarás en ellos es que las personas pueden hablar de sus inseguridades, incomodidades, miedos y aspiraciones de forma constructiva.\n\n## Recursos y datos extra\nPrimero un par de datos más técnicos:\n\n1. El estudio mostró que tener “[una buena distribución de los turnos de conversación](https://9punto5.notion.site/Pr-cticas-de-equipos-de-alto-desempe-o-7ada7bf496b747979de22b1a9ce8d5ea#a46e4be7ea2643f089970f35fdb93bd5)” era importante\n2. También encontró que los equipos más efectivos tenían un “[alto nivel de sensibilidad social promedio](https://9punto5.notion.site/Pr-cticas-de-equipos-de-alto-desempe-o-7ada7bf496b747979de22b1a9ce8d5ea#a46e4be7ea2643f089970f35fdb93bd5)”\nY finamente algunos recursos adicionales si quieres explorar más este tema:\n\n- [Presentación De Francisco “Paco” Solsona de Google en la conferencia 9punto5](https://www.slideshare.net/9punto5/francisco-solsona-cultura-infraestructura-y-okrs).\n- El [sitio oficial de Google](https://rework.withgoogle.com/print/guides/5721312655835136/) tienes un set completo de recursos como [esta CharlaTEDx](https://youtu.be/LhoLuui9gX8) para que entiendas mejor, repases y apliques la idea de la certeza psicológica en tu equipo.\n- Artículos del **New York Times** [en inglés](https://www.nytimes.com/2016/02/28/magazine/what-google-learned-from-its-quest-to-build-the-perfect-team.html) y [español](https://www.nytimes.com/es/2016/03/16/espanol/la-busqueda-de-google-por-el-equipo-perfecto.html) sobre el estudio de Google sobre la certeza psicológica.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;como-evaluamos-la-postulacion-de-speakers&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Cómo evaluamos la postulación de Speakers&quot;],&quot;description&quot;:[0,&quot;Conoce los criterios de evaluación que utilizamos para calificar las postulaciones de Speakers&quot;],&quot;date&quot;:[3,&quot;2021-06-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/evaluation.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Speaker&quot;],[0,&quot;Charlista&quot;],[0,&quot;CFP&quot;],[0,&quot;Convocatoria&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;En este artículo te comparto los criterios de evaluación que utilizamos para calificar las postulaciones de Speakers.\n\nAunque este artículo no pretende ser una guía universal que te permita sabe cómo piensan todas las organizaciones de conferencias, en nuestra experiencia otras conferencias buscan aspectos similares.\n\nAsí que a lo menos tendrás una idea clara de qué pensamos, qué buscamos y cómo evaluamos tu postulación.\n\nEstos son los cuatro criterios de evaluación que utilizamos.\n\n## Criterio 1: Fit con 9punto5\n\nEste criterio es muy importante, ya que buscamos propuestas que calcen con el espíritu de 9punto5. ¿Qué buscamos en las y los speakers? Cada año que hacemos una convocatoria escribimos un artículo con ese detalle.\n\nUna buena síntesis de lo que nos mueve en 9punto5, es hacer que el trabajo sea mejor. Tanto para las personas a nivel individual, como en las organizaciones. Siempre miraremos esa búsqueda en tu propuesta.\n\nNuestra conferencia siempre ha sido un espacio de comunidad y estamos atentos a las diferentes señales que muestren ganas de dar primero (más que la búsqueda del beneficio personal al ser Speaker).\n\nEste criterio tiene más peso, de hecho ponderamos con un 40% del total de la nota. Por eso es muy importante que tanto el contenido como la motivación que muestras estén alineados —de nuevo— con el espíritu que buscamos en 9punto5.\n\n## Criterio 2: Experiencia como speaker\n\nAquí buscamos que la persona tenga experiencia presentando en público. Capacidad de desarrollar las ideas con claridad. En general, buena oratoria.\n\nEn la postulación pedimos que nos compartas un video de alguna presentación anterior. Si no compartiste nada, es menos probable que estés entre las personas seleccionadas.\n\nAlgo raro pero pasa:\n\n- Tienes videos de presentaciones anteriores, pero no las incluyes en la postulación. Aun cuando lo pedimos expresamente y es algo que lógicamente nos ayuda a evaluarte como potencial speaker. 🤷‍♂️\n\n### Ideas si aún no haz presentado\n\nHoy en día la posibilidad de participar en charlas y actividades online es inmensa. Está lleno de actividades y comunidades que necesitan contenido y colaboraciones. Incluso sin participar de algo “organizado”, puedes “simplemente” preparar algo interesante en tu área de dominio y compartirlo en YouTube o cualquier otra plataforma. Te animamos a hacerlo.\n\n## Criterio 3: Experiencia en el tema que quiere presentar\n\nEsta parte es bien compleja para quienes evalúan. Y aquí es donde tú como potencial speaker tienes que hacer tu parte.\n\nNecesitamos saber que tienes experiencia relevante en el tema que quieres presentar. Que es algo que realmente te interesa, algo con lo que conectas, que te importa. También necesitamos saber que tienes conocimiento y “horas de vuelo” suficientes en el tema, como para compartir aprendizajes significativos con otras personas.\n\n## Criterio 4: Motivación del speaker\n\nEste criterio actúa muy conectado con el primero. Aquí buscamos que nos muestres interés, gusto por el tema que propones. Buscamos interés por colaborar, compartir tus conocimientos para que otras personas puedan sacar sus propias lecciones y quizá evitar errores.\n\nAcá también es importante decir lo que NO buscamos. No queremos personas que vengan abiertamente a vender, a \&quot;pasar un comercial\&quot;, a hacer publicidad. 99,99% de las veces eso será un HARD NO a tu postulación.\n\n## Notas finales\n\nIgualmente muchas postulaciones son super buenas, cumplen bastante bien con todos los criterios, pero:\n\n- Tenemos que hacer el corte en algún punto\n- Quizá no quedaste por muy poco\n\nNo te desanimes, si genuinamente quieres aportar a la comunidad tenemos otros espacios como nuestro podcast o este mismo blog donde podrías también participar. Escríbeme a fabian at 9punto5 dot cl para eso si quieres buscar otra vía.\n\n## Aún nos queda mejorar este proceso\n\nNos gusta transparentar nuestros procesos, nos parece sano y nos ayuda a mejorar. Genial si además esto ayuda a otras organizaciones a tener ideas para sus propias conferencias o eventos.\n\nTodavía nos queda pendiente trabajar en varias cosas, como mejorar nuestro sistema para evaluar y notificar los resultado a las personas que postulan. Si tienes ideas para esto, escríbe a fabian at 9punto5 dot cl.\n\nBuscaremos el tiempo en el futuro para ahondar en este punto y mejorar nuestro proceso.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;conferencia-2024&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Convocatoria speakers 2024&quot;],&quot;description&quot;:[0,&quot;Postula como speaker en 9punto5 2024, la conferencia sobre trabajo remoto y tecnología en Valdivia. ¡Cierre de postulaciones en junio!&quot;],&quot;date&quot;:[3,&quot;2024-05-02T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/temas-2024.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Speaker&quot;],[0,&quot;Charlista&quot;],[0,&quot;CFP&quot;],[0,&quot;Convocatoria&quot;],[0,&quot;Título&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;¡Tenemos fecha para la 8va versión de 9punto5!\n\nNos reuniremos los días **7, 8 y 9 de noviembre en Valdivia**. La Universidad Austral de Chile y su campus Isla Teja, será nuestra anfitriona. Confiamos en que sus paisajes y entorno te harán disfrutar aún más de la ciudad y la conferencia.\n\nPronto te entregaremos más detalle sobre los tickets, agenda y speakers.\n\n## Te invitamos a postular como speaker\nComo en todas las versiones, queremos que participes activamente de la conferencia.\n\nYa está abierta la convocatoria para ser speaker. Buscamos temas variados y, como podrás comprobar, nuestro formulario te dará varias ideas de temas en los que confiamos podrías aportar tanto si estás partiendo en tu carrera, como si ya te salieron canas. 🧓🏼\n\nTen en cuenta las fechas claves:\n\n![timeline](/blog/images/posts/timeline-cfp.webp)\n&lt;figcaption style=\&quot;margin-top: -25px\&quot;&gt;Medidos de junio termina la postulación. Mediadios de julio se comunican los resultados y comienza la preparación. La conferencia es 8, 8 y 9 de noviembre&lt;/figcaption&gt;\n\n\nLas postulaciones cerrarán la segunda semana de junio y los resultados estarán en la segunda semana de julio.\n\n## Apoyo a la postulación\nPor primera vez este año vamos a organizar una serie de eventos para que mejores tu postulación o te animes si tienes dudas.\n\nNos vemos el próximo martes 07 de mayo a las 6:00 pm hora Chile en nuestro canal de Youtube. [Suscríbete](https://www.youtube.com/channel/UChTbwY8jmyJ6v8FtRf4jx6g?sub_confirmation=1) para que no te lo pierdas.\n\nTe invitamos a que, antes de postular, [nos compartas tus dudas en nuestro formulario](https://tally.so/r/3jB0y1). Para responderlas en vivo ese día.\n\n## ¿Te gustaría ser sponsor?\n[Te invitamos a auspiciar la 8ª edición de nuestra conferencia](https://sponsors.9punto5.cl/) donde hablaremos de cómo enfrentamos y resolvemos los complejos desafíos tecnológicos y humanos actuales liderando una transformación constante.\n\nEntre los beneficios de ser auspiciador están poder conectar con **más de 400 asistentes presenciales** y alcanzar a **más de 10.000 personas a través de nuestros canales y estrategia de difusión**. \n\nAdemás, este es un momento excepcional para atraer talento y posicionar tu empresa.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;consejos-para-lc3adderes-de-equipos-remotos-ca3c61242713&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Consejos para líderes de equipos remotos&quot;],&quot;description&quot;:[0,&quot;Consejos de Rafael Galaz para gestionar equipos remotos: comunicación efectiva, condiciones técnicas óptimas, pantalla compartida, seguimiento en línea, retroalimentación clara y creatividad para cohesión.&quot;],&quot;date&quot;:[3,&quot;2020-04-03T15:57:30.350Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/rafa.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fran-daforno&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;**Te compartimos consejos para gestionar equipos remotos: comunicación efectiva, condiciones técnicas óptimas, pantalla compartida, seguimiento en línea, retroalimentación clara y creatividad para cohesión.**\n––\n\n\nHoy tenemos un invitado especial en nuestro Blog.\n\nLe preguntamos a Rafael Galaz, ¿qué consejos recomendaría para gestionar equipos remotos?Si estás pensando ¿por qué a él? Rafa es Abogado y Consultor en técnicas de pensamiento visual para la planificación y gestión de proyectos.\n\nDurante **10 años ha trabajado en remoto coordinando proyectos y equipos de diferentes nacionalidades** , con muchos trabajó por años sin conocerlos de manera presencial.\n\nSi deseas contactarlo su email es rafagalaz@gmail.com.\n\nA continuación compartimos contigo los 10 consejos que nos comentó.\n- **Aquí rigen otras reglas del juego. ¿Ya escuchaste la frase: desaprender para volver a aprender?.**\n![Medium-Image](/blog/images/posts/0-SQBZNL7lBaNPc14P.webp)\n\nEl primer gran consejo es: recuerda que **en el trabajo remoto rigen otras reglas de comunicación que para el trabajo presencial.**  Punto. No es llevar lo que hacías en forma presencial y hacerlo ahora a través de *zoom, hangout o skype* . Nope, aquí las reglas cambian y debes re-aprenderlas. La comunicación entre humanos es compleja y no se limita únicamente a la voz o el texto como canal de transferencia de información sino que se complementa con varios factores que completan la experiencia de comunicación (tono de voz, microgestos, feromonas etc.).\n\nEn el trabajo remoto toda la riqueza de estos diferentes canales de comunicación se ven limitados, y junto con ello aparecen grandes distractivos: varios dispositivos electrónicos funcionando a la vez, un lugar de trabajo móvil o poco adecuado, redes sociales, etc. Todo esto atenta contra la calidad del tiempo y la atención que pueden prestar los miembros del equipo a sus tareas. Por ello, liderar un equipo en estas nuevas condiciones supondrá el desarrollo de nuevas habilidades y familiarizarse con nuevas tecnología.\n\n**2. Asegurar condiciones técnicas óptimas: ahora eres un telecomunicador.**\n![Medium-Image](/blog/images/posts/0-vyxDCDSydPRhnuFq.webp)\n\nNo es un asunto de frivolidad o mero capricho, las condiciones técnicas pueden hacer la diferencia al momento de llevar el trabajo remoto a un buen resultado, te debes “ver bien”, “escuchar bien” y “dar a entender bien”: “Ver bien” significa que detalles como la luz y tu apariencia en cámara sean las óptimas, en lo posible que la altura de la cámara de un plano frontal, y que la informalidad no se transforme en transmitir pereza o desarreglo. Además, te debes “escuchar bien”, altamente recomendado usar siempre audífonos y comprobar la calidad de tu micrófono.\n\n**Debes ser creativo para asegurar un buen audio en todo momento** , por ejemplo, si tienes mala señal de internet y buena señal de celular entonces que tu voz sea por llamada telefónica y la imagen por internet. Si te acomoda hablar sólo por celular, recuerda que la información únicamente oral es más débil que si aprovechas usar la imagen, siempre podrás recabar información viendo a la persona mientras hablas. Debes conocer las diferentes plataformas de comunicación. También una **buena modulación y un tono agradable son claves** , si esto resultaba importante a nivel presencial, en el trabajo remoto será clave para evitar que se produzcan distracciones evitables sobre todo en contextos internacionales.\n\nEl mensaje que quieres entregar debe comunicarse en forma breve y clara en forma oral, y luego repetirse un resumen escrito. Para las reuniones debes crear una cultura de trabajo donde haya **ritmo para pasar de un tema a otro, recoger opiniones y resguarda el correcto uso del tiempo.**\n\n**3. Pantalla compartida, tu mejor aliada.**\n![Medium-Image](/blog/images/posts/0-wvofs2z7pAL_6ny6.webp)\n\nPara hacer más eficaces tus reuniones, ten siempre disponible para compartir la pantalla de tu computador, donde tengas la posibilidad de proyectar una imagen que resuma el contenido que intentas comunicar y para tomar notas o apuntes de los acuerdos que se vayan tomando, así también con la agenda de temas que se quiere tratar y el tiempo asignado a la reunión.\n\n**Tener una pantalla que haga de “pizarra compartida” ayuda a los participantes a focalizar la conversación** , recuerda que cada uno se encuentra en sus computadores, con el celular funcionando y otros distractores, por lo tanto, se necesita que el centro de las conversaciones sea explícito. Jamás tener reuniones a la deriva, sin que nadie tome el control de darle continuidad y cerrarla apenas sea posible “sin apuro, pero sin demora”. Basta que la reunión pierda el ritmo para que tus participantes abran una ventana del navegador y busquen otros contenidos, un buen tip es desarrollar una cultura donde todos deben comentar, de tal forma de asegurarte que están tomando atención.\n\n**4. Follow-up y documentos en línea para fijar objetivos y acompañar procesos.**\n![Medium-Image](/blog/images/posts/0-mk5dEamrimLvbZuX.webp)\n\nOtro buen aliado será tener algún sistema en línea que le permita a tu equipo tener comunicación permanente con las tareas y objetivos en curso, en mi experiencia, no necesitas que sea un sistema sofisticado (que hay muchos disponibles) sino cualquier medio capaz de resumir lo que se espera de cada miembro del equipo de modo particular y qué se espera del equipo a nivel general. Pero altamente recomendado que sea un documento en línea, de tal forma que se actualice en tiempo real y no existan varias versiones. Así también cuando acompañes a tu equipo, evita estar dando permanente feedback utilizando chats o videollamadas, favorece la autonomía evaluando el avance en forma rutinaria pero no insistente.\n\n**5. Retroalimentar a los miembros de tu equipo y cómo dar feedback duro a distancia.**\n![Medium-Image](/blog/images/posts/0-dkKY3r64dL2E7gM0.webp)\n\nEl arte de retroalimentar mejora si se ha instalado una cultura de comunicación fluida donde el equipo se ha acostumbrado a verbalizar lo que piensa y siente. Los equipos presenciales pueden darse el lujo de usar cierto *“metalenguaje”* , donde actitudes informan al entorno, pero en el caso del teletrabajo debe existir con el equipo una cultura de verbalizar todo en tanto sea posible, esto genera un efecto a largo plazo donde los conflictos se solucionan de mejor manera. Como líder del equipo al momento de retroalimentar **debe ser en forma directa, clara y sobre todo precedida de haber promovido una cultura de diálogo permanente.**\n\nCuando toca regañar, sepa **distinguir los elementos objetivos de la conducta o acción que se quiere hacer ver, sabiendo separarlo de los sentimientos que generan el malestar.**  Dígalo todo, pero recuerda que sólo lo que sea verbalizado será lo que se reciba, favorezca la conversación para desarrollar los elementos de su malestar y utilice el lenguaje escrito para formular los acuerdos que dan por solucionado el asunto. Y dígalo o escríbalo, no asuma que el asunto está resuelto si no lo ha dicho expresamente. En contextos internacionales la regla cobra mayor importancia, en algunas culturas decir todo frontalmente es lo habitual, pero en otras se debe trabajar en construir esa cultura de trabajo.\n\n**6. Para el trabajo internacional: buscar horarios y cumplir una regla de oro.**\n![Medium-Image](/blog/images/posts/0-lYs97lhZTGMjtyQO.webp)\n\nSi trabajas en un ambiente internacional, existen varias herramientas para fijar el trabajo sincrónico y las reuniones con distintos husos horarios, mi recomendación es plataforma tipo www.time.is que permiten coordinar varias locaciones y está siempre actualizada con los cambios de hora.\n\nBusca el horario que permita a la mayoría estar cómodos, pero si no es posible, ten en cuenta que tu equipo con el horario menos conveniente estará agradecido que las **reuniones sean breves, ejecutivas, claras y con algún material que resuma los acuerdos**  para ser revisado en otro momento.\n\nY LA REGLA DE ORO para el trabajo con equipo internacionales….. **“NO DAR NADA POR SENTADO”**  (“don’t take anything for granted”) Diferencias culturales, significado de las palabras, usos y modismos hacen indispensable que tus canales de comunicaciones consideren la repetición de la información ya sea de manera oral, escrita o visual. Hasta tener certeza que cada miembro del equipo comprendió sus responsabilidades y tareas.\n\n**7. Creatividad al servicio de la cohesión del equipo.**\n![Medium-Image](/blog/images/posts/0-fTiFb1s0Umiari_F.webp)\n\n**No escatimes en recursos creativos** para dar a los espacios de cohesión del equipo la experiencia mas cercana a estar compartiendo un espacio físico. Ojo en esto, recursos creativos no significa necesariamente invertir dinero en ello, sino buscar **dinámicas para hacer online,**  dibujar, hacer videos o photoshop de baja calidad.\n\nFavorecer lo hecho “a mano” por encima de reenviar un meme o un post o un video que construya una narrativa del trabajo del equipo, de sus logros y anécdotas. Hacer algo con tus manos con una textura “amateur” puede dar un sello más cercano y animará a otros miembros del equipo a hacer lo mismo.\n\n**8. Para detectar y resolver problemas en miembros del equipo. A veces hay que saltarse algunas reglas.**\n![Medium-Image](/blog/images/posts/0-qd8Ya-OYTrzSIsUC.webp)\n\nLos canales de información remotos a veces dificultan la tarea de descubrir sutilezas en el comportamiento humano que develan apatía, rabia, frustración, depresión, etc. La mera evaluación de los resultados, la imagen en pantalla o los textos no son suficientes.\n\nPor el contrario, un emoji, una risa escrita o una imagen de la cámara puede disimular cualquier emoción verdadera. El trabajo remoto tiene ese riesgo real y por lo tanto **el autocuidado ha de ser protocolizado por el líder del equipo** , ya sea velando por el cumplimiento de las políticas de la empresa o bien en el caso del trabajo de pymes crear instancias para conversar únicamente de los estados personales, respetando por supuesto el derecho a la intimidad y generando un ambiente de seguridad.\n\nLos agobios personales no deben ser ocultados por miedo a generar dudas en el proceso productivo, caso contrario se puede generar una verdadera bomba de tiempo. En caso de necesidad, haga lo posible por generar espacios de encuentro presencial para evaluar estos casos.\n\n**9. Cómo evaluar el desempeño.**\n![Medium-Image](/blog/images/posts/0-OKaGzWwj9TEUPD-A.webp)\n\nUn gran desafío en el ambiente remoto es la capacidad de ser sucinto en las interacciones, es decir, la capacidad transferir información de persona a persona con la cantidad justa de palabras de manera eficaz.\n\nEn el caso de la evaluación de desempeño, es fundamental que tus miembros del equipo tengan total claridad cuando la evaluación corresponde a los elementos objetivos de las tareas o responsabilidades asignadas, sin confundirse por ello con críticas a la calidad profesional de la persona.\n\nEn el trabajo presencial existen una enorme cantidad de “gestos” y elementos simbólicos que evitan esa confusión, pero en el teletrabajo, cuando toda la información pasa por canales imperfectos de transferencia del lenguaje simbólico o semiótica, se hace necesario hacer explícitas esta distinción.\n\nEn este sentido “evaluar” el desempeño debe darse a entender cómo **“acompañar” un proceso y generar acuerdos para resolver los puntos débiles, destacando los bueno resultados y buscando oportunidad para mejorar.** Para evitar que la evaluación sea entendida como un juicio a la calidad profesional, debes construir una cultura de confianza, de esta forma un eventual mal desempeño no se da a entender como una crítica a la calidad profesional y eso mejora la receptividad de los miembros del equipo.\n\n**10. Finalmente, agregar al menos un 3% de humor, porque lo que no dice, no se presume.**\n![Medium-Image](/blog/images/posts/0-Dzn0GTS0wvYq9iIJ.webp)\n\nAsí como los británicos tienen la sana costumbre de incorporar una nota de humor en todo momento (aunque sea un tipo humor que a veces parece presuntuoso) te recomiendo agregar un nota de humor en un margen del 3% de tus comunicaciones.\n\nPor supuesto **humor que tenga como objeto reírse de uno mismo, juegos de palabras y observaciones sutiles,**  jamás a costa de algún miembro de tu equipo.\n\n**El objetivo es crear un ambiente donde se haga explícito lo ameno y cercano** , no habiendo tantos canales de comunicación para crear ambiente en el equipo, el humor es una forma de hacerlo explícito. Como apuntábamos antes, en contextos de trabajo remoto, algunas cosas que no se explicitan (como el buen ambiente), puede que no se presuman.\n\nSi te gustó este post te aconsejamos veas la charla de Rafael, en la última versión de 9punto5, titulada “Cómic y el visual thinking claves para el trabajo remoto ¡En una red de 82 países!”.\n\n## Por Rafael Galaz\n![Medium-Image](/blog/images/posts/0-oP8wi2ack9MS2UUu.webp)\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;cooperacion-competencia-innovacion&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;La cooperación y la competencia para una economía basada en innovación | Jeannette Von Wolfersdorff&quot;],&quot;description&quot;:[0,&quot;Jeannette von Wolfersdorff explora la cooperación, competencia y liderazgo en sistemas complejos, claves para la innovación y sostenibilidad.&quot;],&quot;date&quot;:[3,&quot;2023-10-04T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/Jeannette-von-Wolfersdorff.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;9punto5&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Charlas&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Cooperación&quot;],[0,&quot;Competencia&quot;],[0,&quot;Innovación&quot;],[0,&quot;Jeannette von Wolfersdorff&quot;],[0,&quot;Transcripción&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n⁠⁠En esta charla y conversación, Jeannette von Wolfersdorff destaca cómo, a lo largo de la historia, la coo⁠⁠peración y la competencia han sido fundamentales para el avance de la humanidad y la creación de sistemas cada vez más complejos. Resaltando cómo ambos elementos son parte esencial para el buen funcionamiento de los equipos, las organizaciones, los mercados y la sociedad.\n\nHabla además del liderazgo basado en el prestigio, y cómo es una versión más avanzada del liderazgo, pero destaca que todavía vemos mucho liderazgo por dominancia.\n\n&lt;Youtube client:load id=\&quot;NoEHR2bxLno\&quot; title=\&quot;Cooperación y competencia para una economía basada en innovación. Por Jeannette Von Wolfersdorff\&quot; /&gt;\n&lt;figcaption&gt;Charla en [YouTube](https://www.youtube.com/watch?v=NoEHR2bxLno).&lt;/figcaption&gt;\n\n## Algunas ideas que nos dejó esta charla:\n\n- La complejidad solo puede ser abordada con mayor cooperación y presión competitiva.\n- Destaca que necesitamos mejor y mayor regulación en el mercado, lo que implica enfrentar un problema complejo. Para ello es necesario un pensamiento sistémico. Este pensamiento requiere de un enfoque iterativo que permita avanzar progresivamente a mayor complejidad.\n- Habla de la necesidad de cambiar las reglas del juego para premiar la sostenibilidad y hacer que las empresas que generan impacto negativo en la sociedad y el planeta, sean inviables comercialmente.\n- Necesitamos liderazgo por prestigio y eliminar la concentración de poder.\n- El liderazgo por dominancia y narcisista no ayuda a la innovación.\n- El valor de la inteligencia colectiva que se crea en espacios protegidos para la cooperación.\n\nFrente a los desafíos que tenemos como humanidad, lo más asombroso es que enseñamos sistema complejo, el system thinking, lo enseñamos, es la base de la computación, lo enseñamos y es la base de la inteligencia artificial, y nosotros no lo aplicamos para nuestra propia gobernanza, y esto es en realidad para mí el desafío del momento más importante que quería destacar\nUstedes que son del ámbito informático... tienen mucho que decir en eso, ustedes saben mucho mejor que otros qué son los que son los procesos iterativos, y es importante hacer el cruce de vuestro conocimiento con la forma como se hacen política económica, para mí es lo más importante.\n\n## Transcripción de la charla\nMuchas gracias y buenas tardes a todos. Tengo poco tiempo, solo 20 minutos, pero quiero compartir algunas ideas con ustedes. Me interesó especialmente estar aquí con esta comunidad de informática, porque pienso que tienen conocimiento muy valioso para la economía. Quiero incentivarlos a reflexionar más profundamente sobre esto.\n\nEn resumen, cuando observamos la historia de la humanidad, comenzamos con sistemas poco complejos y, gracias a la cooperación y competencia, los dos conceptos que profundizo en mi libro \&quot;Capitalismo\&quot;, pudimos avanzar hacia sistemas más complejos. En sistemas creados por el ser humano. El capitalismo es un sistema complejo. Hoy en día, encontramos en un punto intermedio donde experimentamos una mayor complejidad. Todos sentimos la complejidad en los desafíos y problemas que debemos abordar, tanto a nivel empresarial, como sociedad, mercado y planeta. Debemos pensar, en este ciclo estratégico, cómo avanzar hacia una mayor complejidad. Sin embargo, esto requiere más cooperación y competencia.\n\nPorque si no logramos cooperar mejor y cuidar la competencia en los mercados, así como la presión competitiva que necesitamos para innovar, es probable que avancemos hacia estados que se definen más como de caos o de menor complejidad.\n\nCuando vemos la historia de la humanidad, 1.5 a 1.7 millones de años atrás, un equipo de investigación israelí hizo un análisis muy interesante en que destacó que cuando nuestro pre-córtex se desarrolló más, después de que ya hubo homo en el planeta, se logró desarrollar lenguaje y cooperación.\n\nY gracias a que el ser humano tenía mayo entendimiento de su propio pensamiento, su propio pensamiento, emociones, y el de los demás. Una mayor comprensión cognitiva de las emociones y la cognición social. Con esto pudo entender más y cooperar más.\n\nAhora, eso también le permitió competir con otros grupos.  Esto llevó a más rivalidad y competencia también, a menudo a través de guerras, que representan la máxima competencia. Esta competencia intra-grupal también llevó a un aumento de la competencia y la cooperación dentro del grupo.\n\nSi observamos el desarrollo de la humanidad y las empresas y equipos actuales, independientemente de su nivel jerárquico, aquellos que funcionan bien y generan innovación siempre tienen estas dos características: cooperación y competencia. Aunque parezca contradictorio, ambos conceptos son fundamentales para el funcionamiento de un equipo de trabajo, una empresa, un mercado o una institución gubernamental.\n\nEs interesante destacar que, a medida que desarrollamos la capacidad de cognición social, mayor cooperación y competencia, también hubo cambios en nuestro estilo de liderazgo. Esta evolución facilitó el liderazgo basado en el prestigio, donde se elige a los líderes en lugar de imponerlos. Anteriormente, existía un liderazgo basado en la dominancia, que todavía se observa en varios primates, como los chimpancés y los gorilas. En este tiempo de desarrollo más grupal, basado en la cooperación y la competencia, hemos cambiado el estilo maquiavélico de liderazgo.\n\nSegún estudios biólogos evolutivos, cuando comenzó la revolución agraria se desarrolló el poder en las sociedades, cuando las sociedades empezaron a organizarse alrededor de sí mismas y no tanto a través de la recolección y la caza, que fue una forma más primitiva de organización.\n\nHoy día tenemos un estilo de liderazgo combinado por dominancia y por prestigio. Nos sentimos mejor con el liderazgo por prestigio, pero probablemente tenemos más liderazgo por dominancia en grandes organizaciones y donde hay más poder. Aun cuando este liderazgo es en realidad una forma de organizar la humanidad previo a nuestro desarrollo del pre-cortex y tiene raíces en común con nuestros primos primates no humanos.\n\nComo dije, la cooperación y la competencia siempre son la base del buen funcionamiento de equipos, de mercados, de nuestra sociedad, de cualquier nivel jerárquico que uno mire los sistemas. De cuando esto funciona cuando y cuando hay presión para innovar, y a la vez  cooperación para innovar, pasan innovaciones.\n\nLo destaco porque cuando vemos después en realidad lo que pasa en un mercado, vemos un mercado organizado de esta manera, lo vemos en estos círculos. El mercado está organizado de esta manera. Los círculos representan organizaciones y cuando queremos que haya innovación en este mercado, debemos entender que la innovación ocurre a través de las organizaciones y pasa entonces a través de la colaboración y la competencia entre las organizaciones de un mercado.\n\nEs importante porque a veces uno no baja al nivel organizacional al tratar de entender el mercado. Pero como dijo Herbert Simon, el premio Nobel ya dijo en 1991, nuestra economía de mercado podría perfectamente llamarse una economía organizacional también. De hecho, en un documento muy famoso sobre mercados y organizaciones, reflexionó que la economía de mercado podría ser rebautizada sin quitarle importancia al mercado, pero del mismo modo llamarse una economía organizacional. Porque pocas veces reflexionamos sobre la importancia que tiene la organización en cómo nos sentimos, cómo trabajamos y cómo nos comportamos como personas. Cómo nos influyen las organizaciones, porque es a través de las organizaciones y no solo a través de las interacciones entre los puntos que reflejan el mercado, sino a través de ellas es como se maneja el poder en el mercado.\n\nLas organizaciones definen los productos que compramos y el prestigio que se otorga a las personas dentro y fuera de las organizaciones. Son las instituciones que promueven la cooperación o competencia, o que, eventualmente, lo impiden.\n\nSi consideramos esto desde la perspectiva de las organizaciones del sector privado del mercado y nos imaginamos como parte de la sociedad. Cooperar significa tener objetivos en común.\n\nCooperar desde una empresa u organización con la sociedad no significa que la empresa dice lo que se hay que hacer, sino que se deben definir objetivos en conjunto con la sociedad.\n\nSi ustedes tienen que fijar objetivos con este conjunto de organizaciones, naturalmente será más difícil cuando el mercado esté más concentrado.\n\nEste mercado, además, no solo impacta a la sociedad a la hora de definir objetivos en conjunto, que tienen que ver con la sostenibilidad de un país, sino que también tiene impacto a los proveedores, a los empleados dentro de las organizaciones. Dentro de las burbujas, dentro de las organizaciones.\n\nLas organizaciones impactan en las personas más que las personas, en las organizaciones. Tal como Charles O&#39;Reilly lo menciona en un meta-estudio sobre 150 estudios, 80% de ellos después de 2015. Son especialmente personas con más narcisismo las que suben en las organizaciones, son las  ocupan niveles jerárquicos superiores en las organizaciones. Esto es importante porque las organizaciones excesivamente jerárquicas, atrae el narcisismo, cuando premia excesivamente los niveles superiores de la jerarquía.\n\nLa jerarquía y la burocracia, como Charles Perrow dijo en un libro llamado \&quot;Complex organizations\&quot;, producen sumisión y timidez en los niveles inferiores y rigidizan las estructuras de poder.\n\nEsto es importante porque, como señala otro Premio Nobel, el que sube en una jerarquía no necesariamente es quien tiene más talento para la organización, sino el que sube, es el que tiene más talento para subir en las organizaciones. Y ese normalmente es un perfil más maquiavélico, con un estilo de liderazgo basado en la dominancia y no necesariamente por prestigio, ya que saben manipular bien, destaca en entrevistas laborales, destaca a la hora de buscar venture capital también.\n\nEsto produce que en las organizaciones, especialmente en las grandes, los líderes tiendan a ser personas que quizás no son las mejores para escuchar. Esto es importante porque, a menudo, cuando se enfrentan problemas en una institución, se buscan soluciones puntuales, se culpa a alguien por no haber trabajado bien y se busca una solución específica. Sin embargo, como William Edwards Deming dijo en los años 80, el 94% de los problemas en una organización no son el resultado de un mal comportamiento o un trabajo inadecuado de una persona en particular, sino que son causados por problemas sistémicos. Esto implica que el sistema está mal diseñado cuando algo no funciona.\n\nY cuando uno ve de nuevo el mercado con todas sus organizaciones y se da cuenta de que, en realidad, quizás los grandes no cooperan como uno quisiera que lo hicieran, que no impulsan los cambios necesarios para que, por ejemplo, el mercado sea más innovador y sostenible, se necesita un cambio de reglas.\n\nCuando vemos que esta cooperación se dificulta, puede ser porque en estas grandes burbujas, los líderes de las grandes organizaciones, quizás no por no querer sino por no poder, no son los mejores para escuchar. Esto se debe a que, cuando uno tiene un perfil más narcisista, que es precisamente el perfil de especialistas en subir en organizaciones y burocracias, se trata de personas que normalmente tienen un sesgo muy optimista, son menos adversas al riesgo y en general escuchan menos y tampoco validan las críticas, que son necesarias cuando queremos avanzar basados en inteligencia colectiva.\n\nQuiero decir que esto no exime de responsabilidad a las grandes organizaciones cuando no cooperan en los cambios, pero también quiero destacar que cuando esto ocurre, puede ser simplemente un problema sistémico y uno tendría que juzgar moralmente de manera distinta este resultado, porque puede ser una consecuencia de cómo está estructurado el mercado y dentro del mercado, las organizaciones.\n\nLamentablemente, cuando las organizaciones con mayor poder en el mercado son las que deciden más sobre política pública, naturalmente, más se dificultan los avances y también se dificulta la cooperación, los avances en sostenibilidad.\n\nComo vemos también en el caso de Chile y de muchos otros países, la economía se ha ido concentrando en su poder de mercado, lo que significa que la competencia va reduciéndose. Y cuando el poder está concentrado, la cooperación en general no funciona bien, porque las partes cooperan más donde está el poder y no con el bien del total.\n\nEsto es evidente, porque, tal como Luigi Zingales lo destacó también el economista de Chicago cuando pasó por Chile cuando uno pudiera impulsar políticas que no les gustan a las grandes organizaciones hay punishmente y cuando uno coopera con las grandes organizaciones uno recibe beneficios de ellos, pero eso hace que finalmente la concentración agregada en un mercado dificulta que uno avance hacia objetivos país porque los objetivos país fácilmente se tornan objetivo de las grandes organizaciones tal como está estructurado el mercado, y eso dificulta la regulación del capitalismo y lleva reglas contradictorias, no sistémicas, lleva a que distintos grupos finalmente influyen en el marco regulatorio de tal manera de llevar las políticas más hacia su favor, más que hacia una política económica que sea consistente.\n\nLeonard Miksch, un economista alemán, lo mencionó en el siglo pasado, él murió en 1950, y fue uno de los dos padres más importantes de la economía social de mercado en Alemania, cuando dijo en realidad ningún país tiene una política económica de verdad, porque tenemos políticas que se contradicen, pero no una política que apunta a lo mismo si no un gremio pide ciertas cosas el otro gremio pide otra cosa, pero nadie los une en algo más sistémico y coherente.\n\nY puedo contarles en Chile bueno, las políticas como el “registro beneficiarios finales” han costado muchísimo porque ciertos sectores no quieren avanzar hacia este estándar OCDE ustedes ven contradicciones enormes naturalmente en la política industrial, que por suerte ahora tiene más importancia, pero no se coordina con la política regulatoria en el sentido de que cuando créditos Corfo, por ejemplo, se aumentan; o cuando el Banco Estado aumenta su rol; o cuando hablamos de un fondo de fondos, está muy bien eso… pero no es sistémico cuando no se acompaña por política que crean reglas para que la competitividad de la banca, el mercado mismo aumenta su eficiencia, para que ambos políticas regulatorias y la política industrial apunten a los mismos objetivos.\n\nLa pregunta muy breve, pero muy estratégica, es: si vemos la dificultad inherente en el sistema, porque que en realidad ningún sistema que tienda la concentración puede evitar capturas y cuando tiende a la concentración tiende a rigidizar el status quo, eso significa repensar qué podríamos hacer para diseñar dentro del sistema modelos y mecanismos para balancear para contrapesar eso.\n\nNaturalmente, cuando vemos además que tenemos hoy día el desafío en el capitalismo de definir muchas reglas para que la empresa sostenible ganen más dinero, para que la externalidad se ingrese y sea parte de los estados financieros, lo que un economista británico ya dijo en 1920: que la externalidad negativa de una empresa tiene que ingresar en los balances y lo positivo también para que la empresa realmente pueden ser sostenible, por ejemplo si uno ve esto como un objetivo de cooperación entre empresa y sociedad frente toda la complejidad del cambio climático, la falta de la reducción de biodiversidad y muchos otros desafíos muy complejos en la relación empresa y sociedad, cuando uno ve eso tiene que llegar a la conclusión de que la mayor complejidad solo puede abordarse con más cooperación yendo hacia más complejidad aún, y cuando no somos capaces hoy día como sociedad de aumentar nuestra cooperación y mantener presión competitiva o volver a tenerla, el mercado que hoy día en parte carecen depresión competitiva probablemente no vamos a llevar a más complejidad si no más ha estado caóticos.\n\nDave Snowden, ustedes lo conocen, hizo en 1999 esta clasificación de sistemas muy interesantes, donde destacó la diferencia entre los sistemas que son lineales, complicados, caóticos, o complejo.\n\nComplejo es cuando no son lineales cuando no se sabe cómo el sistema va a reaccionar según los inputs que recibe, y me parece muy muy importante destacarlo porque no existe conciencia de que al regular el mercado tenemos en realidad una regulación de un sistema complejo como desafío.\n\nEso significa necesariamente que tenemos que abordarlo con las reglas de sistemas complejos que significa procesos más iterativos, porque yo no sé cómo es el sistema va a reaccionar, entonces tengo que hacer pequeños pilotos, tengo que continuamente ir avanzando y no puedo hacer un gran proyecto de ley cada 10 años y después ver cóm
