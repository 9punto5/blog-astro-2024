orriente de pensamiento, política o lo que sea. Hay un acto de creación, y seguiremos siendo los humanos, por mucho que las máquinas nos aceleren ciertas cosas.  \n\nLos humanos seremos quienes definamos qué es divertido, qué es *cool* y qué es atractivo, porque somos quienes tenemos gustos, preferencias y necesidades.  \n\nEn este mundo, vamos a seguir queriendo entretenernos: ver series, ver TikTok o lo que sea que haya en ese momento. Vamos a querer vernos más bonitos, ganar poder, estatus, influencia, etcétera.  \n\nEsas necesidades primitivas van a seguir ahí. Y, si llevas esto a un extremo lógico: ¿en qué cosa eres más experto o experta que en ti mismo? ¿Quién sabe más de ti que tú? Por ende, creo que mucho de lo que va a ir pasando —y no tengo idea de cuánto tiempo tomará— es que lo que construyas será para ti. Serás tu primer y principal público objetivo, y vas a poder hacerlo.  \n\nSi llevamos todo lo que les he estado mostrando y lo proyectamos hacia adelante, tendemos hacia eso: tendemos hacia esa personalización.\n\nNo soy el único, afortunadamente, que está pensando en estas cosas. Esto lo dice Naval Ravikant: \n\n&gt; Creo firmemente que el tamaño eficiente de una compañía se está achicando, miniaturizándose muy rápidamente, y por ende, el futuro van a ser casi todas startups.\n\nYo sé lo que están pensando ahora: \&quot;¿Quién es este weón? ¿Qué se fumó este weón? ¿Le queda de lo que se fumó?\&quot;\n\nYo no tengo ninguna autoridad para hacer estas predicciones. No tengo idea si se van a cumplir o no. No sé si va a suceder en 2035, 2100, 2026 o incluso antes, y no es el punto. El punto no es que me crean a mí. El punto es que están pasando cosas, y eso es un hecho.\n\nEs importante que nos pongamos a pensar en hacia dónde nos llevan esas cosas.\n\nY, si quiero dejarlos con algo, es con esto: ¿cómo se ve ese mundo donde construir productos de lo que se te ocurra es trivial?\n\nNecesitamos hacer esa reflexión. Necesitamos prepararnos para ese futuro, construirlo, hacerlo suceder nosotros mismos, entender hacia dónde van las cosas.\n\nTodo el objetivo de esta charla, y la razón por la cual fui investido con el honor de abrir esta conferencia, es justamente para dejarlos pensando en esto. Y, si lo piensan, yo me doy por muy bien pagado.\n\n¡Considérenlo!\n\nMuchas gracias.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;la-autoridad-y-la-toma-de-decisiones-dentro-de-una-organizacion&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;La autoridad y la toma de decisiones dentro de una organización&quot;],&quot;description&quot;:[0,&quot;Definir cómo se toman decisiones y distribuye la autoridad en una organización es crucial. La claridad evita conflictos, mejorando la eficiencia y el bienestar del equipo.&quot;],&quot;date&quot;:[3,&quot;2023-01-25T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/autoridad.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Decisiones&quot;],[0,&quot;Autoridad&quot;],[0,&quot;Poder&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Hoy te quiero hablar sobre lo importante que es para una organización **definir claramente cómo se toman las decisiones y cómo se distribuye la autoridad en los diferentes roles y cargos**. Seguido de esto escribiré, en un próximo artículo, sobre los desafíos para comunicar esto.\n\nHace poco [escuché a Agustín Feuerhake hablando sobre buscar socios para tu emprendimiento](https://youtu.be/oFqQybm0CqE?t=352) y hubo un punto de lo que dijo que me sirve para ejemplificar lo **que pasa con los niveles de influencia dentro de una empresa**. Hablando de una de las razones por la que quieres tener un cofounder Agustín decía que:\n\n&gt; Es muy útil tener una contraparte; alguien que te dé otra mirada y al que estés un poco obligado a escuchar y respetar. Si es alguien que tú contrataste, te puede dar ideas que no te gusten, **pero al final no las tomarás con tanta importancia como si la otra persona es tu socio**\n\nEsto es justamente el punto de este artículo: En una organización existen líderes que **tienen la autoridad y legitimidad interna** para tomar cierto tipo de decisiones. **Tu organización necesita tener esto claro**.\n\nEsto es cierto tanto en culturas jerárquicas como en las horizontales, en las que son centralizadas o distribuidas.\n\nSi estás en una posición de liderazgo, tienes que saber como traer claridad a los equipos en relación a esto. Y si contribuyes en un equipo debes saber que esto es real, porque actuar a ciegas de la estructura de poder que existe en tu organización te pondrá en un campo minado.\n\nVeamos entonces cuatro cosas que hacen los líderes que contribuyen a la confusión sobre cómo se toman las decisiones en una organización.\n\n## 1. Abusar de la ambigüedad\nPara no casarse con una posición y dejar un espacio amplio de oportunidades no se define cómo, ni quién toma una decisión determinada. Lo que trae confusión, conflictos y frustraciones.\n\nSi las condiciones de ayer no son las de hoy, y las de hoy no son las de mañana, entonces los equipos no saben a qué atenerse.\n\nEsto pasa, por ejemplo, al entender mal la agilidad y la flexibilidad.\n\nLa agilidad busca empoderar a los equipos para que estén más cerca de la decisión, pero esta ambigüedad les va moviendo y quitando el piso.\nLa flexibilidad es la capacidad de adaptarse al cambio, pero esta ambigüedad altera los acuerdos.\nUna posición cómoda para un jefe, pero que genera inseguridad y malestar en los equipos.\n\n## 2. La cultura de la reacción\nPegadito a lo anterior hay momentos en que NO sabemos qué hacer.\n\nCuando esto pasa, un mal líder avanza con la primera idea que se le viene a la cabeza.\n\nEn cambio, un buen líder sabe cómo identificar cuando está frente a una decisión importante. En esos casos preferirá tomar tiempo y distancia para evitar malos escenarios. Y querrá tener a su disposición la mayor cantidad de caminos posibles antes de comprometer un montón de recursos y energía en una vía de acción (costos de oportunidad).\n\nQuizá esto es justamente uno de los principales beneficios de la comunicación asíncrona en el trabajo remoto. Donde tenemos distancia y tiempo para considerar los asuntos, en vez de solo reaccionar a ellos.\n\nPero la decisión tiene que llegar. De lo contrario, dejar opciones abiertas te deja con el problema del punto anterior.\n\n## 3. Definición pobre de conceptos claves\nOtra cosa que contribuye a la confusión es que ciertos conceptos claves de la cultura no se definen plenamente.\n\nPor ejemplo, es probable que la empresa en que trabajas declare tener valores como ser horizontales, transparentes, dirigirse según los datos, la evidencia y el mérito de las ideas. Pero si la definición no llega mucho más lejos que eso, queda la puerta abierta para la confusión. Las personas necesitamos darle significados a las palabras, así que en ausencia de un marco de referencia claro cada quien hará su propia interpretación de qué significa horizontalidad, transparencia, decisiones “data-driven” y meritocracia.\n\nEs algo que he visto de primera mano haciendo consultoría. No es raro que al preguntar por alguno de los valores inscritos de la empresa, distintas personas entreguen definiciones, incluso, hasta contradictorias sobre un mismo concepto.\n\n## 4. Fundadores que (solo) quieren parecer cool\nPocas cosas son más confusas en una organización que escuchar a un fundador o socio promover algo y luego hacer todo lo contrario.\n\nEsto se ve por ejemplo cuando dicen cosas como “aquí no hay jefes”, “lo que importan son las buenas ideas”, “esto es tu responsabilidad”, pero **no se comportan consistentemente de acuerdo a estas declaraciones**.\n\nDicen este tipo de cosas para sentirse bien, para parecer cool o por cierta presión social, pero sin creerlo realmente —aunque sea en su subconsciente.\n\nMás allá del estilo de liderazgo o del tipo de cultura de una empresa, **lo importante es que la distancia entre lo que se cree, se dice y se hace sea lo mínima posible**.\n\n## Necesitamos predictibilidad\nPara entender mejor la importancia de tener procesos de decisión claros, es esencial que los líderes comprendan que las personas tenemos una necesidad humana fundamental contar con grados razonables de estabilidad y consistencia.\n\n**Para poder organizar tu identidad, tu vida —y obviamente también tu trabajo— necesitas de una base estable en el tiempo**, necesitas conocer cómo va a ser tu vida la próxima semana, el próximo trimestre, el próximo año. Cuando no tienes predictibilidad (o es muy baja), la angustia y la sensación de malestar están garantizadas hasta que no logres ese mínimo de estabilidad sobre tus asuntos.\n\nEl caso es que las personas **siempre preferiremos reglas claras; entender cómo funcionan –realmente– las cosas. En vez de que se evite hablar de esto** (luego puedo no estar de acuerdo con las reglas y, por ejemplo, decidir que la cultura de la empresa no es para mi).\n\nLas compañías se organizar para existir en un contexto (la sociedad y el mercado) y se van estructurando internamente de a cuerdo a los valores y maneras que imprimen primero los fundadores y luego a las prácticas que se van validando como válidas en el tiempo. Todo este viajes está lleno de macro y micro decisiones, que necesitamos saber cómo tomar.\n\n¿Cuántos de los cuatro puntos que tratamos aquí te ha tocado vivir o en cuántos has caído personalmente?&quot;]}],[0,{&quot;slug&quot;:[0,&quot;la-cafetera-o-water-cooler-en-una-cultura-remota-8cec951ced72&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;La “cafetera” o “water cooler” en una cultura remota&quot;],&quot;description&quot;:[0,&quot;Comúnmente, el término “cafetera” o “water cooler” es relacionado con el contacto afectivo entre personas que surge de manera espontánea en las organizaciones, dado el lugar que ocupa en los espacios…&quot;],&quot;date&quot;:[3,&quot;2019-08-08T18:23:39.801Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/0_ZhMA7On0FptT-szr.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;9punto5&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Cultura&quot;],[0,&quot;Trabajo remoto&quot;],[0,&quot;Doist&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;**¿Cómo se da el espacio de la cafetería (o water cooler), cuando trabajamos remoto?**\n\nComúnmente, el término “cafetera” o “water cooler” es relacionado con el contacto afectivo entre personas que surge de manera espontánea en las organizaciones, dado el lugar que ocupa en los espacios de trabajo, cumple al menos 2 roles específicos, uno objetivo y uno implícito de las relaciones:\n- **es donde te detienes a tomarte un café o un vaso de agua para descansar**  y reponerte, entre tarea y tarea, y\n- es un momento donde **se da una conversación sobre el día a día** .\n\nUna de las cosas que se dice es que la **“cultura es lo que ocurre en el water cooler (o frente a la cafetera)”** , puesto que una gran parte de lo que es la cultura en los espacios de trabajo, guarda relación con los momentos implícitos del trabajo. Implícitos que van desde la naturaleza de la carga de trabajo (pensemos en un hospital) hasta manejo de clientes (pensemos en una agencia de medios).\n\n&gt; La cafetera sitúa entre unos y otros el contagio de la cultura, la perspectiva sobre el trabajo y convicciones afectivas que de entrada organizan el tono, la textura de una organización.\n\nEste espacio de encuentro entre compañeros está repleto de ritos y complicidades, del cual se desprenden contenidos, apreciaciones y una cultura como tal. Así, la cafetera sitúa entre unos y otros el contagio de la cultura, la perspectiva sobre el trabajo y convicciones afectivas que de entrada organizan el tono, la textura de una organización.\n\nDe todas las organizaciones, las que nos parecen de interés a ser pensadas en los términos de remotización y cultura son aquellas que parecen ser gobernadas por el sentido, por una cierta dirección de propósito, de significado.\n\nEn esos casos es clave lo que ocurra a nivel de cafetera, puesto que en dicha escena **lo espontáneo pondrá a prueba la veracidad y consistencia de los propósitos de la organización.**\n\nO sea, si existe un lugar donde se revelará que ningún empleado respeta al liderazgo de la empresa, será ahí primero, en códigos indirectos, en miradas de malestar, en gestos de incomodidad. O quién sabe, en el mismo hecho de volver a usar la cafetera luego de años sin tocarla.\n\nPensemos emoción como **e-moción** , poner en movimiento. Dicho movimiento arrastra nuestro ser y **el contacto espontáneo, al ser sano, respeta nuestra dignidad, por ser –justamente– espontáneo. Lo más sano, los mejores formatos del trabajo respetan esta realidad** **sin someterla**  a una forma o un contenido específico. Sin forzar o aplacar lo que se siente simplemente porque se siente. Mucho de eso es vertido en la “cafetera” o “water cooler”, así podemos preguntarnos:\n\nEl emocionar, ¿cómo se da, dónde se da en canales de organizaciones remotas?, seguido, **¿cómo se da la cafetera (o water cooler) en canales remotos ?**\n\n**El término “engagement”, en español sería algo así como “enchufadez”,** internamente**nos parece que se acerca a pasión –lo cual es emocional–** , si respetamos pasión dentro de la jerga del trabajo. Muchos podrán decir que eso es confundirnos entre lo personal y lo laboral, pero justamente aquí está lo nuevo.\n\nLo remoto, nos parece, moviliza la cafetera hacia territorios más cercanos a la vida personal, transporta elementos del cohabitar a una complicidad uno-a-uno o de pequeños grupos. Sabemos, además, que estamos en la era de la soledad, y que eso juega un factor, y por eso insistimos en preguntar:\n\n# ¿Cómo se da la cafetera (o water cooler), en espacios de trabajo remotos?\n![Medium-Image](/blog/images/posts/1_C0qzZEj2ETj1jSZ6H8lUnQ.webp)\n\nLe preguntamos a Daniel García, PR Manager, del equipo de Marketing de Twist, cómo ocurre esto en una empresa 100% remota y distribuida en más de 20 países, que ya posee una cultura en esta modalidad.\n\n***¿Cómo han visto ustedes que se ha dado el establecimiento de lo espontáneo y afectivo en ambientes remotos?***\n\n## Generalist\n\nTenemos una conversación donde están todos los trabajadores de la compañía. Se llama “Generalist” y la utilizamos como una conversación de todo tipo de tópicos, más cercana al uso de cualquier canal de Slack, pero en general son cosas graciosas, personales, comentarios sueltos, GIFs, hitos de la compañía, anuncios muy importantes, conversaciones casuales.\n![Medium-Image](/blog/images/posts/0_WQ50W7J9C0vwzEU5.webp)\n![Medium-Image](/blog/images/posts/0_xxVKVgu6EvMDx90L.webp)\n![Medium-Image](/blog/images/posts/0_YuWHdUT4PuengtU5.webp)\n\n## Doist Lounge\n\nAdemás, tenemos un canal de Twist que se llama**Doist Lounge** . En él se comparten temas con muchas cosas de trabajo que no encajan en ninguno de los otros canales por departamento o proyecto, pero también, de cosas off-topic no relacionadas con el trabajo.\n![Medium-Image](/blog/images/posts/0_t1HcdylLwdNzOaxh.webp)\n\n## [AskDoist]\n\nAbrimos unos threads que se titulan **[AskDoist]**  donde proponemos un tema para conocer personalmente más a los compañeros así como conocer sus prácticas de trabajo.\n![Medium-Image](/blog/images/posts/0_ji-fALXpbmSNc0JI.webp)\n\n## Cumpleaños\n\nCuando es el cumpleaños de alguien, se hace un thread en Doist Lounge para felicitar a esa persona.\n![Medium-Image](/blog/images/posts/0_rvICX4nbA3C_64br.webp)\n\n## Vacaciones\n\nCuando volvemos de vacaciones, publicamos en nuestro thread the OOO (Out of Office) las fotos de nuestro tiempo de descanso.\n![Medium-Image](/blog/images/posts/0_2gCMcRcrfzlfmLvd.webp)\n![Medium-Image](/blog/images/posts/0_CsRP1IVurJzRn7M_.webp)\n\n## Bienvenida a los nuevos empleados\n\nTambién, en Doist Lounge. Se presenta al empleado con su nombre, su rol, sus aficiones y familia.\n![Medium-Image](/blog/images/posts/0_uIwtH8Ta-6HSDPLl.webp)\n\n## Anuncios personales\n\nSe puede utilizar el thread de OOO ó uno nuevo, especialmente para anuncios personales muy importantes como casamientos o nacimiento de hijos.\n![Medium-Image](/blog/images/posts/0_A6JjyAl76e0hK6bd.webp)\n- Publicamos también un resumen de la gente que estará fuera de la oficina la semana que viene.\n- Publicamos un thread del trabajo del que nos sentimos orgullosos, tanto personalmente como de alguien del equipo.\n\n***¿Crees que con estos canales se logra lo espontáneo?***\n\nSí, en la mayoría de los casos. Sobre todo los threads que tienen más que ver con aspectos humanos de los compañeros de trabajo: cumpleaños, nacimientos de hijos, enfermedades, bienvenidas a compañeros, despedidas, etc. Para el caso de conversaciones más informales, solo los extrovertidos participan más. El hecho de que sea todo virtual hace a los introvertidos algo ocultos, pues no son generalmente los que comentan. Yo, por ejemplo, soy de los extrovertidos. Siempre hago bromas, e incluso tengo frases recurrentes que los compañeros reaccionan con el emoji de la risa (😂). Pero los introvertidos, me imagino, que se quedan más observando estas conversaciones, o simplemente reaccionan con el emoji.\n\nDe todas maneras, creo que una conversación water cooler física, un introvertido sería también más observador de la conversación que partícipe, lo sé porque me fijo mucho en el coworking en el que trabajo, sin embargo el hecho de que sea real me imagino que destruye la barrera de lo virtual para que el introvertido participe. Lo virtual hace al introvertido más “cómodo” detrás de la pantalla.\n\n***Por último, ¿cómo se dieron cuenta que era necesario generar este tipo de espacio?***\n\nHan surgido de forma natural en primera instancia. Después el departamento de recursos humanos ha tomado ciertas medidas para evitar el “aislacionismo” y fomentar la conexión entre trabajadores, y después muchos de los que somos extrovertidos en la empresa ponemos nuestro granito de arena para conectarnos, porque sentimos esa imperiosa necesidad de conectar con otro compañero.\n\nPor ejemplo, yo tengo una “coletilla” (acá en España decimos “coletilla” a una frase que una persona dice mucho): cuando se anuncia las fechas del retiro de la empresa y por ejemplo dicen que será en marzo, yo cada 2/3 semanas siempre pongo en alguna conversación general “is it March yet?” (¿no es aún marzo?). Es una marca de la casa mía que hace gracia a los compañeros, se asocia a mi persona y de alguna manera estoy seguro que provoca una mueca de gracia en mis compañeros. Este tipo de mínimas aportaciones pueden hacer mucho en conectar unos con otros.\n\n*Gracias* *Dani* *,* *Stephi* *y* *Gaspar* *por este post!*\n\n*9punto5 nació en el año 2016 como un esfuerzo por construir* ***la principal conferencia anual sobre trabajo remoto y tecnología de Latinoamérica.*** *Te esperamos en nuestra cuarta versión los días 29, 30 y 31 de agosto. Entérate del programa y los speakers en* *9punto5.cl*\n\n## Written by 9punto5\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;la-historia-de-avengers-aplicada-al-trabajo-remoto-7ded3a113712&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;La historia de Avengers aplicada al trabajo remoto&quot;],&quot;description&quot;:[0,&quot;La cosa es que vi Endgame, la última de Avengers. La película terminó y probablemente todos salimos del cine con los mocos colgando de tanto llorar, pero yo soy especial y salí pensando en toda la…&quot;],&quot;date&quot;:[3,&quot;2019-08-12T18:14:47.705Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/1*MuQ2l5UTEvfblRnSHkfd5Q.gif&quot;],&quot;authors&quot;:[1,[[0,&quot;sandra-cartagena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Avengers&quot;],[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nLa cosa es que vi *Endgame* , la última de Avengers. La película terminó y probablemente todos salimos del cine con los mocos colgando de tanto llorar, pero yo soy especial y salí pensando en toda la saga y la relacioné adivinen a qué… ¡al trabajo remoto! 👨🏼‍💻🌏\n\nCONTEXTO: Un par de semanas atrás, estando en una reunión de coordinación con el equipo de 9punto5, me empezó a cuadrar más la película cuando se dijo la siguiente frase: **“Los talentos están normalmente distribuidos, los accesos no”** . Podrán ver mi cara tipo:\n![Medium-Image ](/blog/images/posts/1_6oTFTWsh_9b7KTqM-IGYfA.webp)\n&lt;figcaption style=\&quot;margin-top: -25px\&quot;&gt;los talentos están normalmente distribuidos, los accesos no…&lt;/figcaption&gt;\n\n![Medium-Image](/blog/images/posts/1_b3_qsLawwSkEYJUbesH8kQ.webp)\n&lt;figcaption style=\&quot;margin-top: -25px\&quot;&gt;\&quot;Aquí Gaspar explicándonos la frase incluyendo historia, capitalismo, Marx, Stanford y otras palabras que no recuerdo.\&quot;&lt;/figcaption&gt;\n\nFinalmente pude comprender y ahí fue donde aparecieron los Avengers en mi cabeza.\n\n![Medium-Image](/blog/images/posts/1*MuQ2l5UTEvfblRnSHkfd5Q.gif)\n\n¿Se acuerdan de la primera entrega de Los Vengadores? La historia de cómo, después de que Loki se robara el Teseracto y quisiera usarlo para dominar al planeta, un hombre llamado Nick reúne a distintos *talentos* incluidos*:* un científico **yanki**  con problemas de manejo de ira, una espía **rusa**  con habilidades en las artes marciales y las armas, un dios **nórdico** , un soldado norteamericano del pasado, un científico y EMPRESARIO multimillonario, un médico británico entregado a las artes místicas, y bueno, para qué voy a seguir. Ustedes ya van captando la idea: **el talento**  de estos superhéroes **está normalmente distribuido** . Podemos encontrar en todo el(los) mundo(s) a personas(seres) con habilidades extraordinarias, que probablemente estén buscando un cambio en sus actividades para poder servir a un bien mayor desarrollando estas habilidades en conjunto. Aquí el reclutamiento viene por parte de Nick Fury. Este compadre también sentía que podía hacer algo más importante con su pega de oficina en S.H.I.E.L.D. Entonces ¿qué hace? Bueno, los empieza a ubicar y los intenta convencer toda la película para que se unan a esta empresa remota llamada Iniciativa Avengers. Lo consigue, por suerte.\n![Medium-Image](/blog/images/posts/1_4fAFDYApa2fvkpTPLNc8LA.gif)\n&lt;figcaption style=\&quot;margin-top: -25px\&quot;&gt;“Y la pobre Nueva York siempre termina hecha pebre :(”&lt;/figcaption&gt;\n\nEn las películas que siguen podemos ver cómo se unen otros talentos a esta empresa. Incluso algunos que intentan boicotearla pero terminan por unirse, como la chiquilla bruja que se pone chinita cuando hace sus magias (directamente desde Rumania)\n![Medium-Image](/blog/images/posts/1_pJUG3MdY6ICoLI__Mv52Xg.gif)\n\nLa cosa es que esta organización tan cachilupi se ve amenazada por un enemigo que está toda la película echándoles el ojo y tratando de volver las cosas (o “el caos”, como le llama) a la normalidad. Thanos vendría siendo algo así como el trabajo tradicional, como lo conocemos hasta ahora. Un ente poderoso que vemos durante toda la saga tratando de recolectar “las gemas del infinito” para restablecer este orden que él cree perdido. El gallo es súper *oldschool*  y piensa que el chacoteo tiene que terminar y la mejor manera de hacerlo es eliminar a la mitad del planeta Tierra, probablemente porque estemos puro sacando la vuelta, quién sabe. Yo creo que es eso. Thanos necesita restablecer el “orden” haciendo desaparecer la idea de emprendimiento, pues considera que trabajar independiente es sinónimo de caos debido a todo lo que conlleva ser tu propio jefe.\n\n![Medium-Image](/blog/images/posts/1_fDFg6SO3PVHMRTqt6ck_Ow.webp)\n&lt;figcaption style=\&quot;margin-top: -25px\&quot;&gt;Thanos con su guante importado directamente desde Aliexpress\n&lt;/figcaption&gt;\n\nAntes de seguir, les explico el significado que le di a las gemas del infinito:\n\n**Gema del tiempo:**  pucha, es el tiempo. Súper simple, pero súper complicado a la vez. Nos cuesta caleta organizarlo y cuando estamos trabajando en una pega tradicional solemos desperdiciarlo, sobretodo cuando esa pega no cumple nuestras expectativas y la hacemos solo por el beneficio económico que nos reporta. La Gema del Tiempo tiene relación con la cantidad de horas que deberíamos dedicarle a un trabajo tradicional independiente de si trabajamos realmente o no. Lo que Thanos necesita de alguna manera es “esclavizarnos” y controlarnos, perdiendo nosotros toda capacidad de autonomía y de planificación para llevar a cabo nuestras tareas.\n\n**La gema de la realidad:**  la sociedad nos inculca a través de los medios de comunicación que nuestra realidad obedece a una serie de eventos que deben tomar lugar en nuestra vida como por ejemplo: consumir, endeudarnos y vivir el éxito a través de un sueldo alto. Todo eso a cambio de nuestro Tiempo, nuestro activo más valioso. ¿Qué pasa con esto? Es una triste ILUSIÓN. Estamos atrapados en esta realidad porque no conocemos otra y, de alguna manera, encontramos comfort en ella. ¿Otra realidad o aceptar la idea de que las cosas podrían ser diferentes? Ah no, qué miedo.\n\n**La gema del alma:**  a raíz del tiempo que pasamos en nuestros trabajos tradicionales pendientes de ganar más dinero y de competir con el del lado, nos olvidamos de cultivar habilidades blandas que, de ser correctamente trabajadas, incluso nos llevarían a aumentar nuestras capacidades para el bien de nuestro proceso evolutivo como profesionales y como personas. (OMMM 🧘🏻‍♀️)\n\n**La gema de la mente:**  en el mundo de los trabajos tradicionales, cultivar nuestra mente a través de conocimientos adquiridos en instituciones pesa mucho más que cultivar nuestras habilidades blandas, por lo que no nos interesa o dejamos de lado ese ítem para enfocarnos exclusivamente en cómo ser mejor que mi competencia. Fome po :(\n\n**La gema del poder:** El fin justifica los medios, llegar a la cima del poder es para algunos un objetivo que no conoce escrúpulos, donde no hay cabida para la compasión, ni para el trabajo en equipo. Y no tengo que decirles que el trabajo en equipo es fundamental en el trabajo remoto.\n\n**La gema del espacio:** en las grandes ciudades nos cuesta muchísimo tiempo movilizarnos para llegar a nuestro trabajo tradicional por lo tanto vemos en la modalidad del trabajo remoto una solución y no un problema. Esta gema nos permite trabajar desde cualquier lugar del mundo, pero debe ser usada con la gema del internet, pues si no, imposible comunicarse.\n\n# ¿QUÉ NOS QUIERE DECIR LA SAGA AVENGERS?\n\nO qué les quiero decir yo en toda mi volá:\n![Medium-Image](/blog/images/posts/1_NTvA3O0B-2SESIPElHTtiw.webp)\n&lt;figcaption style=\&quot;margin-top: -25px\&quot;&gt;Gemas, gemas everywhere…&lt;/figcaption&gt;\n\nCuida tus gemas. Desarrolla tus habilidades donde tú quieras haciendo lo que te gusta. Busca las opciones que te sean más cómodas para hacerlo, porque el talento **está** . Y aquí es donde vuelvo a 9punto5. Instancias como las que ofrece la conferencia (que ya cumple su cuarto año de vida) nos acercan la posibilidad de conocer nuevas tendencias en cuanto al trabajo, a su futuro, nos ayudan a tener una mejor visión de hacia dónde va la micro y qué podemos hacer nosotros, con las gemas que tenemos en nuestro guante, para enfrentar los cambios que está experimentando la industria. Y tomo la segunda parte de la frase con la que comencé esta historia: *los accesos no están normalmente distribuidos* . Los Avengers tuvieron suerte, porque Nick Fury venía de un lugar con las lucas suficientes como para rastrearlos por el mundo. Pero no me bajen los brazos, porque la presencia de empresas como Evernote, @Amazon y otros gigantes que han venido o vendrán a nuestro país a reclutar talento es cada vez más común y 9.5 es uno de los lugares donde se puede acceder a ese contacto.\n\nPorque la cosa no es que una modalidad sea mejor que la otra, **es que tú tengas la capacidad para decidir y para crecer haciendo lo que amas.** Lamentablemente, al cierre de esta publicación, nadie ha podido controlar la gema del tiempo, así que ¡despierta! que todo puede terminar con un chasquido de dedos.\n\n*9punto5* *desarrollará su cuarta versión este 29, 30 y 31 de agosto en Valdivia, región de Los Ríos, y puedes adquirir un ticket o encontrar más info sobre expositores en* *9punto5.cl*&quot;]}],[0,{&quot;slug&quot;:[0,&quot;la-nueva-era-del-trabajo-50a57302c244&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;La nueva era del trabajo&quot;],&quot;description&quot;:[0,&quot;Explora la nueva era del trabajo remoto y la inteligencia artificial. Descubre cómo está transformando el empleo y las repercusiones globales en nuestra última publicación&quot;],&quot;date&quot;:[3,&quot;2017-03-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/new-work-era.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nHemos hablado en múltiples oportunidades sobre las bondades del trabajo remoto y cómo los profesionales y las empresas optimizan tiempo y espacio en función de una modalidad amigable, que permite compatibilizar sin problema vida personal y laboral.\n\nPero cada vez que hablamos de este tema, tendemos a situarnos en un nicho acotado, un espacio que comprende nuestra propia realidad regional o nacional.\n\nIncluso si hacemos el ejercicio de compararnos con otras latitudes, no vemos este fenómeno como la tendencia mundial que es y las repercusiones que su instauración masiva y definitiva está teniendo en el planeta.\n\nSegún el estudio de [“El Trabajador Digital”](http://www.trendtic.cl/2017/03/49-de-los-chilenos-dejaria-su-trabajo-actual-para-trabajar-de-forma-remota/) realizado por Citrix, **49% de los encuestados estaría dispuesto a cambiar de trabajo**, incluso si otro lugar le pagase menos, pero le permitiese trabajar a distancia.\n\nTambién el 46% asegura que le gustaría trabajar por metas y no por horarios fijos. Por otra parte, la demanda de movilidad de los trabajadores actualmente en Chile está obligando a varias empresas a modificar sus tecnologías y flexibilizar sus normas para una mayor productividad y seguridad de los trabajadores.\n\n¿Pero qué sucede en el resto del mundo?\n\nEn Estados Unidos las cifras no sólo arrojan luces sobre el trabajo remoto, sino también sobre el reemplazo de los trabajadores por unidades de inteligencia artificial que realizarían las funciones de, por ejemplo, camioneros y empleados públicos. [Para el 2021, en Norteamérica se espera que los robots reemplacen al menos un 6% de las actuales plazas laborales ocupadas actualmente por humanos](https://blog.9punto5.cl/la-nueva-era-del-trabajo-50a57302c244).\n\nY leyendo el párrafo anterior me asalta otra pregunta:\n\n¿Qué estamos haciendo actualmente con los “robots humanos” que ocupan cargos en instituciones públicas y privadas en Chile?\n\n¿Quién se preocupa por ellos y les hace mantenimiento?\n\nClaro, porque la comprensión empática y la toma correcta de decisiones es actualmente un bien escaso si analizamos los diferentes climas laborales en empresas y organismos donde se cumple un horario fijo de manera presencial.\n\nEl estudio realizado en Estados Unidos es lapidario: los robots son más simples, son más eficientes en la resolución frente a escenarios complejos lo cual los haría más eficiente.\n\nUn robot no es infeliz, no se enoja, no se enferma y le da lo mismo trabajar en algo que no lo motiva verdaderamente ¿duro no?\n\nEl ámbito del transporte, la atención al cliente, la logística y muchos otros campos comenzarán a integrar la inteligencia artificial en reemplazo de la mano de obra humana. Empresas como Uber, Google y Tesla ya están trabajando en tecnologías que permitan funcionar sin choferes, ahorrando millones de dólares en costos de honorarios.\n\n¿Pero qué sucede con el 6% que quedará eventualmente desempleado?\n\nEsta cifra es enorme si la trasladamos a una economía como la de Estados Unidos y es sólo el comienzo. Si bien estas personas pueden ser reubicadas en otros puestos de trabajo, por ejemplo, controlando a los robots, la inversión también será grande en términos de capacitación.\n\nSin duda el escenario social se verá seriamente afectado si aumenta el desempleo, ya que hay una clara relación entre el aumento del consumo de drogas y el alza en la tasa de criminalidad si la desocupación experimenta un crecimiento.\n\nEntonces, si por un lado los humanos estamos dirigiendo nuestro camino cada vez más hacia el modalidades de trabajo flexible y por otro, la industria reemplaza los costos de mantener personas en cargos de diversa índole por unidades de inteligencia artificial eficientes y económicas, podríamos observar en los próximos años mayor reticencia por parte de los trabajadores a abandonar las oficinas por temor a ser desplazado por una máquina.\n\nPor ello, tanto las empresas como los trabajadores deben entender que nunca una máquina va a reemplazar en un 100% a una persona, tal vez si en una función específica o un trabajo de precisión, pero estas siempre debe ser supervisadas.\n\nDe igual forma, la pérdida de las relaciones humanas en todo orden conduce al fracaso de cualquier interacción (social, afectiva o comercial) que quiera llevarse a cabo. Entonces, no hablemos de extremos sino de matices a la hora de planificar el futuro en colaboración incorporando las funciones humanas y la tecnología, sin olvidar que personas felices trabajan mejor que máquinas bien aceitadas.\n\n––\n\n&gt; 9punto5 es un proyecto que no sólo promueve el trabajo remoto como una forma de desarrollo para la región y el país. También se preocupa por el futuro de esta tendencia que ha llegado para quedarse, procurando entregar consejos y velar por mejores condiciones en este ámbito para todos los trabajadores que apuestan por modernizarse.\n\nEstamos organizado un workshop para saber de esto, y más. El 7 y 8 de Abril en Valdivia. 25 cupos.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;las-promesas-de-un-aeropuerto-24ee1ea2c4e9&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Las promesas de un aeropuerto&quot;],&quot;description&quot;:[0,&quot;En el año 2010 me fui a vivir a Santiago desde Valdivia, a trabajar, y comenzar con uno de mis emprendimientos. Desde ese momento, comencé a notar la falta de vuelos y gran mediocridad del servicio…&quot;],&quot;date&quot;:[3,&quot;2019-07-30T17:01:01.450Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/1_wCoWChKww2ymukt11tjUhQ.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Aeropuerto&quot;],[0,&quot;Valdivia&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nEn el año 2010 me fui a vivir a Santiago desde Valdivia, a trabajar, y comenzar con uno de mis emprendimientos. Desde ese momento, comencé a notar la falta de vuelos y gran mediocridad del servicio que ofrece el aeropuerto Pichoy.\n\nTambién desde esa fecha me he enterado de todos los planes por hacer de Valdivia una ciudad centro y destacada por algún área: “Ciudad Universitaria”, “Ciudad de la Ciencia”, “Capital Americana de la Cultura”, entre varias otras iniciativas.\n\n*9punto5* , usando Valdivia como ciudad símbolo para el “trabajo remoto”, está también dentro de esta lista.\n\nTraigo al frente estos sucesos, porque siempre que se piensa en ser la cuna de algo, Valdivia se encuentra tremendamente bloqueada por sus distintos accesos. Mientras se espera la habilitación de la doble vía de entrada por la vía terrestre, el aeropuerto y su frecuencia de vuelos se queda corto para la expectativa que tenemos como ciudad.\n\nMás aún, no solo *9punto5*  demanda más frecuencia. En los últimos 10 años, el turismo en Valdivia ha ido cada año en aumento. Inclusive, la región tiene distintos lugares donde se esparcen los visitantes, para recorrer lagos, ríos y montañas verdes.\n\nEl año 2012, ya veía que emprendedores que tenían clientes en Santiago, no podían crear viajes “rápidos” a esa ciudad. Tenían que quedarse una noche, o simplemente hacer maravillas en un día de 3 horas. **Esos mismos problemas se mantienen hasta el año 2019 y Valdivia, pese a que existen otros distintos factores involucrados, no se concreta como una ciudad donde prosperen las empresas locales.**\n\nHace unas pocas semanas, [se anunció](https://www.gob.cl/noticias/presidente-pinera-presento-el-plan-de-modernizacion-de-aeropuertos-esta-red-va-tener-la-capacidad-de-integrar-nuestro-pais/) de parte del Presidente Piñera una mejora múltiple en los aeropuertos en Chile, donde Pichoy pasará de ser un aeródromo a ser un aeropuerto. Esto permitirá eventualmente, el año 2021, la recepción de vuelos internacionales.\n\n¿Es ésta una de las soluciones al problema que tiene Valdivia de conexión? Depende desde qué contexto se vea.\n\nSin duda, los turistas podrán tener conexiones más rápidas y económicas. Hoteles y hostales podrán beneficiarse de mayor afluencia. Valdivia será destacado por tener un aeropuerto internacional, y esta modificación de estatus se verá como una justificación para calmar los ánimos respecto a esta situación.\n\n*9punto5*  y yo me pregunto: Este anuncio, ¿será algo que aumente y vea florecer los negocios locales?\n\nEs probable que no. Las líneas áreas no ven el potencial de Valdivia para aumentar la frecuencia de vuelos. Peor aún, son descansos de otros vuelos. Sky Airlines solo aumenta el número de vuelos por estación, y los vuelos en la tarde son demasiado temprano aún (en Valdivia o Santiago) para poder decir que es un día de negocios bien aprovechado.\n\nViendo ahora la evolución que han tenido los trabajos, la mejor internet de Latinoamérica situada en Valdivia, y la evolución en la forma de comunicarnos y cerrar negocios, acaso:\n\n**¿Podemos mejorar este aeropuerto y ciudad olvidados, cuando los cambios en la tecnología, los trabajos y la economía son inevitables?**\n\n**¿Es ya muy tarde para agregar más vuelos, situar un aeropuerto internacional y prometer mejores estándares para esta industria?**\n\nQuizás sí. Para un trabajador o empleado global, Santiago es solo una de las tantas partes donde puede hacer negocios. Ya no tiene que viajar a Munich, Ciudad de México o Brasilia para cerrar un negocio.\n\nTodo esto es posible de distintas formas, que espero podamos descubrir entre todos en otra versión más de *9punto5* . No es un trabajo fácil ni que tome poco tiempo, pero lamentablemente, ya no requerimos de un aeropuerto para poder concretarlo.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;lista-escribir-async&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Cómo escribir para que tu equipo te lea&quot;],&quot;description&quot;:[0,&quot;Aprende a escribir de forma clara y efectiva para mejorar la comunicación asíncrona en tu equipo&quot;],&quot;date&quot;:[3,&quot;2023-02-16T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/escribir-1.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Escribir&quot;],[0,&quot;Comunicación&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;La comunicación es clave en los equipos, es lo que habilita o entorpece la colaboración. Pero en contextos de trabajo asíncrono, es aún más importante aprender a escribir de forma sencilla, clara y efectiva.\n\nEn la última edición de \&quot;[The Async Newsletter](https://async.twist.com/)\&quot; hay una excelente [guía de cómo escribir de forma profesional](https://async.twist.com/writing-at-work/). Te invito a revisarla y te comparto un resumen de sus principales puntos.\n\nAprender a escribir bien toma tiempo y práctica. Aunque no hay fórmulas mágicas, esta lista te ayudará a tener en cuenta las claves de una buena escritura.\n\n## Ten en mente lo que quieres como resultado\n- Empieza con **qué quieres que pase** como resultado de lo que escribes. Tenlo en mente para decidir qué incluir y (muy importante) qué omitir\n- Pregúntate cosas como ¿Qué problema quiero resolver? ¿Qué podría salir mal? ¿Cómo sería un resultado exitoso de esta comunicación?\n- Considera la necesidad de tu audiencia\n\n## Lo importante al inicio\n- Presenta **la información clave al principio**\n- Di lo que la otra persona necesita saber en las primeras tres frases\n- Asegúrate de que el mensaje sea claro y simple\n\n## Una solicitud clara\n- **Si estás pidiendo algo déjalo claro**, destacado y en una sola línea\n- Si es una tarea, haz que resulte obvia\n- Da el contexto e información necesaria, incluyendo fechas y enlaces a documentación\n- Evita hacer una lista de peticiones, haz solo una llamada a la acción\n\n## Decir menos\n- Repasa lo que escribiste y **elimina todo lo que sea innecesario**. Si puedes quitar un 20% de tu primera versión hazlo.\n- Si algo no es esencial, déjalo como un enlace o información adicional\n\n## Haz que sea fácil de escanear\n- Dale **jerarquía clara** a la información\n- Estructura y dale formato al texto\n- Usa títulos y subtítulos\n- Usa viñetas y listas\n- **Usa negrita**\n- Cuando pongas un enlace no pongas \&quot;click aquí”, escribe un enlace de forma descriptiva\n\n## Usa fragmentos\n- Desglosa grandes bloques en **fragmentos pequeños y fáciles de digerir**\n- El punto principal va en el primer párrafo\n\n## Usa un lenguaje sencillo\n- Usa lenguaje y frases sencillas\n- No abuses de metáforas, ni de los adjetivos. Tampoco de la jerga, las siglas y las frases o palabras inventadas\n- Usa la voz activa para dejar claro quién está tomando la acción\n\nVoz Activa: “Neil Armstrong caminó en la luna”\nVoz Pasiva: “La luna fue caminada por Neil Armstrong\&quot;\n\n## Apóyate en lo visual\n- Combina lo verbal con lo visual al mismo instante para reducir complejidad\n- Usa herramientas como Loom o CleanShot para grabarte mostrando la pantalla, para dar instrucciones paso a paso, o para, por ejemplo, dar feedback de algo específico en un diseño\n- Usa una captura de pantalla seguida de un texto\n\n## Mora tu escritura constantemente\n- Pide feedback sobre el tono y claridad de tu escritura\n- Cuando no lo hagas bien del todo, prueba algo nuevo\n\nSi te interesa aprender más sobre el trabajo remoto y la comunicación asíncrona te recomiendo este newsletter de Doist los creadores de Todoist y Twist.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;lo-mc3a1s-difc3adcil-de-trabajar-de-manera-remota-57b65f83b374&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Lo más difícil de trabajar de manera remota&quot;],&quot;description&quot;:[0,&quot;Trabajar remoto no tiene que ser sinónonimo de procrastinación y distracciones&quot;],&quot;date&quot;:[3,&quot;2017-01-31T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/working-remotely-difficulty.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nSon las 4pm y afuera hay 34º. Pienso en la gente que ha salido a la playa sin importar que hoy sea día de semana y en aquellos que están tomando cerveza debajo de un árbol, pero hoy no es mi caso.\n\nMi casa es fresca y en días así agradezco no estar encerrada en una oficina. Reviso mi correo y luego Basecamp, tengo algunas tareas pendientes y me pongo manos a la obra, pero antes reviso qué tiene de nuevo Facebook.\n\nLuego de ver 5 videos de gatos en Youtube, retomo el trabajo pero ya son pasadas las 5pm y tengo hambre, así que voy a la cocina, converso con mi perra que me pide un trozo de plátano y vuelvo a sentarme frente al computador. En el intertanto he recibido 4 correos más solicitando cosas y el trabajo se acumula. Pienso que terminaré a las 11 de la noche y podré ir por esa cerveza que anhelé a las 4pm.\n\nLogro hacer la mitad de las cosas y me duermo con la sensación de que no ha sido un día productivo. Esto no me pasa todo el tiempo y es verdad que la gente que trabaja con horario fijo en trabajos convencionales también “saca la vuelta” igual o peor que uno, pero si hay algo que nos aplasta es precisamente permitir que esto ocurra de manera frecuente.\n\nEs usual leer posts de personas exitosas que hablan maravillas sobre ser independientes y poder controlar tus tiempos, pero también hay que contar el lado B, lo que ocurre cuando no somos tan buenos ciudadanos y “nos hacemos trampita” al ser nuestros propios jefes. Por eso, he preparado un listado de 5 puntos que creo importante considerar a la hora de querer neutralizar al enemigo número uno del trabajo remoto: uno mismo.\n\n## 1.- Uno mismo y la procrastinación\n\nEn el video que está al inicio del post el artista norteamericano Lev Yilmaz ha retratado de manera genial lo que hacemos cuando no hacemos nada y creemos que estamos haciendo cosas en el capítulo _“Procrastination”_ de la serie animada _Tales of Mere Existence_. \n\nEn este breve video de Youtube podrán reconocer uno o varios comportamientos del típico trabajador remoto en un día de pocas ganas o baja concentración —eso sí en caso de estar trabajando les advierto, no ver el video que sigue y los que vengan después de ese.\n\n&lt;Youtube client:load id=\&quot;4P785j15Tzk\&quot; title=\&quot;Youtube Video Test Title\&quot;/&gt;\n\n\n## 2.- Hijos / Familia / Amigos\n\nCuando trabajamos en casa o no tenemos un horario fijo nuestros círculos cercanos creen que no hacemos nada, que nuestro trabajo no es de verdad, que no tenemos responsabilidades o que podemos postergar todo con tal de ir al supermercado, un bautizo o una actividad escolar. Y es cierto que podemos flexibilizar nuestra agenda y hacer cuadrar prácticamente todo. Finalmente, un trabajador remoto es también un “ingeniero del tiempo” (¿no todos deberíamos serlo?), pero el plano afectivo debe estar controlado con el fin de no postergar una buena oportunidad de avanzar en nuestros proyectos.\n\nConsejo 💡: Detecta la hora del día en que te concentras mejor y trata de reservarla siempre para trabajar, así podrás dedicarle tiempo a quienes más quieres durante el resto del día. “La vida es lo que ocurre cuando estás preocupado planeando el futuro” es una frase que nos debería motivar a hacer las cosas de manera eficiente, pero también es algo que acabo de leer en Facebook cuando estaba eludiendo continuar con este post.\n\n## 3.- Gente que trabaja de manera “normal”\n\nConectando con el punto anterior, uno de los _incoming enemies_ más frecuentes son aquellos detractores del trabajo remoto, una raza de hombres y mujeres de traje dos piezas y corbata que nos apuntan con sus dedos corporativos como si fuéramos vagabundos.\n\nMuchas veces las personas que no entienden que por el hecho de no tener un contrato con una empresa grande, no tener tarjetas de presentación ni oficina, no somos dignos de una reunión o de la confianza de realizar un trabajo para ellos. Pero, ¿qué podemos hacer? ¿Enojarnos? ¿Ver tutoriales de vudú y hacerles muñecos mientras procrastinamos?\n\nNuestra misión con estas personas es una sola: demostrar que somos igual de profesionales, entregar los trabajos a tiempo, realizar una buena post venta si el caso lo amerita y fidelizarlos como clientes. Si ellos viven una buena experiencia con nosotros, les garantizo que volverán a requerir de nuestros servicios. Recuerden que la misión del trabajador remoto en los tiempos que corren es de “evangelizar” y contarle al mundo que los jeans y las zapatillas son también un símbolo de formalidad y eficiencia.\n\n## 4.- Redes sociales\n\nMientras leen este post ¿cuántas redes sociales tienen activas? ¿Facebook, Twitter, Instagram? Sin olvidar que WhatsApp TAMBIÉN ES UNA RED SOCIAL que nos quita mucho tiempo cuando nuestra mirada se desvía al ícono que nos dice que tenemos 25 mensajes sin leer en el grupo de ex-compañeros de curso.\n\nMi consejo 💡: desactiva las notificaciones y cuando estés trabajando no revises el inicio de nada. Piensa que lo realmente urgente va a llegar por mail, teléfono o es muy probable que tengas a alguien gritando en la puerta de tu casa si no terminas a tiempo lo que te comprometiste a hacer.\n\n## 5.- Gente que trabaja contigo\n\nIncluso dentro de tu mismo equipo de trabajo puedes encontrar algunos escollos para realizar tus actividades de manera ordenada. Tus compañeros de trabajo pueden distraerte con dudas, pidiéndote ayuda, enviándote memes muy divertidos o invitándote a tomar cerveza antes de terminar lo que tienes que hacer.\n\nPor otra parte, algunos jefes no entienden que los fines de semana, las 2 am (a no ser que vivas en Australia) y los feriados no son momentos laborales. Esto puede hacer que tus ganas de ser eficiente se esfumen y que comiences a sacar la vuelta con mayor frecuencia.\n\nPor eso mi consejo en este sentido es 💡: estipula desde un principio la modalidad de trabajo con tus jefes, clientes y compañeros de trabajo. De esta forma, será todo más fácil.\n\n“9punto5” es el mayor encuentro de trabajo remoto de Latinoamérica que busca posicionar esta modalidad de trabajo en la Región de Los Ríos y Chile como una herramienta para crecer de manera inteligente. Te hablamos con la verdad, porque sabemos que tú también muchas veces no tienes ganas de hacer nada y la productividad se mide no solo por números e indicadores, sino por motivación, aprendizaje y autocuidado. ¿Más verdades? Inscríbete acá.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;mi-propio-c3a9xito-de-9punto5&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Mi propio éxito de 9punto5&quot;],&quot;description&quot;:[0,&quot;Fran se inspiró en esta reflexión sobre el impacto de 9punto5 y la tarea de construir desde Valdivia la conferencia líder en trabajo remoto en Latinoamérica&quot;],&quot;date&quot;:[3,&quot;2019-04-23T18:25:29.402Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/0_P4yXT-AATj04ASxS.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fran-daforno&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;9punto5&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&gt;En 9punto5 estamos buscando heroínas y héroes para la conferencia\n\n9punto5 aún no se acaba, sigo con muchos to dos en mi cabeza para los días que vienen.\n\nActualmente cuando sales del colegio nadie te pregunta ¿qué quieres ser? Más bien la duda es ¿qué vas a estudiar? Porque estamos acostumbrados a asumir que se debe seguir estudiando en instituciones tradicionales, tener un título profesional y trabajar el resto de tu vida.\n\nMi historia es la misma. Mi diferencia -creo- sea basa en las respuestas a mis propias preguntas, ¿estoy feliz con lo que hago? ¿siento que aporto a la sociedad?\n\nHoy estoy feliz de trabajar en Uprise, una empresa que yo denomino “del futuro”, porque puedo administrar mis tiempos, teletrabajar, con una estructura horizontal, la oficina está en NubeCowork, tengo buenos beneficios como poder comprarme un libro al mes o tomar un curso, tener snack saludable, 2 días administrativos al año, día libre de cumpleaños y mucho +. Pero no estaba segura del impacto de mi desarrollo profesional en el mundo y hoy, después de una semana intensísima de la segunda versión de 9punto5, creo que tengo una respuesta positiva a mi pregunta :)\n\n9punto5 es un sueño, un evento -a partir de una conversación tranquila- que queremos posicionar como la principal conferencia de trabajo remoto en Latinoamérica desde Valdivia, una ciudad maravillosa en el fin del mundo. Y creo este es el mayor aporte que hago en la sociedad el día de hoy. Siento que trajimos a Valdivia la oportunidad de abrir la mente de cientos de personas, mostrarles nuevas realidades -un presente de pocos y el futuro de muchos-, plantar dudas y ganas de aprender temas nuevos y lo más importante mostrar una manera de vivir de forma equilibrada.\n\n![Medium-Image](/blog/images/posts/1_6GvZ8vcuPxgDr19oxo2qJw.webp)\n\nProducir un evento anual de gran nivel con un equipo de 4 personas es altamente desafiante, sobretodo para mi con una personalidad autoexigente y detallista, con poca experiencia en este tipo de producción y sin los ánimos de imponer mi visión y pasar a llevar gente en el camino. Me involucro desde apoyar la redacción de la postulación y cuando la ganamos 🎉: comenzar a seleccionar el hotel, buscar expositores y auspicios, muchísimos emails que van y vienen, reuniones con y sin sentido, hacer el programa, pedir información, coordinar el staff, preocuparse de la cerveza, transfers, comprar pasajes de avión y bus, ver los coffees, gestionar las gráficas e imprimirlas, apagar incendios, coordinar vestir la ciudad, y así.. suma y siguen muchas más tareas.\n\n![Medium-Image](/blog/images/posts/0_P4yXT-AATj04ASxS.webp)\n\nHoy estoy cansada pero feliz! Y mi post tiene dos objetivos:\n\n1. Principalmente agradecer a todos quienes asistieron al evento. Porque un evento es exitoso cuando todo resultó bien, no sólo porque como staff lo sacamos adelante, también porque hubo expositores que creyeron, auspiciadores que se pusieron, medios que nos cubrieron y sobretodo asistentes que nos validan con su preferencia y asistencia. Gracias porque además de venir y estar presentes, lo hacen con una muy buena disposición y mucha buena onda!\n2. Reflexionar… y es bacán sentir que se pueden hacer grandes cosas, que te hacen feliz y al mismo tiempo contribuyes, y seguramente sino me diera el tiempo de escribirlo ni lo reflexionaría… y lo apreciaría menos.\n\nCuando las cosas se hacen de forma profesional, dando lo mejor de uno y haciéndolo con el ❤️ resultan bien, así es como levantamos 9punto5.\n\n**Nos vemos el otro año!**&quot;]}],[0,{&quot;slug&quot;:[0,&quot;nicho&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Nicho: Qué es, qué tamaño debería tener, cómo identificarlo y monetizarlo&quot;],&quot;description&quot;:[0,&quot;Claves para identificar y monetizar un nicho con estrategias prácticas: alcance limitado, alto engagement y claridad de objetivos&quot;],&quot;date&quot;:[3,&quot;2023-03-22T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/nicho.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Negocios&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Nicho&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n- Hoy le pondremos números a lo que es un nicho y revisaremos ideas para determinar **el tamaño de un nicho**.\n- Hablaremos del **engagement**, qué es y con qué señales puedes buscarlo.\n- Revisaremos una lista de **7 elementos que componen un nicho**, y por qué deberías querer revisarlos regularmente.\n- Miraremos cómo buscar **la intersección entre lo que haces bien, tus intereses y las necesidades del grupo al que apuntas**.\n- Si estás pensando monetizar un nicho **te propongo un ejercicio para pensar el precio de producto**.\n\nAhora vamos con cada punto.\n\nCuando haces algo para un nicho —y si lo haces bien— deberías estar en el cuadrante de alcance limitado y alto engagement.\n\nDescribamos cada eje.\n\n## Alcance\n¡Atención con esto! **Para hacerlo bien en un nicho necesitas solo un alcance limitado**. Más que cantidad, necesitas llegar y que te encuentren las personas correctas.\n\nSobre todo al inicio, me tenía que recordar que estaba completamente bien que mi post sobre liderazgo para el trabajo remoto tuviera menos alcance que las últimas estupideces de Elon Musk.\n\nEso pasa cuando estás en un nicho. Tener un alcance limitado, con mira laser, puede ser una seña de que, en realidad, lo estás haciendo bien.\n\nOk, pero ¿Qué significa alcance limitado?. Para responder a esa pregunta nos sirve hacer el ejercicio de cómo sería monetizar un nicho. Aun cuando no todas las personas que apuntan a un nicho quieren hacer dinero con eso y lo que hacen podría ser simplemente por hobby (o comenzar así).\n\n### ¿Cuántas personas necesito para tener un nicho viable?\n\nImaginemos que quieres monetizar un nicho, y digamos que quieres hacer 50 mil dólares el primer año. Vamos a los números:\n\n\n&lt;Notice type=\&quot;note\&quot;&gt; Tabla 1: Cómo hacer 50 mil dólares vendiendo un producto ![nicho](/blog/images/posts/nicho-2.webp) &lt;/Notice&gt;\n\n&lt;Notice type=\&quot;note\&quot;&gt; Tabla 2: Cómo hacer 50 mil dólares vendiendo vía suscripción mensual ![nicho](/blog/images/posts/nicho-3.webp) &lt;/Notice&gt;\n\n&lt;Notice type=\&quot;note\&quot;&gt; Tabla 3: Qué tasa de conversión necesitas para hacer 50 mil dólares ![nicho](/blog/images/posts/nicho-4.webp) &lt;/Notice&gt;\n\n&gt; 100 personas puede ser todo lo que necesitas para tener un nicho [[Twittear](https://ctt.ac/Ifi37)]\n\nAdemás, tu tasa de conversión puede aumentar en la medida que hagas muy bien tu trabajo de entender y aporta en tu nicho.\n\nLuego puedes crecer en ese mismo nicho o hacia un nicho adyacente. Algo que puedes hacer varias veces. Pero al principio esto es lo menos importante. Al inicio toda tu energía y atención debería estar en encontrar lo que funciona.\n\nPor eso, concentrarte en el número de seguidores, suscriptores, likes o similares es una terrible manera perderse y dejar de mirar y hacer lo importante.\n\n&gt; Veo emprendedores pensando el problema equivocado. \n&gt; - ¿Cómo consigo más seguidores y me gusta? \n&gt; - Con eso venderé más.\n&gt; Esas métricas son buenas para el negocio de la red social, pero no necesariamente para el tuyo.\n&gt; Fuera de las redes sociales, ¿cuál es tu objetivo? Partir por ahí\n\n(@fabianhtml) [February 18, 2023](https://twitter.com/fabianhtml/status/1627037041568657408?ref_src=twsrc%5Etfw)\n\n## Engagement\nEl otro eje que te ayuda a evaluar si estás construyendo un nicho es el nivel de interés, interacción y compromiso que genera tu trabajo.\n\nCuando el engagement es muy bajo, estás viendo un síntoma de que las cosas no están resultando.\n\n&lt;Accordion client:load title=\&quot;Un nicho que funciona genera cosas como estas:\&quot;&gt;\n- Interacciones\n- Conversaciones\n- Personas compartiendo tu trabajo\n- Comentarios\n- Agradecimientos\n- Testimonios\n- Feedback solicitado y no solicitado\n- Correcciones\n- Opiniones\n- Preguntas\n- Solicitudes de ayuda\n- Encuestas y formularios que se completan\n- Personas asistiendo a las actividades que organizas\n- Recibes recomendaciones de cosas que podrían interesarte\n- Personas comprando tu producto o suscripción\n&lt;/Accordion&gt;\n\nNo todo tiene que ser público, a veces las interacciones ocurren en mensajes y correos privados.\n\nEs mala seña cuando no tienes ni alcance ni interacciones, y las cosas tampoco funcionan si tienes mucho alcance, pero nula interacción. Ahí toca ver como moverte y encontrar tu nicho.\n\n![nicho](/blog/images/posts/nicho-5.webp)\n\n\nHablemos entonces de cómo mejorar de forma continua tu labor dentro de un nicho.\n\n## Los siete elementos de un nicho\nSin ser una lista definitiva, estos elementos componen un nicho:\n\n- **Tema** – ¿Sobre qué tema específico vas a hablar y realizar actividades?\n- **Formato** – ¿Cuál será el tu medio principal? (imagen, vídeo, texto, audio)\n- **Idioma** – ¿Qué idiomas usarás? ¿Qué idiomas lee y escucha actualmente tu público? (inglés, español, ambos)\n- **Público** – ¿A quién te diriges específicamente? (trabajadores remotos, madres futbolistas, quienes tienen gato)\n- **Voz** – ¿Cómo vas a hablarles? ¿Con o sin $%&amp;? ¿Con lenguaje sencillo o lenguaje técnico?\n- **Ubicación/plataforma** – ¿Dónde vive tu público? (física y digitalmente)\n- **Frecuencia** – ¿A qué ritmo pasarán las cosas?\n\nLo que he aprendido es que quienes tienen más éxito en un nicho, regular e intencionalmente se cuestionan cómo lo están haciendo en cada punto. Van encontrando su fórmula a través de la experimentación y el “delivery” constante.\n\n&gt; Un caso que ejemplifica bien esto, es uno en el que el profesor Jerry Uelsmann dividió a sus estudiantes de fotografía en dos grupos. Mientras que a uno le pidió tomar la mayor cantidad de fotos posibles, al otro le pidió lo contrario, prepararse para tomar la mejor foto posible. ¿El resultado? La cantidad vence a la calidad; hacer algo muchas veces es la manera de mejorar.\n\nSi el ejemplo anterior destaca la frecuencia, otro punto que me parece muy importante (y a veces muy difícil) es el de caracterizar a tu público. Utiliza herramientas como un buyer personas o construir un arquetipo de persona usuaria.\n\nSi no tienes claro a quién le estás hablando estarás permanentemente jugando al azar.\n\n## Busca la intersección ideal entre tú y tu nicho\n\n![nicho](/blog/images/posts/nicho-6.webp)\n\nRecuerda centrarte en un público con el que te sientas cómodo, con el que te guste interactuar, con el que compartes intereses y al que le puedas hacer aportes significativos.\n\nSobre todo **al inicio enfócate de forma deliberada en un espacio reducido**, para entenderlo y aportar en él de la mejor manera posible.\n\nSupera la incomodidad de llegar a pocas personas y recuerda que en realidad no necesitas tantas como quizá creías antes de leer este post.\n\nPor ejemplo, si organizas una actividad, reunirse en un grupo reducido será incómodo si crees que el éxito está solo en lo masivo.\n\nMe pasó en un proyecto anterior, a mi socio le incomodaba la idea de hacer algo donde llegaran solo 2 o 3 personas. Pero esas instancias **son oro puro si las sabes aprovechar**, porque te permiten hacer preguntas, conversar y escuchar las necesidades que llevaron a las personas a esa actividad.\n\nEsto te da información muy valiosa para **entender mejor dónde tu historia, habilidades e intereses se cruzan** con los gustos y necesidades de tu nicho.\n\n- Abraza las instancias de alta interacción y pocas personas\n- Úsalas para aprender todo lo que puedas\n- Úsalas para sentir cuánto y dónde aportas en el grupo, lo que puede ser una gran cura para el síndrome del impostor\n\n## Pensar en el precio\nSi estás buscando monetizar lo que haces, piensa en un grupo de personas con disponibilidad y capacidad de pago.\n\nHaz este ejercicio:\n1. Mira las tablas 1, 2 y 3\n2. Define cuánto quieres hacer en un año\n3. Piensa en el precio que podría costar tu producto y cuántas personas necesitas para conseguir tu meta\n\n👀 Ojo: **Los ingresos no llegarán todos juntos**. Considera esto para ver cómo proyectar los ingresos en el tiempo.\n\n¡Ahora es tu turno!\n\nEspero que este post te diera una mejor perspectiva de lo que es un nicho y que te permita apreciar mejor el valor de un grupo pequeño. 🔬\n\nSi te gustó y quieres que escriba más sobre este tema envíame un mensaje a @fabianhtml o a mi correo electrónico (que es muy simple de adivinar).\n\n\nEn definitiva, desarrollar un nicho es un ejercicio que requiere tanto estrategia como ejecución.\n\n- Recuerda, **un nicho tiene alcance limitado y alto engagement**, por lo que no necesitas llegar a millones ni cientos de miles de personas para hacerlo bien en un nicho.\n- Conseguir las primeras **100 personas** que estén realmente interesadas en tu trabajo puede ser todo lo que necesitas para comenzar a sostener tus esfuerzos.\n- **Revisa periódicamente los siete elementos que le dan forma a tu nicho** y realiza ajustes regulares para ir aumentando cada vez más el engagement y la calidad de tus productos.\n- Ten claridad de **cuáles son las señales que estás buscando** para saber si vas por buen camino.\n- Busca regularmente el “sweetspot” en que se une **lo que haces bien, tus intereses y las necesidades del grupo** al que quieres ayudar.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;nuestra-primera-conferencia-online-y-un-suec3b1o-cumplido-988091c61d51&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Nuestra primera conferencia online y un sueño cumplido&quot;],&quot;description&quot;:[0,&quot;Estamos en un momento de redescubrir la forma en que nos comunicamos, relacionamos y trabajamos. “9punto5” también se está re-definiendo como negocio y equipo. Desde 2016, cada año hemos realizado…&quot;],&quot;date&quot;:[3,&quot;2020-06-05T20:08:11.042Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/1_TiuEma3n7KsQClDJBHDsOQ.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Basecamp&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nLos tiempos han cambiado y todos hemos sido forzados a trabajar de forma remota.\n\nEstamos en un momento de redescubrir la forma en que nos comunicamos, relacionamos y trabajamos. “9punto5” también se está re-definiendo como negocio y equipo.\n\n## Nuestra primera conferencia 100% online\n\nDesde 2016, cada año hemos realizado una versión presencial de nuestra conferencia en la ciudad de Valdivia, al sur del mundo y ¡ha sido una muy buena experiencia!\n\nEn cada ocasión nos hemos juntado a hablar y compartir en torno a nuevas culturas de trabajo, tecnología y — cómo no- trabajo remoto.\n\nAhora, el COVID-19 ha puesto a millones de personas a trabajar por primera vez en esta modalidad en un contexto forzoso.\n\nCon esto se nos hace difícil pensar en reunir a más de 400 personas en un mismo lugar físico, como ha sido en los años anteriores, por lo que decidimos crear **la primera versión online de 9punto5** .\n![Medium-Image](/blog/images/posts/1_TiuEma3n7KsQClDJBHDsOQ.webp)\n\n## Un sueño cumplido: Basecamp\n\nEmpecé a usar los productos de Basecamp hace 10 años. En ese momento el producto era lo que ahora se llama “Basecamp Classic”.\n\nContinuamente seguía los posts de la empresa, la radicalidad de sus procesos de selección de empleados y modelos de negocio innovadores y que contradecían todo patrón de startup en ese momento.\n\nPara los que no están muy familiarizados con esta empresa:\n- Han implementado y escrito libros sobre **trabajo remoto**  antes que cualquier otra empresa.\n- Innovan con un framework de diseño de producto llamado “Shape Up” que tiene una duración por sprint de 6 semanas.\n- Tienen opiniones radicales sobre metas en una empresa, Sillicon Valley y modelos de negocio en internet. Artículos relevantes para comenzar en su blog son este y este.\n\nCuando comenzamos “9punto5”, siempre hemos tenido el sueño de tener a Jason Fried o DHH a la conferencia. Los hemos contactado “ene” veces y pensándolo desde su punto de vista: Que paja viajar a un país y una ciudad a la cresta del mundo.\n\nPero estamos en el 2020, modo pandemia y todo remoto o con distanciamiento social.\n\n**Para nuestra primera conferencia online, ¡al fin tendremos a Basecamp presente!**\n\nEn la conferencia nos acompañará Ryan Singer, quien es “Head of Product Strategy” en Basecamp. Ha jugado muchos papeles en la compañía a lo largo de los años. En 2003 cuando la compañía era en total solo de 4 personas y todavía se llamaban “37 Signals”, Ryan era diseñador de interfaces de usuario. Más tarde comenzó a liderar proyectos, incluido re-hacer desde cero Basecamp por primera vez en 2012.\n\n## Más de 15 speakers, más de 20 actividades\n\nTendremos más de 15 speakers y más de 20 actividades. De a poco te iremos compartiendo algunos de estos momentos para que puedas prepararte para la conferencia.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;pensamiento-segundo-orden&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Pensamiento de segundo orden para tomar mejores decisiones&quot;],&quot;description&quot;:[0,&quot;Conoce el poder del &#39;pensamiento de segundo orden&#39; para tomar decisiones más inteligentes y considerar las consecuencias a largo plazo de tus acciones&quot;],&quot;date&quot;:[3,&quot;2023-03-16T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/segundo-orden.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Decisiones&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Usar un “pensamiento de segundo orden” o pensar en “las consecuencias de segundo orden” se refiere a realizar un análisis que va más allá de la simple consideración de las consecuencias inmediatas de una acción.\n\nEsta es una herramienta poderosa que permite analizar los problemas en segundo, tercer y enésimo orden. Implica pensar en las consecuencias de las consecuencias, en los efectos que siguen al primer resultado de una acción o decisión. El pensamiento de segundo orden es más difícil, pero permite ver cosas que no son evidentes.\n\nWarren Buffett habló de “problemas de segundo orden” y utilizó este ejemplo hablando de un desfile:\n\n&gt; Cuándo unos pocos deciden ponerse de puntillas, todo el mundo tiene que hacerlo. Finalmente, nadie puede ver mejor, pero todos están peor.\n\nActuar solo utilizando el pensamiento de primer orden (lo que voy a obtener de inmediato) es lo que quizá te ha hecho amanecer con resaca y decir: «nunca más». 🥴\n\nEl pensamiento de primer orden, es **fácil y rápido**. Pasa cuando solo consideras las consecuencias inmediatas y cuando te enfocas en los beneficios directos.\n\nEl pensamiento de segundo orden es más **deliberado** e implica considerar las interacciones y consecuencias a largo plazo. Este pensamiento aparece como respuesta a la pregunta «¿Y luego qué?».\n\nOcurre cuando piensas, por ejemplo, en las consecuencias a largo plazo de alimentarte repetidamente con comida chatarra o muy procesada. Si piensas así, es más probable que elijas comer algo sano.\n\n## Para mejorar tu capacidad de tomar decisiones:\n1. Pregúntate “¿Y luego qué?”\n2. Piensa a través del tiempo. ¿Qué consecuencias tendrá esto en 10 minutos, 10 horas, 10 meses, 10 años?\n3. Toma una hoja y divídela en tres columnas. Anota en la primera columna las consecuencias inmediatas, positivas y negativas. En la siguiente columna, anota las consecuencias de segundo orden y en la tercera, las consecuencias de tercer orden.\n\nSi se trata de decisiones en tu empresa, piensa en cómo reaccionarán los trabajadores, los clientes, los competidores, los proveedores y otras partes relevantes para tu negocio.\n\nAl pensar de esta manera, tus decisiones resistirán mejor el paso del tiempo.\n\nTambién te puede interesa:\n\n- [Cuándo tomar decisiones](https://9punto5.cl/blog/cuando-tomar-decisiones/)&quot;]}],[0,{&quot;slug&quot;:[0,&quot;planteamiento-del-problema&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Cómo escribir un planteamiento del problema&quot;],&quot;description&quot;:[0,&quot;Aprende a definir correctamente el problema antes de diseñar soluciones. Evita errores comunes y toma mejores decisiones con esta herramienta práctica.&quot;],&quot;date&quot;:[3,&quot;2023-02-16T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/planteamiento-problema.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Decisiones&quot;],[0,&quot;Claridad&quot;],[0,&quot;Problemas&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;¿Te has lanzado a implementar una solución de forma apresurada? Yo sí, me declaro culpable.\n\nEsto pasa cuando **te apresuras a intentar una solución, pero sin pensar en serio el problema**. Ponemos personas, tiempo, energía y recursos buscando alcanzar algún objetivo, pero la aguja no se mueve, no pasa nada relevante.\n\nPor ejemplo, te puede sonar familiar el caso de **intentar aumentar las ventas con una campaña de marketing**. Se crean anuncios pagados para redes sociales, se diseñan piezas gráficas y textos de venta, se crea una landing page, se arman secuencias de mails y... no pasa nada. Muchos clicks y nada de conversión.\n\nAlgo así me pasó el año 2016 vendiendo espacios de trabajo de coworking. En una oportunidad **el resultado fue tan malo** que, al usar una frase como &#39;¿buscas un lugar para trabajar?…&#39;, personas nos contactaron creyendo que ofrecíamos empleo.\n\nPara que no te pasen cosas como estas, hoy **te comparto una herramienta que te ayudará a definir correctamente el problema que necesitas resolver antes** de lanzarte a diseñar la solución. Algo que te ayudará a **tomar mejores decisiones**.\n\nPuede que esto implique incluso aprender a pensar distinto, ya que desde la educación primaria en adelante nos han enseñado principalmente a resolver “problemas menores” que tienen una solución predefinida (como despejar la X en una ecuación). Pero **en la vida real los retos son regularmente problemas difíciles o complejos**, con varias soluciones posibles, por lo que es importante entenderlos primero antes de buscar la respuesta.\n\n&gt; La parte más importante de resolver un desafío, no es llegar a la solución, es entender bien el problema.\n\n## Qué es un planteamiento del problema\nEl método de _\&quot;planteamiento del problema\&quot;_ consiste en **describir de forma precisa** lo que queremos resolver o mejorar y **definir cómo evaluaremos que hemos resuelto** el problema.\n\nPodría implicar explicar los “5W” –quién, qué, por qué, dónde y cuándo– del problema. Así como mostrar la brecha entre el estado actual y el deseado.\n\nEl objetivo del planteamiento del problema es **actuar después de que conocemos el problema real**. Para lo que queremos evitar cosas como:\n\n- Resolver el problema equivocado\n- Definir el problema en términos de la propuesta de solución\n- Atacar un problema menor, perdiendo la oportunidad de resolver el problema de fondo\n- Resolver solo los síntomas temporales del problema, en vez de resolver el problema real\n\nRedactar el planteamiento de un problema ayuda a **identificarlo y definirlo con precisión** para luego pasar a explorar los posibles caminos de solución.\n\n## Cómo escribir un planteamiento del problema\nPara escribir bien un problema es necesario **definir el objetivo que se quiere conseguir**.\n\nEl primer paso es **explicar lo que está funcionado mal y por qué**. Para lo que podrías querer responder a preguntas cómo:\n\n- ¿Cuál es el estado actual?\n- ¿Cómo puedo medir que lo que tenemos ahora está mal?\n- ¿Qué evidencia tenemos de que esto es un problema?\n- ¿Qué efectos negativos está provocando?\n- ¿Cuál es el estado deseado al que queremos llegar? ¿Cómo - podemos medir cuando lleguemos ahí?\n- ¿Cuál es la historia de este problema? ¿Ha pasado antes?\n- ¿Qué soluciones se han probado antes?\n- ¿Cómo se comporta el problema en el tiempo?\n- ¿Cómo le explicarías el problema a alguien que no tiene conocimientos de esta área?\n\n### Identificar la causa raíz\nEl segundo paso es **encontrar la verdadera causa del problema**, no solo los síntomas. Para esto podrías preguntarte:\n\n- ¿Qué hace falta para que esto no vuelva a pasar de nuevo?\n- ¿Qué pruebas hay para demostrar conexiones entre las causas y los efectos del problema?\n- ¿Si te sigues preguntando “por qué”, a qué explicaciones llegas?\n- ¿Cómo puedes dividir el problema en partes más pequeñas? - ¿Cómo se conectan estas partes?\n- ¿Qué procesos podrían mejorarse o ser añadidos para resolver este problema?\n\nAdemás, al describir el problema es aconsejable:\n\n- Explicitar claramente el alcance del problema\n- Decir sin ambigüedades lo que no tienes poder para resolver\n- Considera que un problema puede tener múltiples causas de fondo, y tus primeras impresiones podrían estar equivocadas.\n\n## Propiedades de los problemas complejos\nEl artículo académico _[“Dilemmas in a General Theory of Planning”](https://www.sympoetic.net/Managing_Complexity/complexity_files/1973%20Rittel%20and%20Webber%20Wicked%20Problems.pdf)_ de Horst Rittel y Melvin Webber describía, ya hace 50 años, **diez propiedades** de este tipo de problemas:\n\n1. No hay una forma definitiva de describir un problema complejo\n2. No hay una forma definitiva de resolver un problema complejo\n3. Las soluciones a problemas complejos pueden ser mejores o peores, pero no pueden expresarse en términos de verdadero o falso\n4. No hay una manera definitiva, ni un tiempo límite para probar una solución a un problema complejo\n5. Cada intento de solucionar un problema complejo lo transforma; por lo tanto, no hay forma de aprender mediante el método de ensayo y error\n6. No existen criterios que permitan enumerar todas las soluciones posibles a un problema complejo\n7. No existen clases o categorías de problemas complejos; cada cual es único\n8. Cada problema complejo podría considerarse como solo un síntoma de otro problema\n9. La forma de describir un problema complejo determina su solución\n10. Somos responsables de las consecuencias de las soluciones que intentemos\n\nVolviendo al ejemplo inicial, en 2016 el concepto de coworking era poco conocido en la ciudad en que estábamos. Luego nos dimos cuenta de que el problema real no era vender más espacios de trabajo; un mejor planteamiento del problema era responder a la pregunta de cómo dar a conocer el concepto de cowork y sus beneficios a un grupo más amplio de personas.\n\nLa forma en qué definas el problema **limitará las posibles soluciones** que se podrán crear, y **establecerá un contexto compartido** entre las partes involucradas. Esta clara definición del problema te ayudará a pensarlo y resolverlo de mejor manera.\n\n&gt; Cuando estás resolviendo un problema como equipo **estar de acuerdo en cuál es exactamente el problema, es más importante que estar de acuerdo en la posible solución.**&quot;]}],[0,{&quot;slug&quot;:[0,&quot;post-conferencia-2023&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¿A quién más le pasó pensar, mientras comía en el break o tomaba una Red IPA en El Growler, `oh la volaita`?&quot;],&quot;description&quot;:[0,&quot;Un invitación a expandir, profundizar y distribuir la comunidad y el conocimiento postconferencia 2023.&quot;],&quot;date&quot;:[3,&quot;2023-11-19T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/panel.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;daniela-riquelme&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Conferencia&quot;],[0,&quot;9punto5&quot;],[0,&quot;Comunidad&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;¡Hola comunidad! Ahora se siente más bonito decir eso ¿no?\n\nVivimos 3 días intensos, altos en aprendizaje, motivación, descubrimiento, toma de consciencia y harto tema nerd.\n\nComo ya hemos comentado, la gran mayoría de las postulaciones recibidas fueron de la categoría “Bienestar” y otro tanto sobre cómo trabajar mejor. Y precisamente de eso se trató la séptima edición, de una búsqueda de estar mejor con un entusiasmo de encontrarnos en las conversaciones del futuro laboral, sobre lo que queremos para nosotros, para nuestros trabajos y para mejorar Chile y el mundo.\n\n¿A quién más le pasó pensar, mientras comía en el break o tomaba una Red IPA en El Growler, “oh la volaita”?. Y es que eso fue encontrarnos. Reflexiones intensas, más maduras: trascendentales. Nos encontramos en nuestros más profundos intereses y propósitos; y también en la falta de ellos.\n\nNuestras expectativas eran altas, pero no tanto. Creo firmemente en que no podemos diseñar realmente la experiencia de las personas porque cuando ocurren los momentos, otras situaciones pasan dado que vivimos en un sistema complejo (véase la charla de Jeannette von Wolfersdorff…pronto). Es por eso que no sabíamos realmente cómo sería el encuentro presencial 9punto5. Y fue hermoso.\n\nBienestar, cultura de trabajo remoto e híbrido, startups, propósito, liderazgo, gestión de personas, futuro tecnológico, matriz productiva, sistemas complejos, tecnología, gobernanza, estudios, emociones en el trabajo, y muchos temas más fueron los que se trat
