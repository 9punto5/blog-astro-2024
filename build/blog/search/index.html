o reacciona en 10 años más lo que tengo que hacer de nuevo como proyecto de ley. Si no necesito una fuerza más constante, iterativa, mucho más alejado del juego de poder, porque tiene que ser mucho más técnico la gestión del sistema para mantener su complejidad y tengo que entender su feedback loop, el feedback positivo que tiene, en el sentido de que tiene concentración económica como una característica que tiene que balancearse en contra.\n\nPero todo esto significa tomar en realidad los conocimientos del sistema complejo, de system dynamics, y ver cómo aplicarlo a políticas económicas, y esto es el desafío más estructural del momento a mi juicio, porque sin cambiar la forma como procesamos como creamos políticas económicas no vamos a ser justo frente a la complejidad de los desafíos.\n\nY tal como lo dijo Stafford Beer, que diseñó para Chile el proyecto Cybersyn, que no reconoció competencia y cooperación si no se focalizó en crear una especie de internet y automatizar comunicación y datos. Algo muy innovador, por un lado. Él decía que la humanidad en realidad le recuerda de la idea de los reptiles cuando se desarrollaron hacia los pájaros, y cuando ve hoy día un CEO frente un computador, en realidad él piensa que es casi como un reptil que le habría salido recién una pluma, pero que piensa que va a volar en la noche.\n\nFrente a los desafíos que tenemos como humanidad, lo más asombroso es que enseñamos sistema complejo, el System Thinking, lo enseñamos, es la base de la computación, lo enseñamos y es la base de la inteligencia artificial, y nosotros no lo aplicamos para nuestra propia gobernanza, y esto es en realidad para mí el desafío del momento más importante que quería destacar.\n\nY disculpen la que partí por la evolución 1.5 de años atrás, pero quería explicar la importancia de cooperación y competencia, que sigue existiendo en cualquier equipo para complejizar nuestra regulación también, que es como esta meta-innovación que tenemos que hacer. No solamente hacer mejores reglas, si no en realidad tenemos que cambiar la forma y el proceso como creamos reglas.\n\nUstedes que son del ámbito informático tienen mucho que decir en eso, ustedes saben mucho mejor que otros, qué son los que son los procesos iterativos, y es importante hacer el cruce de vuestro conocimiento con la forma como se hacen política económica, para mí es lo más importante.\n\nPara que la humanidad puede sobrevivir bien este siglo, porque uno ve de este cambio climático, la biodiversidad, la masa antropogénica, todo el impacto del ser humano en este planeta, y si queremos entonces vivir mitad del siglo dentro de los límites del planeta tenemos que cambiar algo y tenemos que cambiar el proceso de cómo creamos reglas para los actores del mercado y no lo vamos a hacer sin reconocer la complejidad del sistema y aplicar los conocimientos que desde décadas ya existen para pensar en materias pensamiento sistémico.\n\nAsí que quería darles la invitación a ustedes, en realidad de sumarse a pensarlo porque veo que esto a nivel internacional es un desafío. No solamente en Chile.\n\n## Entrevista\nLa charla de Jeannette fue seguida de una entrevista y conversación liderada por Daniela (Nela) Riquelme.\n\nNela: Sí bueno Primero que nada, gracias Jeannette. Creo que muchas de las personas que estamos acá, bueno, hay algunos son fans declarados, hay una fila de fans esperándote... Yo también tengo mi libro, lo estoy leyendo no lo terminé, pero estamos en eso.\n\nHablaste de dos temas bien importantes que desde 9punto5 nos llama la atención. Uno tiene que ver con el tema de esta visión o perspectiva de la competencia y la colaboración.\n\nJeannette: Cooperación, yo colaboro con tus objetivos, pero cooperamos cuando tenemos un objetivo común.\n\nNela: Entonces son estos dos conceptos que son parte de tu libro y parte un poco el tema del capitalismo, pero también hablaste de los sistemas complejos. Cómo esa visión de la comprensión de los sistemas complejos podría cambiar un poco la toma de decisiones.\n\nPero quiero partir con una pregunta respecto a la primera parte: ¿Cómo la competencia se desarrolla en las personas para la toma de decisiones en una sociedad sana, considerando que la competencia la vemos como desde un punto de vista más nocivo que positivo.\n\nJeannette: Yo encuentro muy sensible que se ve negativo la competencia porque, bueno, en Alemania hay una palabra que diferencia la competencia por crear, de la competencia por destruir.\n\nCuando el mercado funciona bien, cuando tu empresa y la mía competimos… la verdad el consumidor elige lo que más valor le crea, entonces en ese caso tenemos una competencia por crear mayor valor.\n\nPero esto significa que el mercado funciona como debería funcionar. Pero, cuando tenemos una competencia por destruir, donde yo tengo prácticas que hacen que en realidad te hago imposible que tú sigues avanzando, después te compro y después destruyo tu negocio, naturalmente no es la forma como deberían operar los mercados.\n\nY lo interesante es que cuando terminó la Segunda Guerra Mundial se creó este concepto de la economía social de mercado, que significa que todo tipo de protección social en la sociedad es muy importante, pero de igual importancia tiene el mercado como herramienta social en sí mismo, porque hace que tú crees una empresa exitosa, que tú surjas como talento en una empresa. Pero eso requiere un cuidado activo, no solamente reactivo.\n\nComo en línea con lo que Israel hizo después de protestas sociales en 2012, cuando cambiaron su institucionalidad de pro competencia, que antes era antimonopolio, lo cambiaron a pro-competencia, por mercado.\n\nEn Chile también nos falta una institucionalidad pro-mercado, y nos falta mucho foco en el mercado mismo. Y sí, la competencia es necesaria, ya como de este fin del siglo XIX comprobado, esto partió con un agrario francés que hizo este ensayo de dejar tirar dos grupos una cuerda y vio que no aumentó linealmente la fuerza de un grupo de trabajo cuando tiraban la cuerda esto se llama pereza social cuando tú no tienes la presión competitiva que deberías tener porque tu esfuerzo se hunde en el grupo.\n\nHoy día hay meta estudios, de muchos estudios, que comprueban que no puede haber innovación y buen rendimiento sin algo de presión, pero tiene que ser una presión por crear y no por destruir, y hoy día cuando hay mucho anhelo por mayor cooperación quiero igual destacarlo, para que se entienda la importancia de ambos conceptos en conjunto, y ninguno por sobre el otro. Si no, la innovación necesita una cierta presión en la persona, en el grupo, en la empresa, y eso a la vez es la base para la cooperación hacia la innovación.\n\nNela: Gracias, voy a volver a ese punto, pero desde el punto de vista del Estado, me voy a meter en la pata de los caballos acá. ¿Cómo el estado puede integrar la naturaleza humana de la cooperación y la competencia sin sesgos partidistas?\n\nLos espacios del Estado están habitados por ciertos espacios políticos y otros que son más técnicos, y los políticos surgen o están más en la concentración y de la lucha de poder, probablemente, pero a la vez tienen que instalar políticas públicas y desarrollar un montón de iniciativas que son por el bien de todo el país, y está súper apalancado con el sistema económico en el que vivimos también, pero está lejos de la conversación que tú nos traes acá, de que podemos sobrevivir como humanidad basada en la cooperación y la colaboración.\n\nEntonces, ¿cómo el Estado puede involucrarse también en esa narrativa, dejando de lado un poco la concentración de poder, y ese lado más de los partidos que tiene que ver con quién da más o qué espacio se toma o qué no, como la lucha de poder en contra de la competencia de la colaboración?\n\nJeannette: El Estado tiene que crear igual como una empresa, si la empresa quiere que haya inteligencia colectiva, tiene que crear los espacios para que haya inteligencia colectiva, porque esto no es algo que se da en espacio no protegido o no diseñado para que haya inteligencia colectiva.\n\nEntonces cuando por ejemplo cuando tenemos una industria que quiere colaborar en avanzar hacia mejores políticas públicas, quiere también reducir la burocracia, pero quiere mejor reglas porque sabe que si por ejemplo no tenemos reglas para que todos tienen que reducir el sodio el azúcar o la dulzura de productos, ellos no pueden ser sostenibles porque mi producto no va a ser tan bueno y no va a ser preferido en la góndola del supermercado si soy saludable, mientras el otro tiene todo tipo de contenido dopamínico, entonces si yo como empresa digo yo quiero colaborar cooperar quiero avanzar hacia productos sostenibles en el sentido de que hacen bien al que lo consume yo no puedo hacerlo solo porque no me van a comprar.\n\nEntonces significa tener que cooperar con reglas con gradualidades, negociar con alguna otra parte técnica y hoy día no existe esta contraparte técnica. Porque si una empresa grande, mediana, pequeña, quisiera cooperar en política económica, tendría que contactarse con el Ministerio de Economía, con el Ministerio de Hacienda. Podría ir al congreso, naturalmente puede hablar con los partidos, pero todo esto son lugares normalmente alejados de la empresa, no tan especializados y además donde todo se negocia cuando yo voy y propongo cooperación para reducir el glutamato monosódico de los productos que hace como que queremos más y más y más.\n\nTe van a decir Okay conversemos, pero yo quiero tu voto para un proyecto de ley de vivienda entonces este tipo de juego de poder que existe cuando no hay espacios protegidos hace que uno no puede entrar en la profundidad técnica que requiere esta complejidad del momento donde un desafío complejo en un sistema complejo que ustedes saben tiene tantas aristas y tanto tanta acciones entre las partes que requiere mucha especialización y dedicación y multi un equipo multidisciplinario también y esto es imposible de lograrlo en el juego de poder actualmente tal como se gestiona, razón por la cual la única forma de tener más cooperación entre empresas con la empresa, para política económica, es repensar el espacio.\n\nPara eso, porque, hoy día, la empresa que quieren cooperar pocas veces encuentran cómo hacerlo también.\n\nNela: Y cómo nosotros, como personas técnico-científicas, podemos luchar contra eso desde nuestros pequeños espacios que a lo mejor tenemos muy poca concentración de poder o muy baja cómo lo podemos hacer.\n\nJeannette: yo encuentro lo más importante que pueden hacer todos los que saben de tecnologías es ayudar a pensar cómo sacar conclusiones de lo que enseñamos a la máquina para nuestra propia gobernanza, porque yo encuentro tan irónico que enseñamos cómo funcionan sistemas complejos, iteraciones, la gestión de un sistema complejo, y cómo mantenerlo viable… todo esto se enseña en software, computación, inteligencia artificial la base de muchas aplicaciones en el mundo informático y no lo ocupamos para nosotros mismos.\n\nEntonces de verdad yo quería decirles por favor nos ayudan a pensarlo, porque internacionalmente no existe mucho avance que sea realmente pragmático y práctico.\n\nEstá volviendo a pensarse, y hay muchos libros sobre system thinking, pero no son realmente prácticos, para la pregunta de qué hacemos en concreto. Tenemos que cambiar las reglas, el “World Business Council For Sustainable Development”, más grande del mundo, dicen que hay que cambiar muchas reglas para que el capitalismo sea sostenible, pero si cambiamos las reglas para premiar la empresa sostenible y para castigarlas, dejarlas afuera, que no pueden seguir siendo viables cuando no son sostenibles, eso debería ser la regla, y deberían ser muy rentables cuando sí son sostenibles, pero esto requiere cambiar muchas reglas.\n\nPero si hoy día hay trillions de dólares invertidos en combustible fósiles, es porque es un buen negocio. No porque la banca o los financistas de private equity sean malas personas, entonces tenemos que encontrar reglas para que deje de ser un buen negocio, pero eso requiere mucha cooperación y encontrar espacios donde puede ocurrir esto, porque si no, esta organización grande que normalmente tienen bajo cierto control a los gremios empresariales y dictan lo que es el discurso empresarial y son la minoría, pero son los más grandes, y eso es justo algo que también sistémicamente hace imposible que entramos en una conversación más técnica, porque a los grandes le conviene el status quo, no porque son malos sino simplemente porque les conviene y porque no hay ningún lugar donde uno podría conversar sobre política económica de verdad a nivel más técnico y basado en evidencia.\n\nSi ustedes ven la estadística de mercado que tenemos en Chile: ¿Cuál es la composición del mercado? ¿Los distintos tramos, los distintos tamaños de empresa, a cuáles tramos venden? Como una tabla input-output, según tamaño de empresas ¿Quién tiene más porcentaje de mercado y cómo se compara esto con el porcentaje de impuestos que paga o con el porcentaje de subsidio que recibe?\n\nTodo esto son preguntas que deberían tener respuesta cuando queremos hacer política económica basada en evidencia y ni tenemos la data organizada.\n\nEntonces vemos que si no tenemos la data, imposiblemente vamos a avanzar y tampoco tenemos la institución para conversar sobre estos datos de forma no ideológica, sino buscando cuidar la complejidad del mercado con políticas complejas, porque esto de que volvemos a lo simple es justo lo contrario lo que hay que hacer.\n\nSi uno piensa, de no sé cuándo nos gusta algo muy simple, una decoración muy simple, hoteles que son muy modernos y muy minimalistas. Todo esto igual es una consecuencia de un mundo que busca volver a lo simple, porque estamos ahogados en complejidad, porque no sabemos hacernos cargo de la complejidad y no podemos volver a lo simple, porque si no a lo caótico y a sistemas menos complejos.\n\nEntonces la única manera de mantener la complejidad en el mercado y en la sociedad es hacernos cargo con cooperación, pero tener los espacios para eso y con competencia, porque sin mayor competencia la cooperación nunca va a funcionar bien.\n\nNela: necesitamos más energía para tener la estabilidad mental para hacernos cargo…\n\nJeannette: Pero mira, igual los informáticos, y usted todo lo saben, están muy en su celda y como le cuesta salir y compartir y cruzar conocimiento- Entonces igual yo creo que tienen que como mezclar la disciplina un poco más porque siento que esta disciplina es clave no solamente como respaldo tecnológico, sino de los conceptos que tiene detrás la tecnología el system thinking es clave para organizar procesos mejor, para tener un capitalismo que realmente puede ser sostenible en este planeta.\n\nNela: hablaste de que nosotros privilegiamos el liderazgo por prestigio (y por dominancia). Cómo escapamos de esta concentración de poder, de solo correr por la ruedita del hamster. Cómo rompemos ese círculo, de, quiero escalar y de la jerarquía.\n\nJeannette: cuando la empresa gana más cuando crea valor si las reglas se repensarían y los incentivos naturalmente el que lidera la organización tienes que escuchar mucho más y ahí probablemente uno como directorio como dueño de empresa busca más liderazgo que escuchan más, lo difícil del liderazgo por dominancia es que en situaciones complejas es el único que dice lo que hay que hacer, porque el que no tenga este esta característica probablemente tiene que decir no sé qué voy a hacer, voy a hacer algunas pruebas iterativas y uno en esta situación puede preferir el que dice exactamente lo que hay que hacer lo que es imposible saber en una situación compleja.\n\nPero deberían dar menos espacio para este tipo de liderazgo, que son excesivamente jerárquicos, que se anidan en cada nivel jerárquico y que son anti mercado también.\n\nPorque también dentro de una organización uno tiene práctica anti mercado, que son como estos monopolios, la gerencia de personal es un monopolio, la gerencia de finanzas y un monopolio.\n\nNela: los silos de los que hablamos en las empresas\n\nFinalmente, haciendo una mini conclusión porque vamos a ver si hay personas del público que quieran hacer preguntas puedan empezar a levantar la mano, tenemos entonces, como concluyendo, el liderazgo es transformador si uno cambia el concepto de liderazgo a menos jerárquico o menos de dominancia podríamos empezar nosotros como dentro de las empresas a cambiar un poco esta forma de que es lo que se premia.\n\nJeannette: claro y tener innovación bottom-up e inteligencia colectiva, significa que el equipo tiene que fijar el objetivo en conjunto, no que el jefe dice lo que hay que hacer, si no el equipo tiene que en conjunto acordar, esto es cooperación, pero a la vez el equipo tiene que tener una cierta competencia con el equipo al lado y también dentro del equipo tiene que armarse una cierta presión competitiva.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;cuc3a1l-es-tu-nivel-de-seniority-en-el-desarrollo-de-software-c5b0d80a1060&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¿Cuál es tu nivel de seniority en el desarrollo de software?&quot;],&quot;description&quot;:[0,&quot;Lo que voy a escribir hoy en este post para 9punto5 es un tema controversial. Varios concuerdan y a la vez muchos están en desacuerdo con esta definición. Pero a pesar de estas diferencias es un…&quot;],&quot;date&quot;:[3,&quot;2020-03-23T14:02:59.520Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/lidearzgo.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Liderazgo&quot;],[0,&quot;Seniority&quot;],[0,&quot;Developer&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nLo que voy a escribir hoy en este post para 9punto5 es un tema controversial. Varios concuerdan y a la vez muchos están en desacuerdo con esta definición. Pero a pesar de estas diferencias es un hecho que una amplia cantidad de empresas utilizan la distinción entre niveles de “seniority” al momento de buscar talento.\n\nEsta definición ha ido mutando aún más a través de los años, donde la tecnología y acceso a la información se ha vuelto esencial para adquirir conocimiento. Ya no es necesario estudiar años una carrera, para llamarte informático o “developer”.\n\nYoutube, Twitter y LinkedIn son las nuevas universidades. Por solo 10 dólares americanos puedes estudiar en Udemy, y salir 5 horas después con conocimientos de una persona, que vive al otro lado del planeta.\n\nPor un poco más de dinero, puedes comprar apps y software pre-hecho para posteriormente ajustarlo a tus necesidades. Github es el universo del open source donde puedes elegir el código para incluirlo en tu nuevo proyecto.\n\nEstudié 6 años una carrera para hacerme llamar “Ingeniero Civil Informático”. En ese momento, decían que era la carrera del futuro y cuando comencé a ejercer, pensé que mis conocimientos iban en sintonía con la realidad de ser desarrollador.\n\nEstudiar 6 años una carrera, en el año 2020, puede sonar iluso. Carreras basadas fuertemente en lo académico, con hasta 4 ramos consecutivos de matemática y física avanzada, programación y/o modelos de software se podrían considerar obsoletos en esta nueva década.\n\nLas cosas han cambiado drásticamente en términos de que debe hacer un desarrollador de software. Ya no basta con solo saber un lenguaje de programación, haber participado en mínimo 5 proyectos, o tener “bonus points” por tener experiencia y saber de uno o varios sistemas “legacy”.\n\nSi empezaste tu carrera en el mundo del software y la tecnología, alrededor de esta fecha, verás que existen ciertas expectativas aparte de las técnicas. Diversidad, tolerancia e interculturalidad, son algunas como ejemplo.\n\nYendo al tema en cuestión de “seniority”, en mi experiencia, existen al menos 5 niveles de desarrollador, que además se complementan con más dimensiones como el tipo de liderazgo, capacidad de coordinar procesos y su conexión con la comunidad.\n\nNo creo simplemente en un título como “Senior Software Engineer”. Si lo vemos más a fondo, un dev se mide en muchas más capacidades y puede ir y volver en distintos caminos.\n\n**La lista que describiré a continuación no es un camino secuencial con un fin.** Es un constante ir y venir entre tecnologías, liderazgo, multiples tipos de proyectos, descubrir intereses y generar impacto social. Yo alguna vez me he llamado “Senior Backend en PHP” para un año después convertirme en un “Junior React Native”.\n\n# Junior Dev\n\nVamos al más simple de explicar. Un “junior dev” es una persona con nula o muy poca experiencia desarrollando. La mayoría del tiempo debe ser guiado o guiada para conocer procesos e implementar buenas prácticas. Su código necesita de constante revisión y su habilidad de comunicación es muy limitada.\n\nAcá es bueno detenerse para hablar de la comunicación. Es una habilidad imprescindible que nadie enseña. Ya hubiera querido en “la U” que me hubiesen enseñado a escribir y escuchar mejor (¿les suena esta habilidad para el trabajo remoto?). Un “junior” con esta habilidad desarrollada tiene mucha cancha avanzada para tener éxito en un grupo o proyecto.\n\n# Mid-Senior o Intermediate Dev\n\nPodríamos decir que el “Intermediate” es el dev que ya tiene 2 o 3 años de experiencia y que puede tomar tareas más complejas. Domina muy bien un “stack” (en fácil llámese “stack” a un lenguaje, tecnología, o conjunto de las anteriores). Es posible además, que pueda ayudar a aprender a un “junior”.\n\nDel punto de vista del código, tiene las habilidades para realizar comentarios a un “pull request” y explicar algunas funciones e incluso ciertos patrones de arquitectura.\n\nEn base a mis proyectos del pasado, el “Intermediate” es el que copia/pega código de StackOverflow y algunas veces se queda corto con la explicación de que hace ese código. O sea, no existe una capacidad madura de discernir porque estoy añadiendo más líneas y/o como impactan a otras áreas del mismo software.\n\nEn resumen, **¿cuáles a mi parecer son las habilidades esenciales a empezar a aprender en este nivel?**  Tres principalmente.\n- Responsabilidad y/o ownership. Te gradúas de “Intermediate” cuando eres el principal responsable de una parte de un proyecto y eres capaz de ejecutar ciertas tareas sin la necesidad de una dirección clara. Algunas veces incluso, ambigua.\n- La capacidad de manejo de emociones en un proyecto. Frustración, ansiedad, enojo deben ser contrastadas con paciencia y humildad.\n- Opinión madura en al menos un área de código fuente. Puede ser arquitectura, estilos, patrones, entre otras.\n\n# Senior Dev\n\nAhora me meto en territorio complicado. ¿Qué nos hace ser seniors en software?\n\nPor favor, no pienses que es solamente ser experto y literato en un lenguaje o framework. No pienses que es “codear” problemas complejos que nadie más los puede hacer, o que alguien necesita logros increíbles para pertenecer a tu equipo de desarrollo.\n\nSi bien podemos concordar que un senior puede tomar decisiones en un equipo, elegir “el stack”, levantar ambientes de desarrollo, realizar un “deploy”, y últimamente dar la visión de como debe ser el desarrollo de un proyecto, también en este nivel se pueden notar bifurcaciones o distintos estilos en la carrera de un desarrollador.\n\n¿A qué me refiero con eso? **Que hay algunos devs que se convierten en líderes de equipo, y otros en “tech leads”** . La diferencia es que los primeros ahondan en “soft skills” y los últimos en “hard skills”. Los dos caminos son válidos y necesarios.\n\nIndependiente del camino, existen ciertas habilidades del futuro que nadie me contó, y a las cuales debí haberle puesto más atención para ser “Senior” (escribí esto en mi blog hace un tiempo).\n- “Olvidar” lo que has aprendido. Después de 5–7 años de desarrollo, olvídate de todo lo que aprendiste. Es fácil a esta altura tener verdades, estilos y hábitos que son difíciles de cambiar. Para mi, esto decanta en que un senior siempre debe tener una actitud de curiosidad y cuestionamiento hacia lo que hace.\n- Comunicarse de forma simple. A menos que trabajes solo, deberás comunicarte con más personas. **Un “Senior” debe “encender” la comunicación** . Sentirse cómodo con la ambigüedad y encontrar el balance entre lo simple y lo complejo. En este punto, clarificar que la comunicación también implica escuchar a los demás, no solo ser escuchado.\n- Crear un estilo de liderazgo centrado y descentralizado. Dejar que otros opinen y que fallen. Y como si esto fuera poco, dejar las expectativas y buenas prácticas claras.\n\n# Tech Lead\n\nUn “Tech Lead” es un “Senior” con bonus en manejo de proyectos y entendimiento de reglas de negocio. Vas a llegar a un momento donde deberás entender porque un “feature” la dejaste en el “backlog” y estás codeando un “fix” que a nadie le importa.\n\nEn este tipo de cargo, existen ciertas consideraciones que debes diariamente, y que por ello tu tiempo se vuelve más demandado. Un “Tech Lead” pasa más tiempo conversando, comunicándose, en reuniones y generando documentación, en vez de programar.\n\n¿Otras diferencias esenciales con el “Senior”?\n- **Es el principal ejemplo (no el único) a seguir en un equipo.**  No solo técnicamente, si no también en términos de responsabilidad y ownership.\n- Como mencioné al inicio de esta sección, es capaz de entender información y procesos de distintos dominos (diseño, UX, negocio y marketing). Al entender esto, es capaz de traducirlo a su dominio y cómo impacta en el desarrollo de software.\n- Crea un estándar profesional de buenas prácticas y procesos en un proyecto. Y en los casos más extremos, incluso para una empresa.\n\n# Engineering Manager\n\nEste rol puede ser llamado “CTO” también y no necesariamente es una evolución directa del “Tech Lead”. Por ejemplo, si te vas a un startup y eres el único empleado, ya eres el “CTO”. Y eso hace que desarrolles habilidades de “manager” más rápido. O de “Senior” también podrías tener bastante camino recorrido para manejar un proyecto desde el punto de vista de un gerente o “manager”.\n\nPero vamos a los ejemplos concretos.\n\nYo veo a un manager en el ámbito del software como un diseñador de procesos, directo colaborador de la cultura de una empresa y principal motivador de los procesos de ingeniería o de desarrollo. Dígase estos como: contratación, políticas de mantenimiento de código, procesos de automatización y deployment de software, entre otras muchas más.\n\nEste manager también debe ser capaz de entender motivación y deseos de su equipo. Cuales son las fortalezas y debilidades de cada miembro para así estructurar equipos que sean existosos. Esta característica dista de lo que otros puedan pensar. Por ejemplo, el “CTO” algunas veces es visto (en el ámbito “startup” principalmente) como la única persona que hace tecnología. Codea, lanza nuevas features y continua en ese loop.\n\nSi bien eso es posible y mantenible en el corto plazo, un manager debe si o si tener “soft skills”, manejo de emociones, mucha paciencia y humildad. Sin por supuesto, dejar de lado lo técnico.\n\nEn este punto, el código fuente pasa a segundo plano y ya no es necesario revisar línea por línea. Un manager efectivo debería aspirar, a por ejemplo, crear un proceso automatizado de “pull request” que evalúe el código y le da una primera impresión sin tener que ir línea por línea.\n\nPor último, un manager se interesa por la calidad del software. Esto lo he visto configurado de distintas maneras. Puede ser un departamento de QA, procesos de DevOps e implementación de pruebas automatizadas para estar siempre midiendo como el software se está portando.\n\n## Tener liderazgo sin ser jefe\n\nPor último, esto ya es tema para otro post, pero de forma breve se puede agregar, que aunque esto no se ve mucho en Chile o Latinoamérica, existen empresas que valoran tener personas muy competentes que profundizan sus conocimientos y los difunden en la organización y el ecosistema, que pueden desarrollar su carrera sin necesariamente llegar a ser “managers”.\n\nPuedes tener mucha relevancia en la compañía, tener mucha influencia y liderazgo sin ser jefe. Algo de esto mencionó Felipe Hoffa, quien trabaja en Google, al final de esta entrevista.\n\n**Agradecimientos**\n\nMuchas gracias a Jonathan Gonzalez y Fabián por los aportes a este post.\n\n**Sigamos la conversación**\n\nEn Twitter: [@nerdfromchile](https://twitter.com/nerdfromchile) / [@9punto5_](https://twitter.com/9punto5_)&quot;]}],[0,{&quot;slug&quot;:[0,&quot;cuando-tomar-decisiones&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Cuándo tomar decisiones&quot;],&quot;description&quot;:[0,&quot;Aprende a tomar decisiones importantes con claridad y confianza. Descubre cuándo actuar y cómo dividir grandes decisiones para minimizar riesgos&quot;],&quot;date&quot;:[3,&quot;2022-11-22T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/cuando-tomar-decisiones.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Decisiones&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Nuestra historia y contexto han incidido en cómo somos. Pero si creemos que somos solo eso, nos dominaría una visión de locus externo (no tener control sobre lo que nos pasa). Aunque también somos producto de nuestras condiciones y circunstancia, también somos producto de decisiones que tomamos.\n\nPor eso es importante aprender a tomar decisiones, especialmente las importantes. Pero, ¿Qué es una decisión importante? Podemos ubicar las decisiones en algún punto de estos cuatro extremos:\n\n1. Decisiones Reversibles y Sin consecuencias\n2. Decisiones Irreversibles y Sin consecuencias\n3. Decisiones Reversibles y Con muchas consecuencias\n4. Decisiones Irreversibles y Con muchas consecuencias\n\nCuando estás frente a una decisiones del cuarto tipo es cuando te lo tienes que tomar más en serio.\n\nEn este caso lo más sano es tomar tiempo y distancia para decidir. Aquí quieres evitar el peor escenario posible y es cuando, por el contrario, quiere tener la mayor cantidad de alternativas posibles antes de comprometer un montón de recursos y energía en una vía de acción. Por eso quieres investigar, pensar, diseñar e imaginar caminos posibles.\n\nAdemás, es aconsejable **dividir esta Gran Decisión en decisiones más pequeñas, más irreversibles y con menos consecuencias**.\n\nPero tampoco puedes aplazar indefinidamente una decisión. Hacerlo es mala idea. Por eso te comparto **tres momentos donde hay que dejar de pensar y pasa a la acción**:\n\n1. **Cuando ya no puedo recabar más información valiosa.** Ya googleaste todo lo que podías; analizaste los datos; pediste consejo a personas que saben más que tú del tema; empezaste a encontrar la misma información en diferentes fuentes.\n2. Durante tu proceso de investigación, análisis, reflexión, conversaciones y... **¡YA! Conseguiste información clave y valiosa, que te aclara cómo actuar.** Hay un punto en el que todo te dice que ya sabes como seguir. Es momento de pasar a la acción.\n3. **Cuándo perdiste la primera oportunidad**. En algún punto, y por aún no haber decidido como actuar, dejas pasar una oportunidad. Se te “pasó la libere” y si sigues indeciso te volverá a pasar.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;cultura-organizacional-40deb867036f&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¿Qué es la cultura de una organización?&quot;],&quot;description&quot;:[0,&quot;Comprendiendo la cultura empresarial: sus patrones, el rol del liderazgo y cómo ocurre la adaptación&quot;],&quot;date&quot;:[3,&quot;2019-11-02T23:46:29.472Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/cultura.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;9punto5&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Cultura organizacional&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n&gt; En la contingencia chilena hace falta que empecemos a dar una mirada mas profunda a la cultura de las empresas\n\nCultura es una palabra que utilizamos mucho en 9punto5, por lo que quisimos desarrollar esta idea como un recurso que esperamos sirva para reflexionar en cómo estamos haciendo empresa. Esto nos parece además especialmente urgente antes lo hechos de las últimas semanas en Chile, donde millones de personas a lo largo del país han manifestado fuertemente el descontento, que también cae sobre la forma en que llevamos adelante nuestras organizaciones.\n\nAdemás estamos creando un repositorio de información pública de libre acceso, con esta misma información organizada en una estructura que nos permita disponibilizar en el tiempo una base de conocimiento sobre este tema para quienes la puedan considerar útil, que es lo que esperamos. Esto aquí 👉 **[Cultura — Knowledge Base](https://www.notion.so/9punto5/Cultura-3eaa473cdc5048a9bda8a1ab32edf3e1)**.\n\n## En 9punto5 definimos junto con Edgar Schein que:\n\nLa cultura de un grupo u organización puede ser definida como un set patrones de supuestos básicos aprendidos durante el camino de resolución de los problemas de adaptación externa e integración interna del grupo u organización, que han funcionado suficientemente bien como para ser considerados válidos y, por lo tanto, válidos de ser enseñados a nuevos miembros como la correcta manera de percibir, pensar y sentir en torno a dichos problemas.\n\n— El concepto de cultura implica: estabilidad estructural, profundidad, extensión y modelado (patterning) o integración.\n\n— Distinguimos tres niveles de existencia cultural en una organización: artefactos, valores inscritos y supuestos básicos.\n\nSi una cultura es “buena” o “mala”, “funcionalmente efectiva”, o no, no depende sólo de la cultura sino la relación que sostiene con el ambiente que la rodea.\n\nPara nosotros el aspecto más intrigante de cultura –como concepto– es que nos apunta a fenómenos que yacen bajo la superficie. Conceptos que son poderosos en su impacto pero invisibles y hasta un grado considerable, inconscientes. La cultura efectivamente crea mentalidades y marcos de referencia, esto consistiendo en uno de los importantes procesos encubiertos de la misma. En otro sentido, la cultura es a un grupo lo que el carácter y la personalidad son a una persona. Podemos ver la conducta que se desempeña, pero usualmente no podemos ver las fuerzas que causan ciertos patrones de conducta, así la cultura guía y constriñe el comportamiento de los miembros de un grupo a través de las normas compartidas que se sostienen en dicho grupo.\n\nEn una organización, lo que finalmente llamamos cultura es en principio el resultado de lo que un líder o un fundador ha logrado incrustar o implicar al imponer en un grupo lo que ha funcionado (o se cree que a funcionado) en el tiempo. En ese sentido la cultura en términos últimos es creada, implicada, evolucionada y finalmente manipulada por los líderes.\n\nAl mismo tiempo, con los procesos de madurez grupal, la cultura comienza a contener, estabilizar y proveer de estructura y significado a los miembros del grupo hasta el punto de finalmente especificar que tipo de liderazgo y organización será aceptable en el futuro.\n\nCuando los elementos de una cultura se vuelven disfuncionales, son los líderes los que tienen que conquistar su propia cultura y apurar el proceso normal de evolución con programas de cambio forzado de la cultura. Estos procesos dinámicos de creación de cultura y management son la esencia del liderazgo y nos llevan a caer en cuenta que liderazgo y cultura son dos caras de una misma moneda por su mutua implicación en la estabilidad y posibilidad de una organización.\n\nLa cultura nunca es gobernada desde los empleados o personas que están en una posición de poder menor a los dueños o líderes de las organizaciones puesto que su agencia de cambio puede con mucha facilidad ser truncada, impedida o redirigida desde posiciones de más arriba en la estructura al ser la redirección, trunque o impedimiento acciones legitmiadas por una organización vs. otras alternativas. Con esto se quiere decir que a menos que una cultura activamente busque funcionar redefiniéndose desde las bases hacia las cúspides, será siempre gobernada y redirigida por quienes tienen la posición legítima de hacerlo puesto que arrastrarán el acuerdo interno y externo de las mayorías cuando lo hagan, versus un acuerdo de un grupo menor al interior de una organización (que no logra afectar realmente la cultura de la organización). Esa diferencia de posición arrastra la capacidad de dotar de contenido a una cultura, versus tener un grupo de pares dentro de una organización, no es lo mismo.\n\n## Cultura formalmente definida\n\nLa cultura de un grupo puede ser definida como un patrón de supuestos básicos aprendidos por un grupo durante su camino de resolución de sus problemas de adaptación externa e integración interna, que ha funcionado suficientemente bien como para ser considerada válida y, por lo tanto, válida de ser enseñada a nuevos miembros como la correcta manera de percibir, pensar y sentir en torno a dichos problemas.\n\nLa cultura da estabilidad y predictibilidad al grupo: para que el concepto de cultura tenga utilidad alguna, debiese llevar nuestra atención hacia aquellos elementos que son producto de nuestra necesidad humana por estabilidad, consistencia y significado. La formación de cultura, por lo tanto, es siempre, por definición un esfuerzo hacia modelamiento e integración, aunque en muchos grupos, su historia factual de experiencias le impide formar un claro paradigma libre de ambigüedad y contradicción.\n\n### Definiciones\n\n![Medium-Image](/blog/images/posts/1*zZyhXplaj2xImFIJiqjHyw.png)\n![Medium-Image](/blog/images/posts/1*YshttUVDGJ1fAipfJzShiA.png)\n![Medium-Image](/blog/images/posts/1*yp2S_bscN0h0jH82DZiFnA.png)\n\n## Lo que implica la cultura en las organizaciones\n\nEl concepto de cultura implica: estabilidad estructural, profundidad, extensión o amplitud e integración o modelado (patterning).\n\n### Estabilidad estructural\n\nCultura implica algún grado de estabilidad estructural en el grupo. Cuando decimos que algo es cultural implicamos que no sólo es compartido sino también estable porque define al grupo. Una vez alcanzado algún nivel de sentido de identidad grupal, *la identidad* pasa a ser nuestra mayor fuerza estabilizadora y no se cederá fácilmente. La cultura sobrevive incluso cuando los miembros de la organización se van. Cuesta cambiar la cultura puesto que los miembros del grupo valoran la estabilidad en tanto que provee significado y predictibilidad.\n\n### Profundidad\n\nCultura es la más profunda, normalmente inconsciente parte de un grupo y es por lo tanto menos tangible y menos visible. Desde este punto de vista, la mayoría de las categorías utilizadas para describir cultura pueden pensarse como manifestaciones de cultura. Notar que cuando algo está más profundamente incrustado eso también provee estabilidad.\n\n### Amplitud\n\nUna tercera característica de cultura es que una vez que se ha desarrollado, recubre todo el funcionamiento grupal. La cultura es penetrante y ejerce influencia en todos los aspectos ***sobre cómo***  una organización se maneja en torno a su actividad primaria, en sus diversos ambientes, y en sus operaciones internas. No todos los grupos tienen cultura en este sentido, pero el concepto connota que si nos referimos a *la cultura*  de un grupo, nos estamos refiriendo a todas sus operaciones. Es abarcante *la cultura*  de todos los quehaceres del grupo en cuestión, sus relaciones y su coherencia e internalidad.\n\n### Modelamiento o integración\n\nLa cuarta característica que se implica en cultura y que promueve la estabilidad es el modelamiento o integración de los elementos a un paradigma mayor o *“gestalt”*  que unifica los diversos elementos y reside siempre, como tal, en un nivel más profundo. Cultura implica que fenómenos como rituales, clima, valores y conductas conjugan en su totalidad a un todo coherente, y este **patrón o integración**  es la esencia de qué queremos decir por *cultura* . Estas macro-consistencias derivan en términos últimos de nuestra necesidad humana de volver nuestro ambiente lo mas racional — que nos haga sentido — y ordenado posible. El desorden o el sin-sentido están entre las mayores fuentes posibles de ansiedad, así que de manera espontánea nos esforzaremos mucho en producir una visión de como las cosas se vuelven predecibles y de como deberían ser. Así “las culturas organizacionales, como otras culturas, se desarrollan mientras grupos de personas luchan por hacer sentido y se las arreglan con sus mundos”.\n![Medium-Image](/blog/images/posts/1*Jnuh3pge7w3K6QywzkpD0A.png)\n\n## Niveles de la cultura en las organizaciones\n\nDistinguimos tres niveles de existencia cultural en una organización: artefactos, valores inscritos y supuestos básicos.\n![Medium-Image](/blog/images/posts/1*J_kvXEzDynSSlczLAqEh7A.png)\n\n### Artefactos\n\nEstos están en **el nivel más palpable** , son los usos y fenómenos visibles de la cultura. En qué piso está la gerencia, puestos reservados o libres, oficinas cerradas para gerencia o todos en espacio común, como se distribuyen el uso del edificio de la organización — función de los espacios — , grado de informalidad en el trato, cordialidad y trato, estructuras de las salas de reuniones, cualidades de acceso a cada quién, proximidad estructural (vía remota y/o presencial), las llamadas las contesta siempre una persona en especial.\n\nTodo artefacto cultural en su estatuto de cosa logra tener un sentido y rol en la persistencia de los patrones culturales de la organización y opera estando ahí porque *hace sentido que ahí esté y del modo en que está.*  Usualmente este nivel cultural es el que más revela sobre las condiciones del poder y de los modos de organizar el trabajo en cualquier organización.\n- **Ejemplo:** Todas las reuniones ocurren en la misma sala, especialmente las semanales. Es una sala transparente pero fría. En general hay dos puestos reservados para los gerentes quienes dirigen desde sus asientos los contenidos de la reunión”. El artefacto en este caso es la sala de reunión con todas las características perceptibles de la misma, incluida la frialdad, la disposición de las sillas, y muchas otras características que informan nuestra sensibilidad y percepción de la situación.\n\n### Valores inscritos\n\nValores inscritos como **centrales de la cultura**  organizacional. Este nivel es de interés en cualquier cultura organizacional pero no termina su historia en la mera declaración de los valores, ese es sólo el comienzo. Las culturas admiten relaciones complejas con los mismos, incluido el traicionarlos sin decirlo abiertamente, generando modos mal-sanos y auto-contradictorios al interior de las culturas organizacionales.\n\nEl valor inscrito que es de interés como nivel cultural no es otro sino la dinámica desplegada desde la declaración del mismo por parte de una cultura organizacional.\n- **A modo de ejemplo:** Los valores inscritos en Doist son *“Today, and always, Doist stands for inclusivity, open-mindedness, and diversity”.*  Por tanto inclusividad, mentalidad abierta y diversidad se configuran como valores inscritos por la cultura de Doist gobernando expectativas de trato, contratación y modos de operar al interior de la organización, determinando contenidos de trato, comunicación, contratación y perfilamiento en torno a las desiciones de los miembros de la organización. ¿Qué otra cosa significará la inscripción de estos valores en la organización?, no tendremos cómo saberlo a menos que trabajásemos allá o fuesen objeto de consultoría de parte nuestra, sin embargo sabemos que los cambios globales de las condiciones del capitalismo internacional ha llegado a incentivar en las organizaciones y su liderazgo una cierta honestidad en su manera de llevar adelante sus asuntos, y eso nos permite asumir, al menos, que es un intento real la inscripción en estos valores. Al ser una organización remota, sus comunicaciones son objeto permanente de perfeccionamiento como nos podemos enterar a través de sus comentarios públicos (blogs, charlas) donde relatan como han generado ciertas prácticas que facilitan la inclusividad y la diversidad al remover el lenguaje hostil o discriminatorio, solicitando de todos que participen en promover un cuidar el espacio común y cuiden como hablan al compartir con otros.\n- Dejémonos llevar por una suposición ahora, donde asumamos que uno de los líderes de área en Doist simplemente no cree que ninguno de estos valores sean ciertos, tengan peso específico, tengan alguna importancia. Para los efectos de nuestro razonamiento, da lo mismo porqué esto podría ser así. Asumamos un problema de contratación. Esa persona permanentemente ejercerá una doble estructura con sus subalternos donde les solicitará, sin decirlo explícitamente, que superficialmente se adapten a la forma de “inclusión, diversidad, mentalidad abierta”, pero que internamente resistan estas ideas al no respetarlas entre ellos, en el diálogo interno. El valor inscrito entonces opera, realmente en esta sección de la organización, como una invitación al engaño y no como dice ser, a la inclusión.\n- Hemos de ver, entonces, que las consecuencias culturales se despliegan desde las prácticas efectivas y no desde declarar valores como algo en si mismo. Entonces, prácticas como dejar todas las comunicaciones esencialmente públicas son una forma de llevar adelante estos valores.\n\n### Supuestos básicos\n\nLos supuestos básicos **corresponden al nivel mas profundo de la cultura**  de una organización o grupo, son fuertemente implícitos más que explícitos, sus orígenes están en desarrollar soluciones a problemas consistentes en el tiempo las cuales comienzan como hipótesis, pero **gradualmente llegan a tratarse como realidades** . Tienden a ser no-confrontables y no-debatibles, y cambiarlas genera grandes cantidades de ansiedad. Este es el nivel de convicciones fuertes, normalmente irracionales y no necesariamente relacionadas directamente con el quehacer.\n- **Ejemplo: La mujer no es buena CEO.** La creencia que una mujer no es buen CEO es cultural en el sentido que se ejerce como un supuesto básico en las toma de decisión de contratación independiente de las competencias, es un prejuicio por lo tanto, y por otro, no es claro el camino para derribar ese supuesto en los grupos relevantes de poder en torno al juicio que implica la creencia. No es debatible en tanto que todas las mujeres que han sido buenas CEO nacional e internacionalmente no parece ser evidencia suficiente y no es confrontable puesto que justamente pareciese ser que lo único que puede pasar es que suficientes mujeres sean exitosas finalmente imponiendo que es un supuesto falso.\n\nMas que tolerar fuertes grados de ansiedad buscando alterar nuestros supuestos básicos (aprendiendo y cambiando), tendemos a percibir los eventos que nos rodean como congruentes con los supuestos básicos que ya tenemos, incluso cuando esto implica distorsionar, negar, proyectar u otras formas de falsificar lo que ocurre en torno a nosotros. Es en este proceso psicológico en donde la cultura ostenta su poder mayor.\n- **Ejemplo común:** Hay miles de situaciones, emociones y pensamientos que en cualquier organización simplemente no se comunican porque ya se ha instalado cuales son las perspectivas hegemónicas. Estas perspectivas están allí puesto que se ha instalado lo que es tolerable y lo que simplemente no será escuchado ni incorporado. Esto es algo que todos hemos vivido en grupos y organizaciones en las que hemos participado. Pequeño comentario al pasar, esta es la razón por la cual si es relevante acordar en las organizaciones los procesos y roles, más que los contenidos como tales.\n\nDesde los usos culturales **el escenario más probable es no ver aquello que contradice lo que supones de base**  que está allí, incluso frente a grotesca, palpable y ruidosa evidencia. Estamos diciendo que lo más probable en un grupo u organización es que los líderes asuman que todos comparten su punto de vista en cómo se sienten, viven y piensan en torno al trabajo, la participación en la organización y la valoración de los eventos.\n- **Ejemplo: “El valor está en el entregable”.** Si el líder o grupo de líderes cree, ejemplo común en Chile, que sólo lo *entregable*  tiene valor real la *pedida*  vendrá asociada a *presionar*  por el entregable (generando dinámicas conocidas por todos nosotros: plazos por sobre calidad, presión por conseguir resultados en el corto plazo relegando la calidad o agregando presión, falta de expectativas conocidas y razonables en torno a calidad y plazos, preferencia de forma por sobre el fondo en el trabajo), generando vicios conocidos en la organización donde se conoce que presionar por la entrega incentiva la mentira y el engaño en las organizaciones (sólo tener procesos sanos podrán salvarte de esto). En este caso particular donde encontramos que la propia cultura incentiva a la mentira, podemos reconocer un escenario común donde el liderazgo cultural queda ciego frente a los eventos que transcurren en su organización, quizá al punto de genuinamente no saber qué ocurre.\n\nMucho de este nivel cultural, que como decimos, es parte de la dinámica de las organizaciones, describe como llegamos al hoy en Chile y ha sido como, en un porcentaje bastante alto, lo que ha ocurrido al interior de las organizaciones laborales ha acumulado y producido altísimos niveles de malestar, enfermedad y descontento y pasado que no ha sido visto ni tomado como tal: malestar, enfermedad, descontento. Desde este punto de vista, lo último a ser tomado desde la cultura y desde los líderes de las culturas (a menos que activamente hagan lo contrario) es la contradicción de sus supuestos básicos puesto que de hacerlo, trae el fantasma ansioso de arriesgar la sobrevida de la organización. **Incluso cuando en el mundo actual existe conocida evidencia de que la integración del cambio en la organizaciones es de importante salud para sus miembros y genera fuertes beneficios de sobervida en las organizaciones.**\n\nLa cultura como un set de supuestos básicos nos define a qué poner atención, qué significan los eventos, cómo reaccionar emocionalmente a lo que ocurra y qué acciones tomar en diversas situaciones. Una vez que hemos integrado un set consistente de supuestos básicos — un “mapa mental” o un “imaginario” — estaremos máximamente cómodos con quienes compartan el mismo set de supuestos básicos, muy incómodos y vulnerables en situaciones donde esto no sea así, puesto que o no entenderemos lo que pasa (no descodificaremos el escenario social y sus significados por lo que son) o peor, interpretaremos mal y percibiremos mal las acciones de otros, normalmente atribuyendo intenciones negativas y efectos dañinos a aquellos que no podemos comprender por no compartir supuestos básicos con ellos.\n\nLos últimos en tomar en consideración el malestar, la disidencia, la forma nueva, lo divergente y lo nuevo serán **los actores cuyo incentivo más fuerte, directo o indirecto está en que la situación se mantenga como está actualmente** . En ese sentido, una paradoja del liderazgo desde el punto de vista cultural es que el poder una vez establecido querrá que sus formas productivas se mantengan, que induzcan a la estabilidad al costo del cambio y posibles mejores maneras de llevar adelante los propósitos y fines de una organización. El conciliar sostener la apertura e integrar que una de las funciones del liderazgo moderno está en dispensar dignidad, poder, autoridad, autonomía y reconocimiento es un arte escaso en nuestro país, pero necesario a incorporar.\n\n## Finalmente\n\nDesde el mundo del trabajo los ejemplos de lo que ahora decimos son miles y la gran mayoría de los que podemos pensar está a la fecha actual en la calle y marchando en Chile. Basta con escucharlos. Detrás de mucho malestar hay miles, quizá millones, de personas que activamente no están siendo incluidas ni escuchadas en sus lugares de trabajo y, conociendo que hay mejores posibilidades que lo actual en la mayoría de los casos, la negativa a negociar mejorías en las condiciones ha cristalizado una desconexión notoria desde el gobierno hacia abajo en nuestro país. Ha fracturado el país, generando una herida en el tejido social. Estas condiciones no son obvias a cambiar, pero la clave estará en culturas promotoras de reconocimiento, con caminos a mejores sueldos y mejores condiciones de trabajo (y de vida). Estas serán las culturas más atractivas y serán competentes en mejorar las condiciones país para todos nosotros que trabajamos en Chile.\n\nGracias a Gaspar y Fabián Acuña Hernández por este artículo.-&quot;]}],[0,{&quot;slug&quot;:[0,&quot;curso-9punto5-lidera-tu-carrera&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Curso 9punto5: Lidera tu carrera&quot;],&quot;description&quot;:[0,&quot;¡Lidera tu carrera! 9punto5 te ofrece un curso, comunidad y consultoría personalizada para impulsar tu desarrollo profesional. Aprende a tomar decisiones, crear un plan y avanzar en tu carrera de forma sostenible. ¡Cupos limitados!&quot;],&quot;date&quot;:[3,&quot;2023-11-19T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/lidera-tu-carrera.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Cursos&quot;],[0,&quot;Desarrollo de carrera&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Seguro has visto como en los últimos años el trabajo nos enfrenta a desafíos cada vez más complejos.\n\nHoy tenemos que desenvolvernos en entornos inciertos y nuestros resultados más de una vez dependen de factores que no podemos predecir o controlar plenamente. Algo que puede resultar abrumador.\n\nPor eso, **¡hoy tenemos una noticia emocionante!**\n\nEl aprendizaje acumulado durante años de 9punto5 nos llevó preparar una experiencia de aprendizaje que te ayude a **liderar tu carrera.**\n\nConsiste en **un curso, una comunidad y consultoría uno a uno** para que logres moverte con más fluidez en medio de esta complejidad, ganar control y predictibilidad, ayudándote a definir tus siguientes pasos profesionales con mayor claridad.\n\n- Tendrás aprendizaje para una sana toma de decisiones\n- Crearás un plan que se adapte a tus objetivos\n- Podrás acceder a un espacio seguro para la reflexión y el análisis de tu carrera y tu contexto\n\nAl participar del curso y la comunidad:\n- Sabrás cómo moverte en la complejidad\n- Entenderás por qué y cómo construir tu identidad, relato y autoridad\n- Ganarás visión estratégica y práctica sobre los temas que moldean tu carrera (y que no siempre se discuten abiertamente)\n- Tendrás herramientas para crecer en tu carrera de forma sostenible\n\nEn este lanzamiento hemos abierto **solo 25 cupos**. Así que aprovecha el fin de semana para revisar nuestra invitación y unirte al curso y comunidad:\n\n[Cómo liderar tu carrera hacia el alto rendimiento de forma sostenible](https://curso.9punto5.cl/).\n\nSerá una excelente manera de cerrar el año y prepárate para el próximo.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;curso-productividad&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Primera edición curso de productividad, 1er trimestre 2023&quot;],&quot;description&quot;:[0,&quot;Curso de productividad de 9punto5: sesiones en vivo y grabadas para aprender a fijar objetivos, medir resultados y mejorar tu eficiencia. Cupos limitados.&quot;],&quot;date&quot;:[3,&quot;2023-01-20T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/curso-productividad.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Productividad&quot;],[0,&quot;Cursos&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Serán 3 sesiones de una hora y media, una vez por semana, en vivo y que además quedará grabado para que lo veas a tu ritmo.\n\nLa primera versión del curso será para máximo 20 personas y será necesario tener la membresía de 9punto5 para poder participar.\n\nHasta ahora, los temas en los que estoy trabajando son:\n\n- Cómo fijar objetivos que tengan sentido\n- Cómo proyectar escenarios para definir los supuestos claves (backcasting en vez de forecasting) y cómo priorizar las variables más importantes de tu plan de acción\n- Cómo identificar cuáles son los próximos pasos que necesitas dar para avanzar hacia tu objetivo\n- Medición de resultados para saber si estás avanzando\n- Cómo identificar riesgos\n- Cuándo necesitas efectividad y cuándo necesitas eficiencia\n- Las cuatro cosas que necesitas para ser productivo: tiempo, energía, atención y motivación.\n- Alinear tus tareas con tus niveles de energía\n- El trabajo en bloques\n- La diferencia entre el trabajo profundo y el trabajo superficial (deep work)\n- Productividad, descanso, recuperación y sueño\n- Diferencia entre hábitos, rutinas y rituales\n- La dirección del cambio: Hábitos basados en resultados VS hábitos basados en identidad.\n\nPodrás participar de este curso solo si tienes la membresía de 9punto5.\n\nSi te interesa participar regístrate ahora. 👇\n\n**Reserva tu cupo**: Si ya tienes tu membresía y tienes preguntas, por favor pregúntame en el Slack de la comunidad.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;desafios-lider-comunicacion&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Desafíos a resolver antes de poder comunicarte bien como líder&quot;],&quot;description&quot;:[0,&quot;Un liderazgo claro mejora la alineación y satisfacción de los equipos.&quot;],&quot;date&quot;:[3,&quot;2023-02-07T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/comunicacion.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Liderazgo&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;La claridad es el factor más importante en el compromiso de los equipos de trabajo, o al menos eso es lo que encontró [un estudio de dos años](https://www.businessinsider.com/john-doerr-management-performance-theory-goals-2018-6) realizado por Deloitte que mostró que tener metas claras, compartidas abierta y regularmente es fundamental para la alineación y la satisfacción laboral.\n\nEsta es una de las razones por las que, cuando me preguntan sobre **la primera cosa a la que un equipo debe poner atención**, respondo que partan por la comunicación.\n\n**La forma en que se comunican los equipos es un buen predictor de lo que podrán lograr**. Y si estás en un rol de liderazgo, tu papel es protagónico en hacer que funcione.\n\nAunque los valores compartidos, la certeza psicológica, la empatía, los canales y herramientas, el ritmo de la comunicación y expresar ideas completas son parte del playbook que todo equipo necesita, hoy quiero hablar de cosas que están más a la base de lo que podrás hacer como líder.\n\nPero antes de ir a eso, sinceremos algo: aunque todo el mundo dirá que la buena comunicación es importante, es muy común que los problemas se escondan debajo de la alfombra. De hecho, hay culturas que castigan hablar de los problemas y desacuerdos, versus las que promueven hablar abiertamente de estos con el fin de resolverlos.\n\nTu tarea como líder es levantar la alfombra y enfrentar los temas. Para lo que **necesitas superar la incomodidad de tratar temas incómodos y aprender a comunicarte sin dañar las relaciones en tu equipo**.\n\nPasemos entonces a cuatro puntos sobre los que necesitas tomar definiciones, especialmente si estás en una posición de liderazgo.\n\n1. **Entender que tienes de base la cultura Latinoamericana**, donde es normal hablar con rodeos, usando un estilo de comunicación indirecto. Irse por las ramas. No decir lo que podría incomodar.\n2. **Por no querer proyectar una figura autoritaria, aportar a la confusión.** Esto pasa, por ejemplo, cuando para no tener conversaciones incómodas evitas hacer definiciones claras de procesos, o alinear a alguien que no está entiendo la forma de conducirse dentro de los equipos.\n3. **La improvisación tiene límites.** Los equipos que dependen de ti necesitan grados razonables de predictibilidad y claridad para saber cómo hacer su trabajo. Para saber qué significa un trabajo bien echo. Necesitan saber cómo jugar sin que la pelota caiga al vacío.\n4. Tienes que lograr **reconciliar tus propias contradicciones** con respecto a tu estilo de liderazgo. Necesitas moldear tu estilo de liderazgo hasta sentirte cómodo con el. Un líder siempre podrá evolucionar su forma de liderar, pero no es sano hacerlo varias veces durante una misma conversación.\n\nDe lo contrario seguiremos participando de conversaciones donde definiciones básicas (que deberían ser estables) van cambiando cada 5 minutos. Lo cual es de locos. 🤪&quot;]}],[0,{&quot;slug&quot;:[0,&quot;desarrolla-software-desde-valdivia-af69b71b1c77&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Desarrolla software desde Valdivia&quot;],&quot;description&quot;:[0,&quot;Descubre oportunidades de empleo remoto en Valdivia con 9punto5 y Zenta Group. Únete a un equipo innovador y desarrolla soluciones móviles desde cualquier lugar. ¡Postúlate ahora!&quot;],&quot;date&quot;:[3,&quot;2020-01-28T13:36:23.112Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/equipo-valdivia.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Oportunidades&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Empleo&quot;],[0,&quot;Trabajo remoto&quot;],[0,&quot;Zenta Group&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n&gt; Buscamos talentos para contratar. ¿Te animas?\n\nComenzamos 9PUNTO5 en 2016 (como idea el 2015). Una de las motivaciones que tuvimos desde el comienzo fue aportar a **crear nuevas oportunidades de trabajo, negocios, de crear redes** , y que estas cosas pasaran **fuera de los lugares que regularmente concentra las oportunidades**. Un problema que nosotros mismos teníamos  y tenemos.\n\nDesde la primera versión de la conferencia que hicimos, esto empezó a pasar y supimos a través del tiempo de diferentes personas que iniciaron conversaciones en la conferencia, que luego se transformaron en nuevos trabajos, negocios, incluso amistades. Algo que siguió pasando de forma, más o menos orgánica en todas las siguientes versiones de la conferencia.\n\nPor más de la mitad de su historia (2016 — 2018) 9PUNTO5 fue un proyecto paralelo (un *side project*  como dicen los gringos), al que en 2019 decidimos ponerle “pantalones largos” y que pasara a ser un proyecto con dedicación exclusiva. El año pasado aprendimos mucho, empezamos a trabajar con empresas para ayudarlas a desarrollar su cultura para el trabajo remoto y mejoramos varias cosas en la cuarta versión de la conferencia.\n\nPero las ganas de aportar a **crear nuevas oportunidades de empleo relacionadas a Trabajo Remoto**  partiendo por Chile nunca se nos pasaron. Así que por varios meses fuimos explorando formas de hacer que esto pasara. Y…\n\n## Equipo de desarrollo de software en Valdivia para Zenta Group\n\nComenzamos 2020 con una experiencia que nos alegra y es super concreta en esta dirección. Ayudaremos a **Zenta Group**  a crear **un primer equipo de cuatro personas** **que trabajará desde Valdivia, y funcionará como lo hacen los *“equipos distribuidos”*** . Hasta ahora la empresa no tenía operaciones en Valdivia (¡bien Zenta!).\n\nEstas **4 personas**  estarán orientadas al desarrollo de soluciones móviles. Estamos buscando 3 perfiles:\n\n**Java (Android) — Perfil Junior**\n- Conocimiento requerido: Java (Android)\n- Nivel de experiencia: Junior\n- Más información y postulación 👉 aquí\n\n**Java (Android) + Angular — Perfil Semi Senior**\n- Conocimiento requerido: Java (Android) + Angular\n- Nivel de experiencia: Mid\n- Más información y postulación 👉 aquí\n\n**Mobile Nativo — Perfil Senior**\n- Conocimiento requerido: Mobile Nativo\n- Nivel de experiencia: Senior\n- Más información y postulación👉 aquí\n\n### En qué trabajarás\n\nSerás parte de un equipo que trabajará al comienzo en un proyecto interno, desarrollando una aplicación móvil para iOS y Android. Luego de esto, el equipo comenzará a desarrollar soluciones de este mismo tipo para “clientes externos”, todo esto desde Valdivia.\n\nTendrás el desafío de aprender, probar y usar nuevos lenguajes, frameworks y metodologías, para que te mantengas al día con las nuevas tecnologías.\n\n### Trabajo Remoto\n\nEl piso de la relación será remoto en aspectos importantes, ya que la contraparte del equipo no estará en Valdivia. Lo que hace que estas interacciones, no tengan lo presencial como el estándar.\n\nCuando esto es así, la forma en que se representa el trabajo, como se da la comunicación, los procesos, la documentación, la forma en que se toman decisiones, las prácticas, las herramientas, etc., operan para un ambiente en que **los proyectos deben avanzar en la lógica del trabajo remoto** .\n\nSi te animas a ser parte de este equipo en Valdivia, además **podrás aprender o mejorar tus competencias para el trabajo remoto** . Proceso que guiaremos nosotros: 9PUNTO5.\n\nOtra cosa interesante es que esperamos que esta experiencia permita que, si así lo quieres, en el futuro puedas trabajar en la empresa sin importar el lugar donde estés. Es decir, 100% remoto.\n\n### Beneficios\n- Trabajar directamente para Zenta. Con todos sus beneficios incluidos (caja de compensación, seguro de salud, bonos de fiestas, acceso a convenios, etc.)\n- Esperamos que puedas seguir desarrollando tu carrera. Para esto podrás acceder a entrenamiento para certificación en GCP, AWS, ML y Agilidad entre otros. También podrás acceder a capacitaciones internas y a cursos de Coursera y Platzi.\n- Entrega de equipo de alta gama\n- Sin reglas de vestimenta estricta\n- Horario Flexible\n- Desayuno mensual para conectarte con el equipo\n- Costear viajes a Santiago cuando sea necesario\n- Trabajar en un Cowork, con sus beneficios internos (comunidad, actividades, cafetería, descuentos en servicios en Valdivia)\n\n## 📣 Corre la voz\n\nEsperamos que esta noticia ¡te guste tanto como a nosotros!. Si es así te pedimos que la compartas con tus amigos, conocidos, en tus redes sociales, que la imprimas y la pegues por tu ciudad (eso último no, muy poco sustentable).\n\n## ¿Quieres contratar Talento para Trabajar Remoto?\n\nSi quieres que te ayudemos a **hacer lo mismo en tu empresa** , pasa un mail a fabian@9punto5.cl y hablemos.\n\n### Talentuum\n\nEstamos haciendo esto en colaboración con los secos de Talentuum, un spin-off de Continuum que te recomendamos si quieres ayuda para contratar Talento TI. Si quieres información, el mail es talentuum@continuum.cl.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;descubre-la-semana-valdivia-de-9punto5-3f934f46254c&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Descubre la &#39;Semana Valdiviana&#39; de 9punto5&quot;],&quot;description&quot;:[0,&quot;Hemos creado un nuevo ticket llamado &#39;Semana Valdiviana&#39; para que disfrutes la ciudad durante tu visita a la conferencia.&quot;],&quot;date&quot;:[3,&quot;2019-07-24T02:58:07.291Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/punucapa.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fran-daforno&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Valdivia&quot;],[0,&quot;Semana Valdiviana&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n## ¿Qué pasaría si te invitamos a pasar más días en nuestra ciudad?\n\nValdivia es bakán, lo creo firmemente y lo ratifico cada vez que hablo con algún turista, nacional e internacional. Por eso, este año nos cuestionamos.\n\nPorque si vienes solo 3 días a la conferencia, vas a poder conocer más de su ambiente nocturno, pero poco de la ciudad y sus alrededores.\n![Medium-Image](/blog/images/posts/1*1jR3ol9AmZlZnyoEtsBc8Q.png)\n\nPor eso hemos creado un nuevo ticket llamado **“Semana Valdiviana”.** *No es la semana de Febrero* , no tendremos barcos decoradores paseando por el río, pero te ofrecemos otras actividades para que disfrutes su cerveza, río y más.\n\nInteresante… cuéntame más! ¿En qué consiste? Obvio, nuestra Semana Valdiviana 9punto5 contempla:\n- **Ticket VIP de 9punto5** , que te da acceso al Green Carpet y a los 2 días de la conferencia.\n- **1 excursión de medio día**  a la Reserva Punta Curiñanco *(1)*  o una tarde recreativa en Punucapa *(2)* .\n- **1 Cata de cervezas artesanales** *(3)* .\n- **5 noches de alojamiento**  en Hotel Villa del Río *(5)* .\n![Medium-Image](/blog/images/posts/1*AqI-ZMcvkodewusqdjG2Ow.jpeg)\n\nSi estás pensando que está genial, pero también debes trabajar en algún momento, sobretodo si te están dando permiso para experimentar estar remoto, pensamos en esto, también tendrás:\n- **Acceso libre por 4 días al cowork**  más antiguo de Chile en regiones: Nube.\n\nSi te parece que esta demasiado bueno para vivirlo “solo”, tenemos opciones 🤙🏻.\n\n¡No te pierdas esta oportunidad! \n¡Quiero mi ticket Semana Valdiviana 9punto5 ***AHORA*** !\n\nSi tienes cualquier duda, escríbeme a fran@9punto5.cl\n![Medium-Image](/blog/images/posts/1*aQkdDYER0V-FjxPt3Hv6oA.jpeg)\n\n### (1) Reserva Punta Curiñanco\n\nPartimos desde Valdivia hacia la localidad costera Curiñanco en donde visitaremos la “Reserva Punta Curiñanco”. \nEn ésta se realiza una caminata interpretativa con guía local, quien relata sobre conciencia ambiental, buenas prácticas en áreas silvestres protegidas, también sobre la comunidad Lafkenche del sector y la importancia del Bosque de los Olivillos. El visitante podrá aprender sobre especies de flora y avifauna que habitan en la Selva Valdiviana.\nIncluye:\n- Servicio transfer (recogida en punto de partida a convenir)\n- Guía local (certificado en WFR)\n- Snack con productos locales\n- Almuerzo en sector Curiñanco\n- Entrada a la reserva\n- Duración: 7 horas\n\n### (2) Tarde en Punucapa.\n\nDescubre nuevos sabores y disfruta de la naturaleza. \nNavega por el Santuario de la naturaleza y llega a la localidad de Punucapa, zona característica por su sidra, visita a la Iglesia Santuario de la Candelaria, construida en 1882, también conoceremos el Molino Artesanal de Sidra Fredericksen y para no pasar hambre hay un restaurant en el corazón de Punucapa mega acogedor, te querrás quedar en Puncapa más tiempo.\nIncluye:\n- Servicio de traslado a Punucapa por el río (punto de partida a convenir. Navegación sujeto a condiciones climáticas, de lo contrario el traslado es por tierra).\n- Recepción y traslado desde el muelle de Punucapa a las instalaciones con caminata por el poblado.\n- Guía local.\n- Almuerzo en restaurant *Cocina del Bosque* *,* con tiempo para disfrutar sus dependencias, caminando por el bosque, visitando el muelle, jugando taca taca o simplemente admirando su vista.\n- Duración: 7 horas\n\n### (3) Cata de cervezas artesanales.\n\nMetodología: teórica — práctica por medio de ejercicios sensoriales.\nDuración: 90 minutos. Contenido:\n- Historia de la cerveza\n- Origen de estilos. Familias de cerveza\n- Introducción al análisis sensorial: vista, olfato, gusto. — Sabores básicos -Percepciones.\n- Ejercicios en tres momentos (pruebas con cervezas) escuela alemana, escuela inglesa, escuela americana.\n\n### **(4) Trabaja remoto** \n\nTrabaja todo lo que necesites desde el cowork Nube, el primer espacio de este tipo en Chile fuera de la capital. Además encontrarás en sus dependencias a Café Raíces, donde tendrás la opción de probar sus deliciosas opciones de desayuno.\n\n### (5) 6 días y 5 noches\n\nAloja en el hotel 4 estrellas, Villa del Río. Son 5 noches de alojamiento en el mismo lugar de la conferencia. Incluye desayuno buffet.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;descuentos-en-alojamientos-y-comercio-e0f9448c9e82&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Descuentos en alojamientos y comercio 9punto5&quot;],&quot;description&quot;:[0,&quot;Descuentos exclusivos en alojamientos, comercios y coworking para asistentes a 9punto5. Disfruta Valdivia con beneficios únicos.&quot;],&quot;date&quot;:[3,&quot;2019-08-16T02:58:07.291Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/villa-del-rio.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;sandra-cartagena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;9punto5&quot;],[0,&quot;Descuentos&quot;],[0,&quot;Valdivia&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nEn las oficinas de Nube Cowork, donde funciona el centro de operaciones de 9punto5, ya se siente en el ambiente que estamos a días y casi horas de la cuarta versión de la conferencia.\n\n&lt;figure&gt;\n    &lt;img src=\&quot;/blog/images/posts/precios-01.gif\&quot; alt=\&quot;\&quot; /&gt;\n    &lt;figcaption&gt;Estamos súper tranqui…&lt;/figcaption&gt;\n&lt;/figure&gt;\n\nEl propósito de cada año es hacer la experiencia de nuestros asistentes y expositores lo más agradable posible.\n\n![Medium-Image](/blog/images/posts/precios-02.gif)\n\nY cómo no íbamos a ponernos en los zapatos de quienes vienen desde fuera de Valdivia a disfrutar de esos días de charlas, talleres y reclutamiento de talento, si 9punto5 ha crecido hasta convertirse en un panorama anual para turistas con intereses en tendencias tecnológicas y negocios.\n\nPara eso hemos hecho algunas alianzas que pasamos a contarles a continuación:\n![Medium-Image](/blog/images/posts/precios-03.webp)\n\n&gt; ¿Eres de fuera de Valdivia? Cross check y reportar.✈️ Ajústese el cinturón y échele una mirada a los descuentos que tenemos gracias a la colaboración de los siguientes lugares para alojamiento en nuestra muy noble y muy leal Santa María, la Blanca de Valdivia:\n\n&lt;figure&gt;\n    &lt;img src=\&quot;/blog/images/posts/precios-04.webp\&quot; alt=\&quot;\&quot; /&gt;\n    &lt;figcaption&gt;Vista desde el Puente Pedro de Valdivia.&lt;/figcaption&gt;\n&lt;/figure&gt;\n\nRecreación en el Fuerte Niebla:\n![Medium-Image](/blog/images/posts/precios-05.webp)\n\n**Todos estos hoteles y apart hoteles tienen descuento para las y los asistentes a la conferencia. Solo deben mencionar que vienen a 9punto5.**\n\nEl [Hotel Villa del Río](http://www.hotelvilladelrio.com/) nos recibirá por segundo año consecutivo. Si tu opción es alojar aquí, tienes un descuento especial por asistir.\n\n**Hotel Villa del Río:**\n![Medium-Image](/blog/images/posts/precios-06.webp)\n\n**El Hotel y Departamentos [El Castillo de Niebla](https://www.hotelycabanaselcastillo.com/):**\n\n![Medium-Image](/blog/images/posts/precios-07.webp)\n\n**Departamento El Castillo de Niebla**\n![Medium-Image](/blog/images/posts/precios-08.webp)\n\n**Hotel Melillanca**\n![Medium-Image](/blog/images/posts/precios-09.webp)\n\nIncluyen desayuno buffet servido en restaurante desde las 07.15 a 10.00 hrs.\nEl horario del check in es a las 15.00 hrs y check out a las 11.00 hrs.\nApart Hotel Río Cruces\n\n**[Apart Hotel Río Cruces](https://www.aparthotelriocruces.cl/)**\n![Medium-Image](/blog/images/posts/precios-10.webp)\n\n&gt; ¿Eres de Valdivia? Choca esos cinco (XD) No creas que nos olvidamos de nuestros coterráneos. Los descuentos no son solamente de alojamiento, así que toma nota:\n\n![Medium-Image](/blog/images/posts/precios-11.gif)\n\n## ¡Cervezas, chocolate, cowork, wiiiiiiii!\n\n[Chocolatería Entrelagos](http://www.entrelagos.cl/valdivia/) se suma a 9punto5 con un 20% y 15% de descuento en sus productos, pagando con efectivo y tarjeta respectivamente. Solo debes presentar tu credencial.\n![Medium-Image](/blog/images/posts/precios-12.webp)\n\nPorque sabemos que el chocolate les puede dar sed, o la conferencia les puede dar sed, o simplemente siempre tienen sed, [Kunstmann Kneipe](http://www.cerveza-kunstmann.cl/la-cerveceria/kunstmann-kneipe/) Valdivia también se puso con un 10% de descuento en el total del consumo.\n\n![Medium-Image](/blog/images/posts/precios-13.webp)\n\n[Roasty](https://www.facebook.com/Roastycafe/) ☕️ también tendrá un 10% de descuento en el consumo (no incluye promociones)\n![Medium-Image](/blog/images/posts/precios-14.webp)\n\nPero no todo en la vida es carrete, niñitos, también hay que trabajar 💻 y Nube Cowork tiene un 50% de descuento valor lista por día cowork y un 20% de descuento en el uso de la sala de reuniones para ustedes presentando su credencial. Mejor no se saquen más la credencial hasta que termine el evento 😆\n\nCafé Raíces:\n![Medium-Image](/blog/images/posts/precios-15.webp)\n\nCowork:\n\n![Medium-Image](/blog/images/posts/precios-16.webp)\n![Medium-Image](/blog/images/posts/precios-17.webp)\n\nAsí que ésas les teníamos. Seguimos trabajando para mejorar sus experiencias y que 9punto5 sea una conferencia inolvidable como cada año.\n\nPara la gente que está en las filas de atrás y no ha comprado su ticket: https://www.9punto5.cl/tickets.\n\nCualquier consulta o duda, aquí estamos.\n\nBesito, besito, chau chau.\n\n![Medium-Image](/blog/images/posts/precios-18.gif)\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;diferentes-modalidades-en-el-trabajo-remoto-4363ba5af5be&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Diferentes modalidades en el Trabajo Remoto&quot;],&quot;description&quot;:[0,&quot;Si estás buscando trabajar de forma remota o si quieres implementarlo en tu empresa esta es una descripción breve de las diferentes formas en que se da el trabajo remoto&quot;],&quot;date&quot;:[3,&quot;2020-01-23T15:07:06.284Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/modalidades.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Cultura&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Cultura organizacional&quot;],[0,&quot;Trabajo remoto&quot;],[0,&quot;Trabajo distribuido&quot;],[0,&quot;Trabajo hibrido&quot;],[0,&quot;Home office&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;**Hablemos de las diferentes modalidades de trabajo remoto y de un caso que no es trabajo remoto**\n\nSi estás buscando trabajar de forma remota o si quieres implementarlo en tu empresa, esta es una lista breve de las diferentes maneras en que se da el trabajo remoto.\n\n## 100 % remoto\nAquí todos los empleados trabajan en esta modalidad. Incluso puede pasar que no exista oficina física en ningún lugar, aunque también hay empresas que sí tienen una oficina o un espacio en un cowork. Pero ir a trabajar presencialmente es completa y totalmente opcional y no hace ninguna diferencia para las personas ir o no a las oficinas. Y esto es así para los distintos niveles jerárquicos de la organización.\n\nEsto quiere decir que la empresa está optimizada para operar en remoto. La comunicación, el acceso a la información, la toma de decisiones, las reuniones, los anuncios y actualizaciones, etc. Todo ocurre en remoto.\n\nAdemás, vale destacar que una cultura de trabajo remoto se pone a prueba en temas de acceso a información, en la distribución de la autoridad y las decisiones, en qué cosas inciden en que alguien obtenga una promoción de puesto. En una empresa con una cultura de trabajo remoto sólida, no existen \&quot;ciudadanías diferentes\&quot;, es decir, no hay distinción entre quienes trabajan en la oficina y quienes no.\n\n&gt; En una empresa con una cultura de trabajo remoto sólida, no existen ciudadanías diferentes, es decir, no hay distinción entre quienes trabajan en la oficina y quienes no.\n\n## Equipos distribuidos\n100 % remoto y trabajar de forma distribuida pueden ser sinónimos. \n\nAcá hay un énfasis en que los equipos operan de manera distribuida, sin una ubicación centrali
