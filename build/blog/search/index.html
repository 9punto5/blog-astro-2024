aron. Creo que esta comunidad y el conocimiento deben expandirse, profundizarse y distribuirse. Alguien dijo por ahí “cuando llegas a 9punto5 sientes que te están ayudando y a la vez, el deber de seguir ayudando a más personas”. Energía revitalizante, reparadora y movilizante.\n\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;postula-a-ser-charlista-en-9punto5-v-2018-71530d28b7f4&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Postula a ser charlista | 9punto5 2018&quot;],&quot;description&quot;:[0,&quot;Estamos buscando speakers que se tomen el escenario de 9punto5 para compartir su historia — y nos encantaría que fueras tu. Este año, queremos enfocarnos en experiencias de equipos con culturas de…&quot;],&quot;date&quot;:[3,&quot;2018-03-29T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/1_YSyrBYMJwcI2HIF2kZz1pg.jpg&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Speaker&quot;],[0,&quot;Charlista&quot;],[0,&quot;CFP&quot;],[0,&quot;Convocatoria&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n¿Quieres contarnos tu historia?\n\nEstamos buscando speakers que se tomen el escenario de 9punto5 para compartir su historia — y nos encantaría que fueras tu.\n\nLa versión 2018 de 9punto5 será el 7 y 8 de Septiembre en Hotel Villa del Río en Valdivia, Chile.\n\n## ¿Qué necesitas saber?\n\n### Temas\n\nEste año, queremos enfocarnos en experiencias de equipos con culturas de trabajo incipientes e innovadoras. **Nos interesa exponer casos donde se hayan implementado políticas de trabajo relacionadas a la felicidad y productividad del empleado.**\n\nTambién, como el desarrollo de un producto o servicio se ha visto impactado positivamente por la cultura de trabajo de tu empresa. Por último, experiencias de trabajo remoto en ámbitos no digitales (leyes, medicina, aviación, construcción, etc.).\n\nNos interesan personas críticas, disruptivas y/o conscientes respecto a las actuales culturas de trabajo en Chile y Latinoamérica. Que puedan exponer alternativas, casos de éxito y fallo en su experiencia laboral. Y que demuestren pasión y compromiso con el tema que están hablando.\n\n### Audiencia\n\nLos asistentes de 9punto5 están buscando mejorar sus habilidades blandas para adaptarse a nuevas culturas laborales y economías de trabajo a escala. La audiencia varía desde startups que desean confirmar sus culturas flexibles, hasta empresas de mediano y gran tamaño, que buscan innovar y complementar sus actuales prácticas laborales en sus empleados. Para el número de asistentes, espera algo cercano a 450 personas.\n\n## Estructura\n\nEstamos buscando postulaciones de dos tipos. Primero, una charla de 20 minutos (presentación más preguntas). Este es el formato más estándar. Por otro lado, habrá un bloque de “lightning talks”. Cada una de estas dura 5 minutos.\n\n### Consideraciones\n- Si eres seleccionado para la charla, obtendrás un ticket gratuito de acceso a los dos días del evento. Si eres seleccionado para una “lightning talk”, deberás adquirir un ticket.\n- El equipo de 9punto5 será responsable de elegir las charlas.\n- Para las “lightning talks”, habrá un sistema de votación abierto comenzando en el mes de Junio 2018. Para obtener más votaciones, no te olvides de incluir un video ;)\n- Puedes realizar múltiples postulaciones para los distintos formatos.\n- **La fecha límite para las postulaciones es el día 25 de Mayo de 2018. Publicaremos resultados el 14 de Junio de 2018.**\n- No postules el último día. Date unos días para trabajar en la postulación. Te ayudaremos si tu postulación tiene problemas, pero esto es solo posible si nos envías la propuesta con días de anticipación.\n\n**Ahora que lo sabes todo…**\n¿Estás listo para postular? Ingresa acá para enviarnos tu propuesta.\n\n¡Mucha suerte! (y nos vemos en Septiembre)\n\n*Comenzamos la* *venta de tickets* *para 9punto5 2018. Aprovecha la venta en blanco y un descuento que no se volverá a repetir, para tickets generales, VIP y valdiviano.*\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;quc3a9-le-falta-a-valdivia-para-ser-un-hotspot-de-trabajo-remoto-c506630ced63&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¿Qué le falta a Valdivia para ser un hotspot de trabajo remoto?&quot;],&quot;description&quot;:[0,&quot;Nuestro podcast, debutando el 21 de febrero, explora la experiencia de visitantes en eventos como “9punto5”. Analizamos desafíos logísticos y proponemos soluciones para mejorar Valdivia como destino para el trabajo remoto.&quot;],&quot;date&quot;:[3,&quot;2017-02-14T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/event-support.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;],[0,&quot;Valdivia&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Hace unos días grabábamos junto a parte del team organizador el tercer episodio de nuestro nuevo podcast, el cual debutará el 21 de febrero. Se armó una conversación bien interesante.\n\nEl tema era “Experiencia para visitantes”, el cual por sus diversas implicancias decidimos dividir en varios episodios, ya que creemos que precisamente es la experiencia de nuestro público, como también la de nuestros speakers, lo más importante a la hora de levantar un evento de las características de “9punto5”.\n\nDentro de esa reflexión, que implicaba conversar a calzón quitado sobre qué hicimos bien y qué nos falta para que la actividad sea realmente una experiencia de talla mundial, revisamos desde nuestra higiene personal hasta las condiciones que Valdivia ofrece como ciudad turística. Como comprenderán, la lejanía con la capital y esa chapa de ciudad terremoteada, lluviosa y alemanoide conservadora nos puso a divagar, siempre de la manera más constructiva por supuesto.\n\nLa cosa es que sin mucho pensar llegamos a 3 grandes necesidades, siempre buscando los must a la hora de producir un evento grande, pero también de poder llamarnos -con todas las de la ley- un hotspot para el trabajo remoto. Porque claro, no podemos abusar únicamente del tremendo entorno natural, del capital humano y de la infraestructura tecnológica que tenemos (si, aquí el internet funciona bacán), también hay que mejorar la conectividad, sacudirnos la burocracia centralista y exigir más y mejores espacios para reuniones sociales de carácter masivo.\n\n## 1.- “Voy a Valdivia: mi bus llega a las 07:00 a.m ¿Me esperai con desayuno?”\n\n![bus](/blog/images/posts/bus.webp)\n&gt; ¿Valdivia y Trabajo Remoto?\n\nUna de los grandes inconvenientes a la hora de viajar desde Santiago hacia Valdivia es el horario del famoso Aeropuerto Pichoy, lo cual obliga muchas a veces a que la gente opte por llegar a Temuco o Puerto Montt. \n\nSi a los itinerarios que ya son bien extraños y que, por ejemplo, no te permiten viajar por el día Santiago — Valdivia en avión ida y vuelta, le sumamos que por clima en invierno nos podemos quedar fácilmente vistiendo santos sin lograr abordar nuestro avión, terminamos optando por los incómodos y caros buses, que entre las guaguas llorando, las paradas de noche y el olor del baño deberían incluir una interconsulta al psiquiatra junto con el pasaje. \n\nPor culpa de eso hay gente que decide no venir, siendo un lujo que no podemos permitirnos. Let’s do something!\n\n## 2.- “Todo bien con el auspicio, el gerente regional me dijo que en 3 meses avisan”\n![sponsor](/blog/images/posts/event-support.webp)\n\nSon pocas las empresas que poseen gerencia general o presidencia en Valdivia, sobre todo si se trata de cadenas nacionales o internacionales.\n\nSucede que, cuando nos acercamos con nuestro brochure, one pager y la mejor sonrisa a pedir auspicio (si es nos reciben) nos encontramos con que “todas las propuestas se envían a Santiago” y “aquí te podemos recibir pero más que eso…” y finalmente -para qué estamos con cosas- muchas veces nuestras carpetas nunca llegan a las manos indicadas y nos perdemos en la desdeñosa tierra de los mandos medios. \n\nExigimos mayor toma de decisiones en Valdivia, les aseguro que no se arrepentirán, sus empresas son importantes para nosotros, pero también ¡nosotros lo somos para ustedes!\n\n\n## 3.- “Viene mi banda favorita. Iré a verla ahí mismo donde tus abuelos celebraron bodas de oro”\n\nEste es un tema que me toca profundamente, porque algo pasa con los lugares en Valdivia (sin desmerecer a nadie) que hace que los eventos tengan **CERO** onda. Lo digo también desde la vereda de ser productora local, porque es bien fácil que todo lo que uno quiera armar termine pareciendo un matrimonio y nosotros no queremos eso. \n\nAunque me retracto, “9punto5” si está casado con el trabajo remoto, pero ustedes me entienden.\n\nA lo que voy es que en una ciudad cultural, con la cantidad de eventos de alta convocatoria de toda índole que se producen durante el año, deberíamos contar con un Teatro Cervantes perfectamente restaurado, un Teatro del Río y muchas salas multipropósito, con la acústica adecuada y la **ONDA** necesaria para generar puestas en escena atractivas y mucho drama, porque la producción finalmente es eso, drama, escenografía, cabeza volcada en generar una experiencia sensorial que te haga sentir en un espacio único, no en las bodas de oro de tus abuelos, o de Kenita Larraín.\n\n**Ojo**: no todo es queja. **Finalmente, fuimos nosotros quienes decidimos hacer el evento en esta región hermosa y no en Santiago porque creemos en el potencial existe**. De hecho, muchos de nosotros quiere vivir el resto de su vida en Valdivia, lo cual me parece una locura, pero nadie dijo que estábamos bien de la cabeza.\n\nSea como sea, no podemos dejar de interpelar a nuestros lectores y sobre todo (esperamos) que dentro de ese grupo de seguidores que nos lee y escuchará semana a semana el podcast, se encuentren también autoridades capaces de tomar decisiones importantes.\n\nCon orgullo podemos decir que nosotros desde el mundo privado nos hemos levantado como un movimiento con una profunda vocación de servicio público, ya que dentro de nuestros lineamientos nos destacamos por un sueño común de mejor ciudad y condiciones dignas para los trabajadores remotos de todos los rubros, así que este mensaje transversal y constructivo esperamos que llegue a los oídos adecuados, ¡por favor!&quot;]}],[0,{&quot;slug&quot;:[0,&quot;spike-una-empresa-que-nacic3b3-entre-valdivia-y-boston-c6169d7c6126&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Spike: Una empresa que nació entre Valdivia y Boston&quot;],&quot;description&quot;:[0,&quot;9punto5 nació en Valdivia, y desde este lugar (creemos) haber gestado un espacio relevante en Latinoamérica para discutir, aprender, traspasar experiencias y hacer redes en torno a las nuevas…&quot;],&quot;date&quot;:[3,&quot;2019-08-23T15:07:32.622Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/1_IuYItPyerwM4EXyR4l6-HQ.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;sandra-cartagena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Historias&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Spike&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n&gt; Hoy lo global es cada vez más normal al momento de crear empresa\n\n9punto5 nació en Valdivia, y desde este lugar (creemos) haber gestado un espacio relevante en Latinoamérica para discutir, aprender, traspasar experiencias y hacer redes en torno a las nuevas culturas del trabajo.\n\nSiendo Chile el lugar en que nace esta conferencia y estamos a días de que comience la cuarta versión, hoy el país tiene en la palestra uno de los debates más importantes del último tiempo sobre la reforma laboral: ¿bajamos la jornada laboral a **40 horas** ? ¿qué impacto tiene eso en el empleo? ¿sube o **baja la productividad** ? ¿**aumenta el costo del trabajo realmente** ? ¿podemos **distribuir las horas de forma flexible** ?\n\nLa discusión más bien se ha tornado ideológica olvidando que el punto principal no son solamente las horas semanales, sino un suceso mucho más macro: **hacia dónde va el futuro del trabajo.**\n\nYa desde sus inicios en 2016 reuníamos al **sector público, privado y académico**  con el objetivo de compartir conocimientos y experiencias sobre las nuevas culturas de negocio, trabajo remoto, flexibilidad, automatización y las **nuevas habilidades**  que, tanto trabajadores como empresas, deberán incorporar para ser competitivos en mercados internacionales.\n\n**¿Cómo facilitamos la transición a nuevos puestos de trabajo?, ¿cómo descubrimos talentos y los desarrollamos?, ¿qué están haciendo en otros países?, ¿qué políticas públicas deben ser promovidas? y ¿cómo son las oportunidades en nuestro país?**\n\nBuscando precisamente algunas respuestas y nuevos rumbos, **Robert Cercós** **, socio y CTO de la empresa Spike**  asiste a la Conferencia desde su primera versión en 2016. Él, ingeniero civil industrial de profesión, comenzó su tránsito profesional en un ámbito no tan común. Tuvo la oportunidad de realizar producción de bandas sonoras y se dedicó por bastante tiempo a esa especialidad.\n\nSin embargo, fue trabajando en algo mucho más “tradicional” desde la aerolínea Latam, donde **generó redes** que aportaron a lo que hoy hacen en su empresa. Seguro, su **paso por Australia** , cultivó las ganas de querer establecerse en un lugar con buena calidad de vida, dice que por eso eligieron como familia Valdivia. Además la visión que le otorgó su **doctorado,** y **el tiempo** que tuvo mientras trabajaba unas pocas horas como profesor en la Universidad Austral le permitieron, en conjunto con un amigo de Boston, crear la empresa Spike.\n\n“Estaba con ganas de encontrar algo para hacer acá en Valdivia, mi actual socio estaba terminando un Master en Boston y él me contactó, me dice podríamos hacer algo juntos. La empresa nació distribuida, nació remota. Estuvimos un año así, Valdivia-Boston trabajando para Santiago”, comenta Robert Cercós.\n\n&gt; La empresa nació distribuida, nació remota. Estuvimos un año así, Valdivia-Boston trabajando para Santiago”\n\nCuando entras a la web de Spike, que a ratos parece un video musical o el arte de un disco, cuentan lo que hacen:\n\n&lt;Youtube client:load id=\&quot;t8Up9t2cIj0\&quot; title=\&quot;spike\&quot; /&gt;\n\nSpike trabaja con compañías como **Walmart, Latam y Colmena** , basándose en datos obtenidos de sus operaciones, lo que permite generar **modelos predictivos** . Actualmente posee 3 colaboradores en Valdivia y 6 en Santiago, quienes pueden **libremente distribuir sus 40 horas semanales** , ya que el **trabajo es en base a objetivos.**\n\n“Estoy súper tranquilo con la productividad de nuestra empresa, esa es la verdad. Me gusta la manera en que trabajamos. **Creo que todos rinden lo que se espera de ellos y más** . No ha sido una necesidad de controlar, asegura el co-fundador de Spike.\n\nPara Robert el **éxito del trabajo remoto en su empresa va de la mano con poseer una buena conexión y equipos tecnológicos** de buena calidad. Lo demás se ha dado de manera casi espontánea.\n\n“**Ha sido super natural, es parte de la comunicación actual** poder comunicarse con familiares que están al otro lado, los computadores ya vienen todos listos para esas comunicaciones, hay buenas herramientas también para eso. Entonces, creo que **a nadie le ha incomodado o se le ha hecho difícil. Sencillamente ocurre que trabajamos remoto y funciona** ”, confirma.\n\nEn su segunda etapa, la empresa Spike, que crea soluciones con tecnología desde Valdivia, **estará focalizada hacia la resolución de problemas sociales.**  “Tratamos de siempre darle una vuelta a todos**los proyectos que tenemos para que tengan un impacto positivo en la sociedad** ”, dice Robert, reconocido en 2017 como uno de los 100 líderes jóvenes por el ranking de El Mercurio y quien, además, participará en la cuarta versión de 9punto5.\n\nGracias a Robert por la conversación, también a Sandra Cartagena y Stephi por este post.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;starsconf-y-9punto5-se-unen-para-entregarles-un-tremendo-combo-63dd04da2e1&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Starsconf y 9punto5 se unen para entregarles un tremendo combo&quot;],&quot;description&quot;:[0,&quot;Con nuestro amigos de “Starsconf”, hemos decidido lanzar un super mega ticket con doble pase y un increíble descuento. La Starsconf (antes Startech Conf), es una conferencia que seguimos hace ya…&quot;],&quot;date&quot;:[3,&quot;2018-07-12T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/1*ICyJvyZjDNsyv31AjQyF4Q.png&quot;],&quot;authors&quot;:[1,[[0,&quot;felipe-pena&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;9punto5&quot;],[0,&quot;Starsconf&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n**Tenemos una gran noticia este 2018.**\n\nCon nuestro amigos de “Starsconf”, hemos decidido lanzar un super mega ticket con doble pase y un increíble descuento.\n\nLa Starsconf (antes Startech Conf), es una conferencia que seguimos hace ya varios años, y es un líder en Chile en el ámbito de tecnología y desarrollo de software.\n\nLa amistad, relación de negocios y colaboración con 9punto5, nació el año 2016. En ese momento, conocimos y nos reencontramos con personas que comparten la visión que tenemos sobre mejores culturas laborales mejores lugares para trabajar.\n\n**Por eso, esta nueva colaboración se crea con mucha naturalidad y buenas vibras.**\n\nPara ver el detalle de este ticket, ve a la web de venta de entradas de 9punto5.\n\n## La letra chica\n\nNada crítico, realmente.\n- El ticket te da pase a los dos eventos y tiene un descuento del 35% automático en los dos tickets.\n- **Los tickets son hasta agotar stock o hasta el 3 de Agosto. El stock son 50 tickets.**\n- Si necesitas hacer un upgrade a 9punto5 “VIP” o “Valdiviano”, nos puedes mandar un correo a hola@9punto5.cl y lo arreglamos por ti.\n- No existe devolución. Si podemos traspasar el ticket a otra persona.\n\nVe el detalle de este ticket en la web de venta de entradas de 9punto5.\n\nSi tienes preguntas, nos puedes enviar un correo, hablar por Twitter o Facebook.\n\nNuevamente, estamos re-contentos de tener esta alianza. Nos vemos en Valdivia y en Santiago ✌🏻🎉&quot;]}],[0,{&quot;slug&quot;:[0,&quot;te-invitamos-a-ser-speaker-en-9punto5-2019-2e158b60658f&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¿Quieres ser Speaker en 9punto5? | 2019&quot;],&quot;description&quot;:[0,&quot;Por cuarto año consecutivo entre los días 29, 30 y 31 de agosto, en el Hotel Villa Del Río, en Valdivia, Chile. Estamos invitando a speaker que quieran compartir su experiencia en la conferencia. ¿Te…&quot;],&quot;date&quot;:[3,&quot;2019-05-09T20:16:19.687Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/1*No7k5vOrtsUDDuD-f0OvXQ.jpeg&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Speaker&quot;],[0,&quot;Charlista&quot;],[0,&quot;CFP&quot;],[0,&quot;Convocatoria&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Convocatoria para la conferencia 2019\n\nPor cuarto año consecutivo entre los días 29, 30 y 31 de agosto, en el Hotel Villa Del Río, en Valdivia, Chile. Estamos invitando a speaker que quieran compartir su experiencia en la conferencia. ¿Te animas?\n\n## ¿Qué temas buscamos?\n\n9punto5 es una conferencia para hablar sobre **culturas de trabajo estimulantes que están cambiando la forma en que se relacionan las empresas y los trabajadores** , también sobre las tecnologías que son o serán tendencia en generar estas transformaciones. Queremos conocer experiencias reales, a los que están pensando en esto y el futuro.\n\nEste año además queremos subir nuestro número de mujeres presentando en la conferencia. ¡Necesitamos más mujeres en tecnología!\n\n## ¿Cuáles son los formatos en que podrías presentar?\n\nPuedes postular para presentar una **charla de 20 minutos**  (más preguntas) o en un **taller de 50 minutos**  totales. Puedes postular a ambos formatos, una vez en cada uno.\n\n## Sobre la audiencia\n\nEs una comunidad amigable, con gusto por aprender y compartir sus conocimientos, es colaboradora y exigente a la vez. Podrías llegar a hablar en un salón con 400 personas, existe un grupo importante de personas que dirigen empresas, toman decisiones o influyen en sus organizaciones.\n\nParticipan personas de empresas internacionales como Google, Doist, Platzi, Siemens o Cisco, emprendedores y empresas locales como las que son parte de MITI, también estudiantes, especialmente en sus últimos años de universidad.\n![quienes participan](/blog/images/posts/1_g8lmbyXLe8-WUoUJ1NbDRQ.webp)\n\n## **¿Qué se necesita para ser Speaker de 9punto5?** \n\nUna buena forma de explicarlo es a través de quienes han participado.\n\nAcá un video con dos comentarios que reflejan el espíritu que se vive en 9punto5 y la forma en que los speakers pueden contribuir a eso.\n\n&lt;Youtube client:load id=\&quot;gyiaX0xyHkE\&quot; title=\&quot;9punto5 2018\n\&quot; /&gt;\n\n\n**Jonas Altman** **, Social Fabric** \n&gt; Digamos que tu trabajo es un barco, mientras estás en el barco comienzas a construir una balsa, y la balsa es: actitud, habilidades, mentalidad y comportamiento. Que te hacen atractivo para una compañía en la que, o vas a amar trabajar o vas a irte a trabajar con la compañías que te guste. Pero quedarte donde estás… si no es bueno, no es bueno.\n\n**Leo Prieto** **, Odd Industires** \n\n&gt; Yo encuentro que aparte de ser una conferencia sobre trabajo remoto, donde efectivamente estamos ayudando a entender como tienen que cambiar las organizaciones para realmente sacarle provecho no solamente a las ventajas del trabajo remoto, si no que [conocer] cuáles son las buenas prácticas para hacer que funcione […] ésta es una conferencia única y una de mis conferencias favoritas porque, generalmente en estas conferencias sobre temas tecnológicos, que por definición son bastante técnicos, y donde a veces algunas cosas son complejas de entender, hay mucha gente tratando de demostrar su conocimiento, que saben más que el de al lado, pero acá no pasa eso, acá esta es más una conferencia donde la gente comparte lo que sabe, con muy buena disposición y con muy buena onda, [es un lugar] donde la gente viene a compartir lo que sabe y aprender del resto y no solamente demostrar quien sabe mas, o quien va ganando en lo que está haciendo.\n\n## Unos puntos finales\n- Si eres seleccionado puedes obtener un ticket gratuito a la conferencia.\n- Puedes **postular hasta el 21 de mayo** . Anunciaremos a los seleccionados la semana del semana del 3 de junio.\n- Puedes postular hasta dos veces: una charla y un taller.\n- La selección está a cargo del equipo de 9punto5 y algunos colaboradores que nos apoyan en esto.\n- No contestes acelerado, asegúrate de tener suficiente tiempo para pensar y responder. Si necesitas ayuda escríbenos a hola@9punto5.cl, pero no lo hagas a última hora, caso en el que será difícil ayudarte.\n\n# **¿Todo listo?** \n\nSi con esto tienes una idea clara para postular, te invitamos a completar el ***siguiente formulario*** . Estaremos felices de revisar con atención tu postulación.\n\n## **White Sale** \n\nPor otro lado si te parece llamativa la conferencia, pero tu interés es más bien participar como asistente, puedes aprovechas los tickets en “***White Sale*** ”, que tienen un precio especial hasta el próximo 21 de mayo.\n\nPd.: Fayerwayer hizo una nota sobre esto que puedes ver aquí.\n\n*9punto5 nació en el año 2016 como un esfuerzo por construir* ***la principal conferencia anual sobre trabajo remoto y tecnología de Latinoamérica.*** *Estamos preparando todo para su cuarta versión consecutiva en Valdivia, en la que reuniremos más de 400 asistentes de más de 10 países junto a más de 30 referentes internacionales y nacionales en estas temáticas que participan como expositores del evento.*\n\n*Como cada año, nos reunimos durante 3 días para disfrutar la ciudad de Valdivia y hablar sobre las habilidades que necesitan desarrollar las personas y las empresas ante los cambios que enfrenta la forma trabajar y hacer negocios.*\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;tendencias-tecnologia-2023get-on-board&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Las tendencias más importantes en tecnología para el 2023, según Get on Board&quot;],&quot;description&quot;:[0,&quot;Conoce este reporte sobre las tendencias más importantes del mercado laboral tecnológico latino y en tiempo real&quot;],&quot;date&quot;:[3,&quot;2023-01-18T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/tendencias-gob-2023.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Get on Board&quot;],[0,&quot;Oportunidades laborales&quot;],[0,&quot;Sueldos&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;Hace unos días Annelis de [getonbrd.com](http://www.getonbrd.com/), nos compartió su reporte anual Insights donde reúnen las tendencias del mercado laboral en Latinoamérica.\n\nLos datos del reporte son interesantes porque como Job Board tienen visibilidad directa de **450,000 profesionales** de todo Latinoamérica**, 1.4 millones de postulaciones** enviadas a través de Get on Board y **30,000** empleos publicados.\n\nEstas son las principales conclusiones para el año.\n\n### **Los profesionales en tecnología no quieren trabajos híbridos ni de oficina.**\n\n- **64% de los empleos en 2022 son permanentemente remotos, versus 57% el 2021**.\n- Los empleos temporalmente remotos cayeron de 28% el 2021 a 4.5% el 2022.\n- Los empleos híbridos no son populares: 21% de los empleos reciben solo el 14% de postulaciones.\n- Los presenciales aún menos: 6% de los empleos consiguieron solo el 3% de las postulaciones.\n- Por el contrario, las posiciones 100% remotas tienen mucha demanda: **64% de los empleos obtienen 77% de las postulaciones.**\n\n&gt; Los profesionales en tecnología **no quieren trabajos híbridos ni de oficina**.\n\nLa conclusión de estos es que “el talento en tecnología puede elegir. Tiene opciones, y prefiere la flexibilidad del trabajo remoto. **El problema del esquema híbrido es que pasar un par de días a la semana en casa no te da realmente la flexibilidad de acomodar tus horarios o trabajar desde donde sea**. Las empresas que le den flexibilidad al talento tienen las de ganar”, según comentó Sergio Nouvel.\n\nY ante la dificultad que implica contratar remoto de forma global desde el punto de vista administrativo y legal también, solo comenzar a hacerlo a nivel nacional ya genera una ventaja a la hora de atraer talento. “Entiendo que para muchas empresas el tema contractual hacia el extranjero puede ser un dolor de cabeza o una incertidumbre. Pero **basta con que contraten remoto dentro del país y ya ganarán una ventaja gigantesca respecto a la competencia. Muchas empresas Chilenas, incluidos bancos y retail, ya lo están haciendo**”.\n\n### **Las tecnologías más pedidas están cambiando hacia lo corporativo, y hay sobreoferta de JavaScript**\n\n- Los empleos con tecnologías basadas en JavaScript (como Node.js, Express o React Native) están obteniendo 2 veces más postulaciones que empleos similares no basados en JavaScript.\n- Sin embargo, las empresas están demandando más talento en otras tecnologías, como Java (no confundir con JavaScript), .NET o incluso Oracle.\n- Esta demanda no se ve cubierta. Java, por ejemplo, constituye un 22% de los empleos, pero sólo un 13% de las postulaciones.\n\nOtra conclusión interesante que nos comparten es que por años, las escuelas de programación han priorizado la enseñanza de JavaScript. Así que **hoy el mercado está lleno de estos perfiles**, pero ahora nos encontramos en un ciclo donde **las startups que son las que más demandaban dichas tecnologías han venido congelando sus contrataciones**.\n\nEn cambio en el mundo corporativo y de grandes empresas la digitalización sigue siendo avanzando con fuerza. Pero aquí **la demanda es por tecnologías _enterprise,_ y esto es lo que dominó el mercado laboral el 2022.**\n\nEl consejo de Get on Board es claro y está alineado con una habilidad que es clave en 9punto5 como comunidad de apoyo y aprendizaje y que me ha tocado destacar varias veces por estos días: **Aprende a aprender**. Sergio dice que **\&quot;si estás recién comenzando, no te quedes solo con JavaScript y aprende tecnologías como Java o Swift”**.\n\n### **Los salarios están decreciendo, a pesar de que en algunas posiciones deberían subir**\n\n- En promedio, los salarios ofrecidos por los empleadores en tecnología han disminuido un 11% en relación al 2021.\n- Sin embargo, las expectativas de los profesionales se han mantenido mayormente intactas.\n- En algunos cargos, como DevOps y Desarrollo de aplicaciones Móviles, la baja en los salarios sólo ha conseguido más fracasos para las empresas buscando talento. El porcentaje de éxito en estas categorías ha bajado a un 22% y 25%, respectivamente.\n\nCon la [corrección negativa](https://layoffs.fyi/) que trae en el último año el mundo de la tecnología “la recesión se ha convertido en justificación para ofrecer menos sueldo. En algunas categorías eso ha funcionado, especialmente en posiciones con menos experiencia; pero en otras, como DevOps o desarrollo móvil, las empresas se están disparando en los pies al ofrecer sueldos que no atraen a nadie”\n\n- Aún más, **los empleos Senior constituyen un 27% de los empleos, pero sólo logran atraer al 14% de los postulantes**.\n\nJunto con el reporte de este año, Get on Board anunció el lanzamiento de [Insights Pro](https://insightspro.getonbrd.com/?utm_source=PR&amp;utm_medium=9punto5&amp;utm_campaign=iPro&amp;utm_content=Landing), un servicio de recomendación salarial que ayudará a las empresas a retener talento ya actualizar el sueldo con regularidad hace la diferencia a este respecto.\n\nAquí puedes ver la presentación de Sergio Nouvel en el pasado [Awesome Fest](https://www.awesomefest.co/).\n\nAsí como la presentación con más detalles:\n\n---\n\n## Una mirada al 2016\n\nAntes de despedirme aprovecho de compartir algunas ideas interesantes que he aprendido de Get On Board desde que Sergio Nouvel nos acompañara con una de las primeras charlas de la conferencia que partimos en Valdivia el 2016.\n\nCon **\&quot;Emprendiendo al revés\&quot;** habló de los antipatrones que siguieron y a día de hoy es igual de interesantes de ver.\n\nCuatro años después Sergio contaba por qué decidieron levantar plata compartiendo una check list súper interesantes para evaluar si tu negocio necesita realmente ese dinero:\n\n- ✅ ¿Tienes un producto lanzado y validado, con clientes satisfechos?\n- ✅ ¿Tienes una receta clara acerca de cómo expandirte y seguir creciendo con rapidez?\n- ✅ ¿Tienes un producto que depende directamente de conseguir [efectos de red](https://future.com/all-about-network-effects/) para agregar valor?\n- ✅ ¿Tienes un mercado potencial gigante, de miles de millones de dólares?\n\nSi la respuesta a cualquiera de las preguntas de arriba es “no”, entonces NO necesitas Venture Capital. Porque una inversión de VC es como acceder a combustible de cohete, [como dice Mark Suster](https://bothsidesofthetable.com/do-you-really-even-need-vc-72013e985fab). Si tienes un auto o una bicicleta, es obvio que no necesitas combustible de cohete. Pero si tienes un cohete, definitivamente lo necesitas para que pueda despegar.\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;titulo&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Cómo escribir un buen título&quot;],&quot;description&quot;:[0,&quot;Usa palabras clave, asegúrate de que el título suene bien, sea fácil de entender y pronunciar. Un buen título &#39;recomendará&#39; tu trabajo y lo hará más memorable&quot;],&quot;date&quot;:[3,&quot;2024-05-13T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/titulo.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fabian-acuna&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Desarrollo&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Speaker&quot;],[0,&quot;Charlista&quot;],[0,&quot;CFP&quot;],[0,&quot;Convocatoria&quot;],[0,&quot;Título&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;**Usa palabras clave, asegúrate de que el título suene bien, sea fácil de entender y pronunciar. Esto recomendará tu trabajo, lo hará más memorable y atraerá a nuevas personas.**\n\n–\n\nAl crear algo, puede que empieces por su título o su nombre, ya que en cierta medida es el centro de lo que quieres decir o hacer. Sin embargo, probablemente te ha pasado que al ir avanzando en su desarrollo, te das cuenta de que el título o el nombre debería ser otro.\n\nPor eso te compartimos algunos consejos tomados de David Kadavy sobre cómo elegir un buen título. Un buen título implica pensar:\n- ¿Qué palabras clave usaría una persona que esté buscando aprender sobre ese tema?\n- ¿El título generará ganas de recomendar tu trabajo?\n- ¿Es el título fácil de entender y pronunciar?\n- ¿El título suena bien? ¿Tiene un ritmo agradable que fluye fácilmente al hablar?\n- ¿Puedes jugar con los significados secundarios de las palabras en el título?\n- ¿El título trae imágenes en favor o en perjuicio de lo que quieres transmitir?\n\nVeamos algunos ejemplos de estos fenómenos en acción:\n\n**“Deep Work\&quot;** pasa la prueba de “contar lo que estoy leyendo en la comida con amigos\&quot;. Suena bien decir que estás usando técnicas para hacer “Deep Work” (trabajo profundo y que no funciona muy bien en español). Se siente bien y por eso hay espacios donde se hizo conocido hablar de “Deep Work\&quot;. Un título alternativo pudo ser \&quot;La importancia de la concentración”, pero eso no es pegajoso.\n\nEl libro **“Play it Away\&quot;** habla sobre cómo curar la ansiedad. Su autor, Charlie Hoehr, dijo que no quería la palabra “ansiedad” en el título porque hace que las personas sean menos propensas a decirle a un amigo que lo están leyendo. Pero luego, si buscan libros sobre ansiedad (una actividad más privada) pueden encontrarlo, porque la palabra está en el subtítulo: \&quot;A Workaholic’s Cure for Anxiety\&quot;.\n\n\nEl título perfecto no existe, pero se va revelando mientras más desarrollas tu trabajo.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;todos-podemos-ser-hc3a9roes-441ae188d6f7&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Todos podemos ser héroes&quot;],&quot;description&quot;:[0,&quot;Únete como voluntario en 9punto5 y sé parte de un equipo diverso que promueve nuevas formas de trabajar. ¡Vive una experiencia transformadora y significativa!&quot;],&quot;date&quot;:[3,&quot;2019-04-23T18:25:29.402Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/0_F5ayOYtFeoYjkL3F.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fran-daforno&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Voluntariado&quot;],[0,&quot;9punto5&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;&gt;En 9punto5 estamos buscando heroínas y héroes para la conferencia\n\nHoy estamos en un proceso de búsqueda de héroes y heroínas en 9PUNTO5. Las postulaciones son hasta el próximo 3 de mayo de 2019.\n\n## Mi experiencia como vuluntaria\n\nAl empezar este proceso pensé: *¿Qué significa ser voluntari@?* *¿Será más habitual que la gente en algún momento lo sea o serlo resulta extraño para el común de las personas?*\n\nPor mi parte, fui voluntaria 4 años en una organización social grande. Entré cuando estaba en cuarto medio, 11 años atrás y aún disfruto de todo lo que esos 4 años me dieron. Suena un cliché, pero me hace sentido cuando dicen que en esas instancias finalmente uno recibe más de lo que da.\n![Medium-Image](/blog/images/posts/1_sn38qjF3eGdxKzVOL2V6wQ.webp)\n\nEntonces... ¿qué significa ser voluntario? Creo que a veces es más complejo que ser trabajador, porque nos comprometemos con alguien o una tarea que no es remunerada económicamente, por lo tanto, quizás podríamos querer prescindir de ella de forma rápida, sobretodo si no marcha como esperábamos, pero para mi el compromiso era mayor porque aportaba en un sueño, cambiamos significativamente las condiciones de vida de las familias, eso tiene otra retribución gigante y también demanda lo mejor de uno.\n\nAprendí que ser voluntaria implicaba dejar en la cancha lo mejor de mi, específicamente me implicaba:\n- Ser **responsable,**  para hacer lo que decía que haría,\n- debía ser **organizada**  y así tener suficiente tiempo para hacer todo (para esa fecha yo había entrado a la u, era empaque universitaria, voluntaria, tenía pololo, familia y amigos que ver, así que corría todo el día),\n- estar **comprometida**  para hacerlo de la mejor manera no solo hacerlo y ya,\n- **empática** y así poder entender la importancia de mi tarea en el proceso completo, esto evitaba que me atrase y afecte las demás tareas. Fue también entender en la práctica qué era ser parte de un equipo.\n- Debía **ser humilde**  para aceptar las sugerencias que me hacían y por sobretodo\n- poder **comunicarme** , no sólo entendiéndose como decir lo que me pasaba, también ser consciente de lo que mis expresiones, posturas y comportamiento comunicaban. Era muy importante que mi mensaje sea uno, que estuviera lo más alineado posible, para que me puedan entender rápido y claro.\n\nDel otro lado de mi lista de “deberes” como voluntaria, que se pueden leer fáciles pero en la práctica es difícil compatibilizarlos y practicarlos día a día, lo bonito y bueno del voluntariado ¡es mucho más!\n- Además de todo el desarrollo personal que me implicó vivir y cultivar los puntos que mencioné anteriormente\n- Me rodié de gente linda que estaba muy agradecida por las tareas que hacíamos y nos entregaba mucho cariño por lo mismo\n- Conocí personas muy diferente a mi y pares a la vez. Ya no éramos todos del mismo colegio, ni teníamos los mismos intereses en común, pero nos complementábamos, compartíamos todos la visión de lo que estábamos construyendo juntos, y las experiencias de vida al ser diferentes se volvían mucho más enriquecedoras, formamos equipos más diversos, con todos los beneficios que eso implica.\n- Y todos esos pares que hace 7 años estábamos terminando la universidad, hoy tenemos trabajos diferentes, pero tejimos todo ese tiempo una gran red de contactos.\n- Cuando entré fue como voluntaria, estuve en diversos equipos cada uno con objetivos y modalidades de trabajo diferentes hasta que lideré Fomento Productivo, el área de los microcréditos que le daba apoyo económico a las familias. Entonces reafirmé que esa era mi área, que era buena y finalmente descubrí en la práctica que era lo que más me gustaba hacer.\n- Hice varios amigos, conocí a mi pololo de esa época, y\n- por sobretodo, sentí que aportaba a la sociedad en que vivo.\n\nDesde que comencé en 9punto5 intento desarrollar relaciones win — win, es una práctica a nivel equipo que me gusta mucho. Significa que todas las alianzas que realizamos tienen un beneficio para 9punto5 pero también para la contraparte. Yo comencé trabajando el primer año de la conferencia, porque era uno de mis proyectos, para la segunda versión entendí el impacto que podíamos generar ¡lo estábamos haciendo! y la misión que estamos impulsando hoy de dar a conocer nuevas y mejores formas de trabajar en las empresas, puntualmente a través del trabajo remoto, ¡es una tarea grande, mientras más seamos, mejor!\n![Medium-Image](/blog/images/posts/0_P4yXT-AATj04ASxS.webp)\n\nHoy estamos buscando héroes y heroínas que deseen ser parte de este sueño, que quieran vivir un equipo distribuido, con objetivos que cumplir en plazos determinados, que disfruten de una buena conversación junto a un café o cerveza, por sobretodo que vean valor en el proyecto y una experiencia así.\n\nSi les gusta la idea, ingresen a **este form** , son cupos limitados porque también nos interesa y estamos intentando sea una buena experiencia para ustedes.\n\n¡Súmate a 9punto5 2019!\n\nCariños, Fran.\n\n&gt; Existen héroes sin capa\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;trabajo-remoto-en-chile-dc3b3nde-nos-aprieta-el-zapato-3f7684a1f8eb&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;Trabajo remoto en Chile: ¿Dónde nos aprieta el zapato?&quot;],&quot;description&quot;:[0,&quot;3 ideas para aportar a tu marca personal y la posibiildad de consguir tu próximo trabajo remoto: comparte tu conocimiento, escribe en blogs y promociona tus proyectos en eventos y redes sociales&quot;],&quot;date&quot;:[3,&quot;2017-03-17T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/pressure.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;romy-valenta&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Columna&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Trabajo remoto&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n\nSi bien durante el último tiempo el trabajo remoto se ha convertido en un “tema país” (debo confesar que ese término me produce cierto escozor, pero encaja perfecto), todavía nos queda un largo trecho por recorrer para poder decir con propiedad que estamos realmente avanzando en esta materia, o instalando una cultura de trabajo sólida que permita a personas y empresas desenvolverse con soltura en sus ocupaciones, resolviendo compromisos a distancia.\n\nLo más lógico, es pensar que la distancia es la principal enemiga.\n\nPero no.\n\nEste tema lo hemos rozado en otros posts y también en nuestro podcast.\n\n**No es la modalidad lo que nos limita, sino más bien nosotros mismos a la hora de enfrentar una nueva perspectiva en torno al trabajo.** A los seres humanos, por lo general, lo nuevo nos asusta y tendemos a desconfiar de aquello que no se ha testeado una y mil veces. Pero si permanecemos siempre en la zona de confort, malamente podremos saber qué hay del otro lado de la cerca.\n\nUn claro ejemplo de esta desconfianza y excesiva obsesión con el rendimiento, **son los trabajos públicos**.\n\nNo crean que existe de mi parte alguna animadversión con este amplio segmento de la población, responsable de tramitar prácticamente todos los aspectos formales de nuestra vida (¡qué miedo!), pero sinceramente considero que actualmente existen muchísimas restricciones para estos trabajadores que perfectamente podrían trabajar desde su casa.\n\nEstá bien. Excluyamos a aquellos que deben cumplir presencialmente con un cargo de atención de público, o sea, el porcentaje más bajo de los ocupantes de una repartición de gobierno cualquiera. Perfectamente, el personal encargado de archivar, ingresar datos, levantar información, gestionar estadísticas podría trabajar total o parcialmente desde cualquier punto que no sea la oficina y el trabajo se haría igual.\n\nSin embargo, actualmente estos cargos presentan muchísimas restricciones, como por ejemplo: la correcta ejecución de las labores depende exclusivamente de un software que sólo funciona desde la oficina y es imposible acceder desde otro punto.\n\n⛔️ Otro error, a mi juicio prehistórico, es que el manejo de la productividad en Chile se basa en el método de “marcar tarjeta”, midiendo cuando la persona entra y sale de su trabajo, rara vez por la concreción de metas u objetivos.\n\nEl hecho de que todo se mida cualitativa y no cuantitativamente nos sitúa en un terreno inhóspito, donde **el trabajador probablemente le “agarra mala” a la pega, espera con ansias la hora de salida y no le importa rendir en lo que está haciendo**.\n\nEn nuestro país es súper frecuente estar trabajando a honorarios por períodos groseramente largos, sin ninguna formalidad en términos de contrato, boleteando eternamente.\n\n¿Y qué pasa cuando por fin nos contratan?\n\nEl documento que firmamos nos obliga a permanecer en un lugar fijo, cumpliendo horario, esclavizados a un punto definido para que nos vean que estamos ahí, sin importar que nuestra mente esté en Nepal.\n\n**Lamento decirles que tal vez puedan controlar mi horario y mi cuerpo, pero mi mente es un terreno ingobernable que funciona en base a la voluntad y el compromiso.**\n\n⚠️ Y no se les vaya a ocurrir enfermarse.\n\nSi firmaste contrato tienes horario de entrada y salida, por eso a tu empleador no le interesa mayormente que hayan entrado a robar a tu casa, tu hijo se haya accidentado en el colegio, te duela la cabeza o simplemente te avisen intempestivamente de un trámite de vida o muerte que debes realizar si o si “ese día”, porque 📢 tu debes ser capaz de cumplir el horario que se estipula en tu acuerdo laboral notarial.\n\nNo se me ocurre la solución inmediata ni perfecta para este problema, pero sí me visita la idea de que **las leyes laborales se flexibilicen en este sentido, que los empleadores confíen más en la gente que contrata y que los trabajadores demos el ejemplo demostrando que somos eficientes e igualmente eficaces desde nuestro sillón favorito** que trabajando en ese incómodo y frío escritorio, al lado de ese compañero de trabajo pesado y sacador de vuelta que nos distrae con bromas fomes y pelando al jefe.\n\nNo seamos cerrados señores. Usted, puede hacer la diferencia e instaurar la modalidad de trabajo remoto si está seguro de la gente que tiene en su equipo. Yo les aseguro que si eligieron bien a sus profesionales no se arrepentirán y estarán todos más felices.\n\n---\n\n“9punto5” es un evento que instala temas sobre trabajo remoto y espera generar un puente de diálogo con autoridades e instituciones clave en la toma de decisiones para definir políticas laborales. Queremos mejorar las condiciones en esta materia y hacer que la comunidad remota crezca y se consolide en el país. ¿Interesado en más? Suscríbete para más contenido acá.\n\nSi estás de acuerdo con la realidad que planteamos en este este artículo, nos ayudarías tremendamente haciendo click en el corazón de más abajo 💜. Gracias.&quot;]}],[0,{&quot;slug&quot;:[0,&quot;tranquilidad-ante-todo-tc3ba-tambic3a9n-puedes-trabajar-remoto-exitosamente-5283a192e8f7&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¡Tranquilidad ante todo! Guía para trabajar remoto exitosamente&quot;],&quot;description&quot;:[0,&quot;Consejos prácticos sobre trabajo remoto, herramientas esenciales y cómo mantener la productividad desde casa. Mejora tu rutina y comunicación hoy mismo.&quot;],&quot;date&quot;:[3,&quot;2020-03-20T15:46:29.171Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/0_vTh5bzdB-Ljj20_q.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;fran-daforno&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Guía&quot;]]],&quot;tags&quot;:[1,[[0,&quot;Coronavirus&quot;],[0,&quot;Trabajo remoto&quot;],[0,&quot;COVID-19&quot;],[0,&quot;Pandemia&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\nEl trabajo remoto ha sido tan mencionada como el coronavirus. Claro está, es una de las muchas consecuentes que la pandemia actual está teniendo sobre nuestro comportamiento.\n\nSi estás escuchándolo y no sabes de qué va, menos aún tienes ideas de lo que implica, espero poder ayudarte. Llevo 4 años relacionada al tema, soy socia de **9punto5** , promovemos y facilitamos el trabajo remoto, porque creo que esta modalidad da oportunidades para tener una **mejor calidad de vida para todos, compatibilizando trabajo y “vida”.**  Entonces, opero un alto porcentaje de mi jornada de forma remota, no soy experta en todas las herramientas que el mercado ofrece, pero sé cómo funcionan las que ocupo a diario y te aconsejaré algunos links relacionados.\n\nTrabajar remoto significa que estás trabajando en un lugar distinto a la oficina, conectado a través de canales digitales. Yo por ejemplo, trabajo algunos días desde casa, en menor medida desde algún café y otros días voy a un cowork, un espacio de trabajo colaborativo el cual simula nuestra oficina. Sea donde sea que estemos, lo más importante es confiar en el otro, en que sabe por qué, cómo y cuándo hacer su trabajo.\n\nQuiero enfatizar que este post es para quien tiene poca o nula experiencia trabajando a distancia, si tienen dudas o quieren profundizar en algún apartado específico pueden escribirme a fran@9punto5.cl\n\n# Modalidad\n\nAsumiremos que con la contingencia del coronavirus todos estamos 100% trabajando desde casa, pero esta no es la única alternativa cuando hablamos de trabajo remoto. No viene al caso profundizar más, pero si gustas puedes leer sobre las diferentes modalidades de trabajar a distancia.\n\nTrabajar remoto tiene muchas libertades, una de ellas es el horario. **Es fundamental que los equipos conversen y acuerden el nivel de sincronía**  al trabajar remoto desde el comienzo, esto podrá evitar posibles inconvenientes a futuro como por ejemplo: expectativas de que te contesten una duda de forma inmediata o rápida, horarios de reuniones, entre otras.\n\nLas opciones son tres:\n- Estar todos conectados al mismo tiempo, quizás manteniendo el horario de oficina, **síncrono.**\n- Cada quien define sus tiempos de trabajo siempre que cumpla con sus objetivos, **asíncrono.**\n- Están conectados todos en un determinado periodo de tiempo, el resto cada quien trabaja cuando estime conveniente, **overlap** .\n\n[Aquí puedes leer de estos con más detalles](https://www.notion.so/9punto5/Tipos-de-comunicaci-n-Sync-Async-Overlap-65a7399309cb4034bc72ece20164ece8) (creamos una base de conocimiento con recursos e ideas para tomar en cuenta al trabajar remoto).\n\n## Rutina y trabajo\n![Medium-Image](/blog/images/posts/1_7YOlefRPXwExLOGHwnPQcA.webp)\n\nYa no debes trasladarte para llegar a la oficina y trabajar, uno de los beneficios que más me gusta, pero te aconsejo que sigas más o menos la misma rutina — **trabajar remoto requiere de mucha autodisciplina** , ésta nueva rutina ya puede ser difícil, entonces trata de alterarla lo menos posible.\n\nLevántate de la cama, toma desayuno y **busca un** **lugar cómodo para trabajar en casa**  (si la cama lo es, no hay problema que lo hagas desde ahí), lo importante es que puedas concentrarte para trabajar, entonces idealmente no tengas muchas distracciones cerca.\n\nSi por la cuarentena también hay más personas en casa, elige un espacio donde puedas tener un tiempo tranquilo y en silencio, que entiendan estás trabajando en ese lugar. Considera que es altamente probable que si menos te ven, menos interrupciones tengas.\n- [Consejo: Rutina para empezar y terminar el día](https://www.notion.so/9punto5/Rutina-para-empezar-y-terminar-el-d-a-485e1bc8c5994b63adbac12cd2a6dd91)\n- [Consejo: Define los límites en la casa, sobretodo para con tu familia](https://www.notion.so/9punto5/Consejo-Define-los-l-mites-en-la-casa-sobretodo-para-con-tu-familia-65a7399309cb4034bc72ece20164ece8)\n- [Consejo: Pomodoro, una técnica para concentrarte](https://www.notion.so/9punto5/T-cnicas-de-concentraci-n-de09963fc11043f696fc338bd371d6b9)\n\n## Comunicación\n\nIndependiente de la modalidad de trabajo, es un hecho que la comunicación es muy importante entonces la duda será ¿por qué medio?\n\nEl uso de Whatsapp es universal, pero es ideal si pueden tener una **herramienta de comunicación específica para el trabajo** , esto permite una separación clara de los temas.\n\nLa aplicación de comunicación más conocida para trabajar, por lo menos en el mundo tecnológico, es **Slack** , aunque yo en mi día a día utilizo **Twist** **.**  Ambos son plataformas de chat para descargar en tu note/celular desde las que puedes hablar directamente a una persona o crear canales por equipo, proyecto o un tema de conversación específico. Te permiten limitar el acceso a las conversaciones, para que las vean todos o solo ciertos miembros de la empresa, por ejemplo cuando es por proyecto o un canal con el cliente.\n\n¿Por qué no ocupo la que todos ocupan? Me gusta más Twist porque dentro de cada canal puedo crear subtemas. Slack lo tiene a modo de “hilo” de una conversación, pero en mi experiencia Twist es más ordenada, claro si somos capaces de abrir un canal o subtema para ideas distintas. De esta forma, cuando pasas un tiempo desconectada, evitas volver a la aplicación y tener una conversación de 200 mensajes, en cambio puedes tener quizás 5 conversaciones con 40 líneas cada uno. A mi esto último me da la sensación que puedo abordar y opinar en los temas, antes me pasaba que cuando llegaba al inicio de una conversación infinita, con muchos temas, algunos en ciertas ocasiones ya estaban zanjados.\n\nComo las herramientas son muy variadas, te aconsejo no te quedes solo con la que te recomendaron, es importante que como equipo se sientan cómodos con la que eligieron, se comprometen a usarla todos y por un periodo mínimo, si no lo más probable es que al poco tiempo la dejen.\n![Medium-Image](/blog/images/posts/1_DcBz3PxUrAURm20igldczQ.png)\n\n**¡Errores más comunes!**\n- Personalmente siempre escribo bien acotado, grave error, debemos pensar que no nos están viendo, no saben el tono de voz, claro lo pueden imaginar quizás, pero mientras más clara y específica sea el desarrollo de la idea será mejor.\n\n**Consejo: Desarrolla tu habilidad para escribir**\n- Pensar que es imposible mantener las conversaciones de pasillo. Ciertamente estas conversaciones cuando se está remoto son más difíciles de darse, pero sí están acostumbrados a conversar el lunes qué hicieron el fin de semana se puede crear un canal para conversar éste u otros temas random.\n\nTe invito a leer La “cafetera” o “water cooler” en una cultura remota\n\n**Links relacionados**\n- [Cómo funciona Twist](https://youtu.be/gXpAQaY3L4Q?si=k7crG79rxJG2iurO) [Video]\n- [Cómo funciona Twist](https://twist.com/home#featureSection) [Post]\n- [Los 5 consejos primordiales para comenzar a usar Slack](https://slack.com/intl/es-cl/resources/using-slack/top-5-tips-for-getting-started-in-slack?geocode=es-cl) [Post]\n- [Qué es Slack y lo básico para empezar a usar esta app](https://www.youtube.com/watch?v=HoqBaFfwU38) [Video]\n\n# Reuniones\n\nOtra opción para comunicarse es que se reúnan por una videollamada. La primera de la semana puede ser simplemente para saber cómo se encuentra el equipo, cómo estuvo el finde y que harán durante el día.\n\nPara todas mis reuniones online utilizo Meet, es una herramienta de Google. Me gusta porque no debes instalar nada ni agregar a alguien a tu cuenta (como en Skype). Ingresas, te registras con tu email y pasas a crear una reunión, esto generará un link, el cual puedes compartir o envías invitaciones por email a los demás participantes. También te permitirá definir día, hora de inicio y término, agregar una descripción de la llamada, entre otras opciones configurables.\n\nOtras alternativas son Zoom, Skype, Slack, Facetime, entre otras.\n- [Buenas prácticas de reuniones remotas](https://www.notion.so/9punto5/Buenas-pr-cticas-de-reuniones-remotas-30d70c95cff74735a68395a6604b5c67) \n- [Haz saber que estás ahí](https://www.notion.so/9punto5/Haz-saber-que-est-s-ah-77483cfb093940b9b3bab6662542d22b)\n- [Esta reunión debió ser un mail](https://www.notion.so/9punto5/Esta-reuni-n-debi-ser-un-mail-c638ffa072e34ec4b059f2dee59c7424)\n![Medium-Image](/blog/images/posts/1_ibt4M6Dmy_8h8Hlg4OLl7Q.webp)\n\nCon todo lo que has leído hasta ahora me imagino ya sientes la necesidad de tener una agenda. Con el tiempo, y con tanto libertad, uno entiende esta es super importante, **debemos ser ordenado sobretodo en los tiempos de actividades y más si involucra el tiempo de otra persona.**\n\nYo amaba las agendas de papel, pero debo confesar que hace años prefiero Google Calendar. Me gusta porque cuando creo un evento, en esa misma instancia se puede generar el link para la videollamada, entonces cuando invito a las personas está toda la info ahí. Además puedo crear calendarios específicos, por ejemplo yo tengo uno para los cumpleaños, otro para unas charlas que coordino, pero a las que no asiste. También me comparten calendarios como el de la sala de reuniones de Nube, el cowork al que voy y mucho más.\n\nOtra opción es Fantastical.\n\n**Links relacionados**\n- Iniciar videollamadas en meet [Post]\n- Programar una reunión en el sitio web de Zoom [Video]\n- Comenzar a usar el Calendario de Google [Post]\n\n## Gestión de proyectos\n\nEstando todos distribuidos **es necesario tener claridad de los roles y funciones de cada miembro de la organización** . Si ésto no ocurre lo más probable es que se dupliquen esfuerzos en tareas o no sepamos con quien conversar para quién pedir ayuda o resolver una duda.\n\nPosterior a esto, se debe encontrar la manera de coordinar a nivel general los procesos y tareas de cada equipo o proyecto. Es importante documentar lo que uno haga, tanto como llegar al resultado final.\n\nPara documentar procesos, armar bases de datos, hacer cálculos y muchas más acciones utilizamos Notion. Es una herramienta super completa, podría reemplazar otras varias herramientas que ocupamos como Airtable, Pipedrive, por mencionar algunas, pero quizás por lo mismo no es tan sencilla de ocupar al comienzo y es de pago.\n\nAquí mi recomendación para iniciar es ocupar los productos de Google suite para crear contenido: documentos, hojas de cálculo, presentaciones, formularios y más. Todos estos documentos pueden ser compartidos de manera fácil (link) e incluso permite el trabajo simultáneamente de varias personas. Son como los programas básicos de microsoft (word, excel y power point) disponibles para crear y guardar en un almacenamiento en línea — Google drive.\n\nOtras alternativas son Evernote, Airtable, Jira, entre otros.\n![Medium-Image](/blog/images/posts/1_UWwhfgmc7FsV1OrookOI4Q.webp)\n\nPara gestionar los proyectos uso Basecamp, esta herramienta permite crear proyectos o equipos específicos e invitar a quienes trabajan en el para, de forma colaborativa, centralizar la información en torno a tareas, mensajes, email relacionados, fechas importantes en el calendario, documentos, entre otras.\n\nMe gusta mucho porque resulta super fácil de usar y permite mantener ordenado la gestión de proyectos. El problema, es pagado.\n\nLa idea de utilizar una herramienta así es que de un proyecto, vas creando tareas, las puedes asignar a personas específicas, delimitar fechas, se pueden adjuntar archivos, tener conversaciones. Habitualmente genero las tareas en Basecamp, y el resultado final es un doc u hoja de cálculo de google. O sea, voy complementando las herramientas.\n\nAlgunas de las alternativas que conozco son Todoist, Monday, Trello y Asana.\n\n**Links relacionados**\n- Post: [Creación de documentos — Gsuite](https://gsuite.google.es/intl/es/products/docs/)\n- Post: [Creación de hojas de cálculo — Gsuite](https://gsuite.google.com/intl/es-419/products/sheets/)\n- Post: [Creación de hojas de cálculo — Gsuite](https://gsuite.google.com/intl/es-419/products/slides/)\n- Post: [Getting Started with Notion: Boost Your Productivity](https://www.notion.so/9punto5/Getting-Started-with-Notion-Boost-Your-Productivity-30d70c95cff74735a68395a6604b5c67)\n- Post:[Creación de presentaciones — Gsuite](https://notionpages.com/getting-started-with-notion-boost-your-productivity/)\n- Video: [Tutorial Notion](https://www.youtube.com/watch?v=nP9aFjmRawM)\n- Post: [Cómo empezar a usar Asana](https://asana.com/es/guide/get-started/begin/quick-start)\n- Video: [Video promocional Monday](https://www.youtube.com/watch?v=NJe6YQUu4lQ)\n- Video: [Tutorial Trello 2019](https://www.youtube.com/watch?v=r3tgjL4kwU8)\n\nSeguro ya ha sido mucha información, recuerda puedes escribirme comentarios o dudas al email, linkedIn o twitter.\n\n**¡Buena cuarentena!**\n\nFran\n&quot;]}],[0,{&quot;slug&quot;:[0,&quot;valdivia&quot;],&quot;data&quot;:[0,{&quot;title&quot;:[0,&quot;¡Haz que tu próximo destino sea Valdivia con 9punto5!&quot;],&quot;description&quot;:[0,&quot;Idea de qué hacer en Valdivia para aprovechar la conferencia y la ciudad.&quot;],&quot;date&quot;:[3,&quot;2024-08-30T00:00:00.000Z&quot;],&quot;image&quot;:[0,&quot;/blog/images/posts/valdivia.webp&quot;],&quot;authors&quot;:[1,[[0,&quot;9punto5&quot;]]],&quot;categories&quot;:[1,[[0,&quot;Conferencia&quot;]]],&quot;tags&quot;:[1,[[0,&quot;9punto5&quot;],[0,&quot;Valdivia&quot;]]],&quot;draft&quot;:[0,false]}],&quot;content&quot;:[0,&quot;\n&gt; Con tu credencial de 9punto5 podrás acceder a descuentos exclusivos. Conoce todos los detalles en [nuestra cuenta de Instagram](https://www.instagram.com/9punto5_/).\n\n9punto5 no solo es una conferencia, es descubrir la belleza de Valdivia. Una invitación a sumergirte en un encuentro sobre sobre tecnología, cultura y futuro laboral, mientras exploras los encantos esta ciudad, navegando por sus ríos, disfrutando de su gastronomía y perdiéndote en su belleza natural.\n\nTe invitamos a planificar una escapada inolvidable entre el **7 y el 9 de noviembre**, donde podrás combinar tres días de vanguardia tecnológica con una experiencia sensorial, en este lugar que te cautivará en cada paso.\n\nY como queremos que tu viaje sea completo, también te contamos que gracias al patrocinio de Sernatur podrás disfrutar de ofertas exclusivas.\n\n¿Planifiquemos el viaje?\n\n## Prepárate\nValdivia posee un centro compacto y seguro, ideal para recorrer a pie. La conferencia será en plena primavera por lo que podrás disfrutar de un entorno natural muy variado donde, por supuesto, nunca faltará la clásica lluvia. No olvides traer un paraguas, una chaqueta impermeable y unas buenas zapatillas para disfrutar al máximo.\n\n## Valdivia para los paladares\nNo importa el clima, siempre encontrarás un lugar cálido para degustar una cerveza artesanal, un chocolate caliente, una pichanga caliente o el famoso “crudo” valdiviano. Te animamos a reservar este tour gastronómico en tu agenda para que no te quedes con hambre.\n\n¿Listo para embarcarte en esta aventura?\n\nA continuación, te compartimos datos y tips para ayudarte a planificar tu visita a Valdivia.\n\n## Alojamiento\n\nHay muchas alternativas en Airbnb y en Booking, pero además tenemos convenio directo con el [**Hotel Villa del Río**](https://www.villadelrio.cl/) que cuenta con desayuno buffet, piscina, estacionamiento privado, gimnasio, cancha de tenis, wi fi en habitaciones y áreas públicas.\n\nPara reservar, escribe un mail con asunto que incluya “9punto5” a reservas@villadelrio.cl.\n\n- Check-in: desde las 15:00 h. “Early check-in” sujeto a disponibilidad al momento de la llegada (si lo necesitas, puedes dejar tu equipaje en el hotel antes del horario de check-in).\n- Check out: hasta las 10.30 h, extendible hasta las 12.00 h, previa solicitud en recepción del hotel.\n\nPor ahora esa es nuestra primera recomendación, y pronto agregaremos más alternativas.\n\n\n## ¿Cómo me muevo?\nEn taxi, en colectivo o caminando.\n\nSi te encuentras en el centro y el clima te lo permite, te recomendamos trasladarte caminando. Y si necesitas indicaciones, no dudes en pedírnosla.\n\nSi lo prefieres, puedes transportarte en taxi privado, uber o colectivo.\n\nPuedes pedir taxi desde el mismo lugar sede del evento o desde el hotel u hostal donde te estés alojando. Te dejamos unos números de distintas compañías de taxi para que puedas llamar si lo necesitas:\n\n- [+5663 221 3111](tel:+56632213111) / [+56 63 222 8000](tel:+56632228000) / [+56 63 221 0700](tel:+56632210700)\n\n(Precio de referencia taxi: $2.000 CLP del centro a Isla Teja, precio de referencia colectivo: $700 CLP).\n\n### Transfer del aeropuerto\nEl precio del transfer en van compartida es de CLP 5.000 y el auto privado cuesta CLP 20.000.\n\nReserva en el teléfono [+562 63 222 5533](tel:+56632225533), o escríbeles por [WhatsApp](https://wa.me/56632225533).\n\n## ¿Qué hacer en el tiempo libre?\n\nHay muchas alternativas, aquí te dejamos una selección:\n\n- Disfrutar una cerveza en la Cervecería Kunstmann o en bares como [El Growler](https://www.instagram.com/el_growler/), [Bundor](https://www.instagram.com/cervezabundor/) y muchos más.\n- Comer un crudo en el clásico [@dashaus1959](https://www.instagram.com/dashaus1959/).\n- Disfruta un exquisito chocolate en Entrelagos.\n- Paseo por el río en los Taxis Solares de [@puertosolar.val](https://www.instagram.com/puertosolar.val/).\n- Visita la Feria Fluvial a orillas del río (acá podrás ver los Lobos Marinos).\n- Atraviesa al Mercado Municipal. Sí lo que buscas es un regalo típico, no puede faltar esta visita, donde además podrás probar gastronomía típica de la zona.\n\n### Hore de museos\n- Vistia el [mut.museum](https://mut.museum/) (único en Chile).\n- Recorre los diferentes [Museos de la Universidad Austral](https://www.instagram.com/museosaustral/)\n- Vistia el **submarino** ubicado en plena costanera. \n\n\n### Niebla\n¡No te pierdas la feria costumbrista en Niebla! Es el destino preferido de muchas personas que visitan la costa valdiviana.\n\n¿Conoces el Fuerte Niebla? Tienes que ir [museodeniebla.gob.cl](https://www.museodeniebla.gob.cl/)\n\n## Íconos de la ciudad\n\nY hay más lugares que típicos valdivianos, aquí te recomendamos algunos para que te planifiques y pases a visitarlos con tiempo:\n\n- Jardín Botánico ubicado en la Universidad Austral de Chile. Caminando por acá verás la inmensa variedad de vegetación que existe en Valdivia.\n- Parque Saval, un lugar para disfrutar de la naturaleza, puestos de comida, canopy, zonas de picnic, juegos infantiles y ¡mucho más!\n- La costanera. El río, la feria fluvial, el péndulo y los lobos marinos. ¡De todo! También hay paseos fluviales que duran un par de horas en los catamaranes.\n- Y en el sector regional, un parque hecho a medida, cruzado por un hermoso humedal [Parque Urbano El Bosque](https://www.instagram.com/parqueurbanoelbosque/).\n\n**Bonus:** Niebla-Corral, para ir más allá. Si tienes tiempo, intenta hacer este paseo a las afueras de la ciudad.\n\n## Dónde almorzar o tomarse un café\n\nAntes y durante el evento tendrás tiempo para poder salir a almorzar algo o tomar un rico café, te dejamos algunos lugares para ir:\n\n- En nuestra opinión **Panaka es el mejor café de Valdivia**. Es tanto así que varios cafés de la ciudad lo venden. Pero también puedes ir directo a sus [locales](https://www.instagram.com/panaka_cafe/).\n- Conoce [Café Cosas Ricas](https://www.cosasricas.cl/) y [Café de Luis](https://www.instagram.com/cafedeluis/), para un buen café (también para almorzar).\n- \n\n### Los mejores crudos\nUn imperdible si te gustan los crudos, sandwiches y cervezas. Visita [@dashaus1959](https://www.instagram.com/dashaus1959/) , clásico valdiviano, además de céntrico y concurrido.\n\n## ¿Dónde puedo ir a tomarme una cosita y comer?\n\nSí lo que quieres es disfrutar luego de una larga jornada, te recomendamos vayas al Barrio Esmeralda o a los restaurantes de Isla Teja, encontrarás excelentes lugares y buenos ambientes.\n\nAlgunos que no fallan:\n\n- El Growler, con sus cervezas valdivianas y ricas comidas [@el_growler](https://www.instagram.com/el_growler/).\n- Bundor Bar, cervezas, sandwiches y más [@cervezabundor](https://www.instagram.com/cervezabundor/).\n- [Otomano](https://goo.gl/maps/ZkEweYo3QspvzbYB9), ricas hamburguesas y, por supuesto, cervezas.\n- Carnes y pastas, en la [Parrilla de Thor](https://www.instagram.com/parrilladethor/), [Sello de Raza](https://www.instagram.com/selloderaza_restaurant/) y [Mercato](https://www.instagram.com/mercato_pasta_fresca/), u otros más innovadores como [Bar 55](https://www.instagram.com/55barycocina/) y [Mía](https://www.instagram.com/miavaldiviacl/)\n- **¿Standups y humor?** [Cava del Buho](https://www.instagram.com/cava_del_buho_restaurant/) y [La Bota](https://www.instagram.com/labotacervecera/)\n- Y por qué no, el [Sky Bar](https://www.instagram.com/skybarvaldivia/) de Dreams Valdivia, para ver la ciudad desde lo alto.\n \nAhora, si quieres bailar, no te puedes perder [Bimba](https://www.instagram.com/valdiviaesbimba/).\n\n### ¿Te sientes con ganas de más?\n \nEn Valdivia hay mucho más por hacer.\n \nRodéate de naturaleza con un trekking en el [Parque Oncol](https://www.parqueoncol.cl/) o navegando por el Santuario de la Naturaleza en Cutipay. &quot;]}]]]}" ssr="" client="load" opts="{&quot;name&quot;:&quot;SearchBar&quot;,&quot;value&quot;:true}" await-children=""><div class="min-h-[45vh]"><input class="form-input w-full text-center" placeholder="Escribe aquí para buscar..." type="text" name="search" autoComplete="off" autofocus="" value=""/><div class="row"></div></div><!--astro:end--></astro-island> </div> </section>  </main> <footer class="section bg-theme-dark"> <div class="container text-center">  <ul class="mb-8 space-x-4">  </ul>  <ul class="social-icons mb-8"> <li class="inline-block"> <a aria-label="linkedin" href="https://linkedin.com/company/9punto5" target="_blank" rel="noopener noreferrer nofollow"> <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M444.17 32H70.28C49.85 32 32 46.7 32 66.89v374.72C32 461.91 49.85 480 70.28 480h373.78c20.54 0 35.94-18.21 35.94-38.39V66.89C480.12 46.7 464.6 32 444.17 32zm-273.3 373.43h-64.18V205.88h64.18zM141 175.54h-.46c-20.54 0-33.84-15.29-33.84-34.43 0-19.49 13.65-34.42 34.65-34.42s33.85 14.82 34.31 34.42c-.01 19.14-13.31 34.43-34.66 34.43zm264.43 229.89h-64.18V296.32c0-26.14-9.34-44-32.56-44-17.74 0-28.24 12-32.91 23.69-1.75 4.2-2.22 9.92-2.22 15.76v113.66h-64.18V205.88h64.18v27.77c9.34-13.3 23.93-32.44 57.88-32.44 42.13 0 74 27.77 74 87.64z"></path></svg> </a> </li>  <li class="inline-block"> <a aria-label="twitter" href="https://twitter.com/9punto5_" target="_blank" rel="noopener noreferrer nofollow"> <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M496 109.5a201.8 201.8 0 0 1-56.55 15.3 97.51 97.51 0 0 0 43.33-53.6 197.74 197.74 0 0 1-62.56 23.5A99.14 99.14 0 0 0
